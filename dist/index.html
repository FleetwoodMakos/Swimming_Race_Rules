ast","phase":"underwater","title":"Head comes up too late","facts":"During a breaststroke pullout, the hands begin the inward sweep of the second arm stroke while the head is still submerged. The head first surfaces afterwards.","outcome":"breach","explanation":"The head must break the surface before the hands turn inward at the widest part of that second stroke.","ruleIds":["breast-pullout"]},{"id":"s15","stroke":"breast","phase":"finish","title":"No final kick","facts":"A breaststroker makes the last arm pull without a following leg kick. The head surfaced during that final incomplete cycle, and the swimmer then makes a simultaneous, separated two-hand finish with correct body position.","outcome":"legal","explanation":"The final arm stroke need not be followed by a kick. The stated head-emergence and touch conditions are satisfied.","ruleIds":["breast-finish","breast-touch"]},{"id":"s16","stroke":"fly","phase":"underwater","title":"Early surface, extra pull","facts":"After the butterfly start, a swimmer performs two underwater arm pulls, then brings the head above the surface at 12 metres.","outcome":"breach","explanation":"Surfacing within 15 metres does not cancel the separate limit of one underwater arm pull.","ruleIds":["fly-underwater"]},{"id":"s17","stroke":"fly","phase":"swimming","title":"Feet at different levels","facts":"During butterfly, the feet are slightly different heights, but all up-and-down leg movements are simultaneous and the feet never alternate relative to each other. No breaststroke kick is used and all other action requirements are met.","outcome":"legal","explanation":"The feet need not be level. The rule tests simultaneous rather than alternating movement.","ruleIds":["fly-action"]},{"id":"s18","stroke":"fly","phase":"swimming","title":"A breaststroke kick","facts":"In a mainstream butterfly race covered by this app, a swimmer deliberately uses a breaststroke kicking movement during ordinary swimming.","outcome":"breach","explanation":"The mainstream butterfly rule prohibits that kick. Masters and disability exceptions are outside this scenario’s scope.","ruleIds":["fly-action"]},{"id":"s19","stroke":"relay","phase":"departure","title":"Arms move before the touch","facts":"In a medley relay takeover from the platform, the outgoing swimmer begins swinging their arms before the incoming touch. Their feet retain platform contact until that touch, then they take off. All other conditions are met.","outcome":"legal","explanation":"The takeover condition is platform contact until the incoming touch. Preparatory arm movement alone is not a loss of foot contact.","ruleIds":["relay-exchange"]},{"id":"s20","stroke":"relay","phase":"departure","title":"Feet leave early","facts":"An official clearly observes the outgoing relay swimmer’s feet lose contact with the platform before the incoming swimmer touches the wall.","outcome":"breach","explanation":"The outgoing swimmer must retain platform contact until the incoming wall touch. This scenario identifies the breach; the referee determines the competition decision.","ruleIds":["relay-exchange","official-process"]},{"id":"s21","stroke":"im","phase":"departure","title":"Rotate, then kick","facts":"In the freestyle section of individual medley, a swimmer leaves a turn on the back, rotates past vertical onto the breast without kicking or stroking, then begins butterfly kicks. All other conditions are met.","outcome":"legal","explanation":"The medley freestyle rule expressly permits this departure, provided no kick or stroke starts until the swimmer returns to the breast.","ruleIds":["im-free"]},{"id":"s22","stroke":"im","phase":"departure","title":"Kick before rotating","facts":"In the freestyle section of individual medley, a swimmer leaves a turn on the back and makes a butterfly kick before rotating past vertical onto the breast.","outcome":"breach","explanation":"The swimmer must return to the breast before any kicking or stroking.","ruleIds":["im-free"]},{"id":"s23","stroke":"free","phase":"start","title":"A movement before the signal","facts":"Someone reports that a swimmer “moved” before the starting signal. No one describes the movement or whether it initiated the start.","outcome":"more","explanation":"The missing fact is whether the movement initiated the start. The report alone does not establish that condition; the observation and decision procedure also matters.","ruleIds":["start-signal"]},{"id":"s24","stroke":"free","phase":"finish","title":"A submerged swimmer near the finish","facts":"You are told only that a freestyle swimmer was completely submerged somewhere inside the final five metres. You do not know whether the head had passed the mark when submersion began, or whether the swimmer was reaching for the finish.","outcome":"more","explanation":"Position inside the final five metres is not enough. The head-position and finish-reaching conditions must be established.","ruleIds":["free-finish"]},{"id":"s25","stroke":"relay","phase":"swimming","title":"Same swimmer twice","facts":"A standard four-person medley relay uses the same swimmer for both the backstroke leg and the freestyle leg in the same race.","outcome":"breach","explanation":"An athlete may compete only once as a member of the team in that relay race.","ruleIds":["relay-order"]},{"id":"s26","stroke":"relay","phase":"finish","title":"Celebration in the water","facts":"A relay swimmer has finished their leg and climbed out. While other teams are still racing, they jump back into the pool to celebrate. They are not the swimmer next to compete.","outcome":"breach","explanation":"A team member who is not next to compete must not enter or re-enter before all swimmers in the race have completed the distance.","ruleIds":["relay-exit"]},{"id":"s27","stroke":"back","phase":"start","title":"No toe contact with a ledge","facts":"At a backstroke start using a ledge, both feet rest on the ledge, but no toe of the left foot touches the end wall or the face of the touchpad. This is the swimmer’s starting position.","outcome":"breach","explanation":"At least one toe of each foot must contact the end wall or touchpad face when using the ledge.","ruleIds":["back-start"]},{"id":"s28","stroke":"fly","phase":"finish","title":"Finish below the surface","facts":"After the head has passed the final 5-metre mark, a butterfly swimmer becomes completely submerged while reaching for the finish. Both separated hands touch simultaneously and the body-position and all other requirements are met.","outcome":"legal","explanation":"The stated facts satisfy the finish-submersion allowance and preserve the required two-hand contact.","ruleIds":["fly-finish","fly-touch"]},{"id":"s29","stroke":"breast","phase":"approach","title":"Only one contact is visible","facts":"At a breaststroke wall, your view of the left hand is blocked. You see the right hand touch, but have no reliable observation of whether or when the left hand touched.","outcome":"more","explanation":"To assess the contact rule you need the missing hand-contact facts. An obscured view cannot establish simultaneous two-hand contact or prove that it failed.","ruleIds":["breast-touch","official-process"]},{"id":"s30","stroke":"im","phase":"swimming","title":"Starts with backstroke","facts":"In an individual medley race, the swimmer completes the first quarter as backstroke, intending to swim butterfly second.","outcome":"breach","explanation":"Individual medley begins with butterfly, then backstroke, breaststroke and freestyle.","ruleIds":["im-order"]}],"diagrams":[{"id":"two-hands","type":"hands","title":"Same moment does not mean same height","caption":"Schematic front view of the wall face: both hands touch directly at the same instant, at different heights, without stacking. This illustrates contact only; the body-position and approach rules still apply.","ruleIds":["breast-touch","fly-touch"],"labels":["Wall face · front view","Water level","Both hands contact together","One hand may be higher","Not stacked","Contact illustration only"]},{"id":"medley-transition","type":"turn","title":"Backstroke → breaststroke: finish first","caption":"Individual medley only: finish the backstroke section on the back (9.4 and 6.5), then turn and take up the breaststroke position (7.2–7.3). The separately flagged August commentary addresses when kicking may begin. This is a sequence of rule checks, not a prescribed turn technique.","ruleIds":["im-transition","back-finish","breast-action","breast-departure-review"],"labels":["1 · Finish backstroke","9.4 + 6.5 · Touch while on the back","2 · Turn after the touch","The outgoing stroke has now finished","3 · Begin breaststroke","7.2–7.3 · Apply the next-stroke departure rules"]},{"id":"breast-sequence","type":"sequence","title":"The breaststroke pullout checkpoints","caption":"These are checkpoints, not a mandatory order for the first two boxes. The optional single butterfly kick may occur at any time before the first breaststroke kick. Head emergence is before the inward sweep of the second arm stroke.","ruleIds":["breast-pullout"],"labels":["Long arm pull","One permitted pull to the legs","Optional butterfly kick","At most one, before the first breaststroke kick","Head emergence","Before hands turn inward on the second pull"]}],"glossary":[{"id":"simultaneous","term":"Simultaneous","definition":"Happening at the same time. At the breaststroke or butterfly wall, both hands must contact at the same instant.","ruleIds":["breast-touch","fly-touch"]},{"id":"separated","term":"Separated hands","definition":"Hands not stacked on top of one another. A visible gap is not required; incidental finger contact is permitted.","ruleIds":["breast-touch","fly-touch"]},{"id":"pullout","term":"Pullout","definition":"The permitted breaststroke sequence after a start or turn, with its one long arm pull, optional single butterfly kick and head-emergence deadline.","ruleIds":["breast-pullout"]},{"id":"on-back","term":"On the back","definition":"Backstroke’s body position allows roll up to, but not including, 90 degrees from horizontal; head position is not decisive.","ruleIds":["back-body"]},{"id":"transition","term":"Medley transition","definition":"The change between stroke sections. The outgoing section must first satisfy its own finish rule.","ruleIds":["im-transition"]},{"id":"takeover","term":"Relay takeover","definition":"The exchange between swimmers. The outgoing feet retain platform contact until the incoming swimmer touches.","ruleIds":["relay-exchange"]},{"id":"referee","term":"Referee","definition":"The official with authority over the competition decision, distinct from an observing judge’s report.","ruleIds":["official-process"]}],"codeIndex":[{"code":"1","source":"wa-cr","location":"PDF p. 52"},{"code":"1.1","source":"wa-cr","location":"PDF p. 52"},{"code":"1.2","source":"wa-cr","location":"PDF p. 52"},{"code":"1.3","source":"wa-cr","location":"PDF p. 52"},{"code":"1.4","source":"wa-cr","location":"PDF p. 52"},{"code":"1.5","source":"wa-cr","location":"PDF p. 53"},{"code":"1.6","source":"wa-cr","location":"PDF p. 53"},{"code":"1.7","source":"wa-cr","location":"PDF p. 53"},{"code":"1.8","source":"wa-cr","location":"PDF p. 53"},{"code":"1.9","source":"wa-cr","location":"PDF p. 53"},{"code":"2","source":"wa-cr","location":"PDF p. 53"},{"code":"2.1","source":"wa-cr","location":"PDF p. 53"},{"code":"2.1.1","source":"wa-cr","location":"PDF p. 53"},{"code":"2.1.1.1","source":"wa-cr","location":"PDF p. 53"},{"code":"2.1.1.2","source":"wa-cr","location":"PDF p. 53"},{"code":"2.1.1.3","source":"wa-cr","location":"PDF p. 53"},{"code":"2.1.1.4","source":"wa-cr","location":"PDF p. 53"},{"code":"2.1.1.5","source":"wa-cr","location":"PDF p. 53"},{"code":"2.1.1.6","source":"wa-cr","location":"PDF p. 53"},{"code":"2.1.1.7","source":"wa-cr","location":"PDF p. 53"},{"code":"2.1.1.8","source":"wa-cr","location":"PDF p. 53"},{"code":"2.1.1.9","source":"wa-cr","location":"PDF p. 53"},{"code":"2.1. wo 6.3","location":"p61"},{"source":"wa-cr","clause":"Part Two 8.6","location":"p62"}],"dimensions":{"lengthM":50,"flagsFromWallM":5,"flagsAboveWaterM":1.8,"markerFromWallM":15,"ropeRedFromWallM":5,"floorTFromWallM":2,"floorCrossbarM":1,"floorLineMinM":0.2,"floorLineMaxM":0.3,"markerCrossbarM":0.5,"midpointM":25,"illustrativeLanes":4},"labels":[{"id":1,"label":"50 m race course","text":"The race distance runs between the two ends. Where touchpads are fitted, their faces define the measured course."},{"id":2,"label":"Backstroke flags · 5 m","text":"A flag rope crosses the pool 5 m from each end, at 1.8 m above the water."},{"id":3,"label":"15 m markers · both directions","text":"Distinct lane-rope floats mark 15 m from each departure wall. Floor crossmarks are also specified, except for pools built before 1 January 2006."},{"id":4,"label":"Lane ropes · red end sections","text":"The first and last 5 m of each rope have red floats. The rest of the rope colours can vary."},{"id":5,"label":"Floor T · 2 m from the wall","text":"The dark floor stripe ends in a 1 m crossbar, 2 m from each end wall. This is closer to the wall than the flags."},{"id":6,"label":"Halfway · 25 m","text":"A distinct float colour marks the halfway point on the lane ropes of a 50 m pool."}],"notes":["The plan shows position along the pool; it is not a construction drawing. Floor markings and surface lane ropes are different features.","Freestyle, backstroke and butterfly use the 15 m surfacing limit after the start and turns. Breaststroke uses its separate pullout sequence rule.","The floor stripe runs for 46 m between the two T-bars."]},{"id":"pool-25","type":"pool","title":"25 m pool · short course","summary":"Flags stay 5 m from each end. A 15 m point from the right wall is only 10 m from the left wall: the two departure distances overlap by 5 m.","scope":"Illustrative World Aquatics layout. The number of lanes shown is an example; venue layouts and equipment vary.","refs":[{"source":"wa-cr","clause":"Part Two 15.1.2.1","location":"p68"},{"source":"wa-cr","clause":"Part Two 15.7.6.4, 15.7.7, 15.7.9","location":"p70"},{"source":"wa-cr","clause":"Part Two 15.9.1","location":"p71"},{"source":"wa-cr","clause":"Part Two 15.13.1–15.13.4","location":"p72"},{"source":"wa-cr","clause":"Part Two 5.3","location":"p60"},{"source":"wa-cr","clause":"Part Two 6.3","location":"p61"},{"source":"wa-cr","clause":"Part Two 8.6","location":"p62"}],"dimensions":{"lengthM":25,"flagsFromWallM":5,"flagsAboveWaterM":1.8,"markerFromWallM":15,"ropeRedFromWallM":5,"floorTFromWallM":2,"floorCrossbarM":1,"floorLineMinM":0.2,"floorLineMaxM":0.3,"markerCrossbarM":0.5,"midpointM":12.5,"illustrativeLanes":4},"labels":[{"id":1,"label":"25 m race course","text":"The race distance runs between the two ends. Where touchpads are fitted, their faces define the measured course."},{"id":2,"label":"Backstroke flags · still 5 m","text":"The flags are 5 m from both walls, just as in a 50 m pool. Their ropes are 1.8 m above the water."},{"id":3,"label":"15 m from which end?","text":"From the left wall, the 15 m point is at 15 m. From the right wall, it is at 10 m on the same left-to-right ruler."},{"id":4,"label":"Lane ropes · red end sections","text":"Red floats extend 5 m from both ends. Distinct float colours identify the two 15 m points."},{"id":5,"label":"Floor T · 2 m from the wall","text":"Each T-bar is 2 m from its nearest wall. The stripe between them is 21 m long."}],"notes":["The plan shows position along the pool; it is not a construction drawing. Floor markings and surface lane ropes are different features.","The 15 m distances overlap; they do not move to the middle of the pool. The halfway point is 12.5 m, not 15 m.","Floor crossmarks at the two 15 m points have an exception for pools built before 1 January 2006. The head-up rule still applies even if a floor mark is absent.","Freestyle, backstroke and butterfly use the 15 m surfacing limit. Breaststroke uses its separate pullout sequence rule."]},{"id":"lane-markings","type":"markings","title":"Read the lane markings","summary":"The floor T is 2 m from the wall; the flags and red rope sections identify 5 m; the distinct rope markers identify 15 m from each departure wall.","scope":"These labels distinguish the floor, water surface and end wall. The enlarged views are schematic.","refs":[{"source":"wa-cr","clause":"Part Two 15.7.7, 15.7.9–15.7.10","location":"p70"},{"source":"wa-cr","clause":"Part Two 15.9.1","location":"p71"},{"source":"wa-cr","clause":"Part Two 15.13.1–15.13.4","location":"p72"}],"dimensions":{"lengthM":20,"floorTFromWallM":2,"floorCrossbarM":1,"floorLineMinM":0.2,"floorLineMaxM":0.3,"ropeRedFromWallM":5,"markerFromWallM":15,"markerCrossbarM":0.5,"flagsFromWallM":5,"flagsAboveWaterM":1.8,"wallCrossbarM":0.5,"wallCrossbarBelowWaterM":0.3},"labels":[{"id":1,"label":"Floor T · 2 m out","text":"The end of the long floor stripe is 2 m from the wall, providing an underwater approach reference."},{"id":2,"label":"T-bar · 1 m across","text":"This crossbar spans 1 m across the lane. It has the same thickness as the long stripe."},{"id":3,"label":"Floor stripe · 20–30 cm wide","text":"A dark stripe along the lane centre contrasts with the pool floor."},{"id":4,"label":"Red rope section · 5 m","text":"The red surface floats extend 5 m from the end wall; the backstroke flags are also 5 m from that wall."},{"id":5,"label":"15 m marker","text":"A contrasting float marks the distance on the lane rope. The floor crossbar, where required, is 50 cm across and measured to its centre."},{"id":6,"label":"50 m pool midpoint","text":"In a 50 m pool, a further distinct float colour marks 25 m. This midpoint is not shown in the cropped lane view."},{"id":7,"label":"End-wall target","text":"The wall or touchpad target has a 50 cm crossbar, centred 30 cm below the surface. It is separate from the floor T."}],"notes":["The floor stripe is 46 m long in a 50 m pool and 21 m long in a 25 m pool.","The floor 15 m crossmark requirement excludes pools built before 1 January 2006.","Do not treat a floor T as the 5 m flag line or as a 15 m surfacing marker."]},{"id":"starting-block","type":"block","title":"The starting block","summary":"The platform used for a dive start is above the water. The backstroke handgrips sit lower; the backstroke ledge is a separate foot support at water level.","scope":"World Aquatics dimensions are shown for identification. Follow the venue and meet's permitted start arrangements.","refs":[{"source":"wa-cr","clause":"Part Two 15.8.1–15.8.4, 15.8.6","location":"p70"},{"source":"wa-cr","clause":"Part Two 15.10.1","location":"p71"},{"source":"se-start-depth","clause":"Minimum diving depths FAQs","location":"Questions on racing starts and pools shallower than 1.35 m"},{"source":"wa-cr","clause":"Part Two 15.4.1–15.4.2","location":"p68"}],"dimensions":{"platformHeightMinM":0.5,"platformHeightMaxM":0.75,"platformWidthMinM":0.5,"platformDepthMinM":0.5,"platformSlopeMaxDegrees":10,"gripHeightMinM":0.3,"gripHeightMaxM":0.6,"depthMinM":1.35,"depthZoneStartM":1,"depthZoneEndMinM":6},"labels":[{"id":1,"label":"Platform · 50–75 cm above water","text":"The block is rigid, with a slip-resistant top. Its height is measured from the water surface."},{"id":2,"label":"Top · at least 50 × 50 cm","text":"The platform must be at least this wide and deep, with grip access at its front and sides."},{"id":3,"label":"Top slope · no more than 10°","text":"The top can slope within this limit. The platform itself must not provide spring assistance."},{"id":4,"label":"Backstroke handgrips · 30–60 cm high","text":"These starting grips are above the water, aligned with the end-wall plane. They must not project into the pool beyond the wall."},{"id":5,"label":"Optional adjustable rear wedge","text":"A back plate on top of the block can support the rear foot in a dive start. It is different from the backstroke ledge."},{"id":6,"label":"Lane number","text":"The block number is shown clearly on all four sides."},{"id":7,"label":"Waterline, wall and ledge","text":"The separate backstroke ledge sits around water level, against the wall or touchpad face."}],"notes":["WA 15.8.4 specifies at least 1.35 m depth from 1 m to at least 6 m out from the end wall where starting blocks are used.","Swim England requires in-water starts where the pool cannot meet its 1.35 m racing-entry depth requirement. This diagram does not authorise a dive at a particular venue.","The higher minimum depths specified for Olympic and World Aquatics championship pools are separate event standards."]},{"id":"backstroke-ledge","type":"ledge","title":"The backstroke ledge","summary":"The ledge supports the feet for a backstroke start. When it is used, at least one toe on each foot still touches the end wall or touchpad face.","scope":"Enlarged schematic of the World Aquatics ledge specification. The adjustment range is measured relative to the water level.","refs":[{"source":"wa-cr","clause":"Part Two 15.10.1.1–15.10.1.3","location":"p71"},{"source":"wa-cr","clause":"Part Two 6.1","location":"p61"}],"dimensions":{"adjustmentAboveM":0.04,"adjustmentBelowM":0.04,"lengthMinM":0.6,"heightM":0.08,"widthM":0.02,"slopeDegrees":10},"labels":[{"id":1,"label":"Adjustment · 4 cm above or below water","text":"The ledge setting must stay within this vertical range."},{"id":2,"label":"At least 60 cm across","text":"This is the ledge's length across the lane, rather than its projection out from the wall."},{"id":3,"label":"Section · 8 cm high, 2 cm wide","text":"The enlarged side view distinguishes the ledge's height from its narrow section width."},{"id":4,"label":"Ledge slope · 10°","text":"The ledge specification sets a 10° slope. This is separate from the block platform's maximum slope."},{"id":5,"label":"A toe of each foot on the wall","text":"At least one toe from each foot must contact the wall or pad face. Toes must not curl over the touchpad's upper edge."}],"notes":["Backstroke starts are in the water, facing the starting end, with both hands holding the starting grips.","Standing on or in the gutter, or hooking toes over its lip, is prohibited.","The separate rear wedge on top of a dive-start block is not the backstroke ledge."]}],"excerpts":[{"ruleId":"back-finish","source":"wa-cr","clause":"6.5","text":"must touch the finish wall while on the back.","kind":"Exact excerpt"},{"ruleId":"im-transition","source":"wa-cr","clause":"9.4","text":"Each stroke section must be finished in accordance with the applicable rules for that stroke.","kind":"Exact rule"}],"rulebook":[{"code":"1.1","category":"Competition programmes","title":"Which competitions Part Two governs","statement":"Part Two governs Olympic swimming, World Aquatics swimming events and other swimming competitions conducted under the World Aquatics Competition Regulations.","plain":"This is the swimming-specific rule section. A domestic event’s adoption and local conditions still matter.","source":"wa-cr","location":"PDF p. 52","status":"verified","issue":"","relatedRuleIds":[]},{"code":"1.2","category":"Competition programmes","title":"Olympic swimming event programme","statement":"For both men and women: freestyle 50, 100, 200, 400, 800 and 1500 metres; backstroke, breaststroke and butterfly 50, 100 and 200 metres; individual medley 200 and 400 metres; freestyle relays 4 × 100 and 4 × 200 metres; medley relay 4 × 100 metres. The mixed event listed is the 4 × 100-metre medley relay.","plain":"The Olympic list specifies both the individual distances and the relays. It does not add a 100m individual medley or a mixed freestyle relay.","source":"wa-cr","location":"PDF p. 52","status":"verified","issue":"","relatedRuleIds":[]},{"code":"1.3","category":"Competition programmes","title":"World Aquatics Championships event programme","statement":"For both men and women: freestyle 50, 100, 200, 400, 800 and 1500 metres; backstroke, breaststroke and butterfly 50, 100 and 200 metres; individual medley 200 and 400 metres; freestyle relays 4 × 100 and 4 × 200 metres; medley relay 4 × 100 metres. The listed mixed event is the 4 × 100-metre medley relay.","plain":"This is the programme printed in the February 2026 regulations for the long-course World Championships.","source":"wa-cr","location":"PDF p. 52","status":"verified","issue":"","relatedRuleIds":[]},{"code":"1.4","category":"Competition programmes","title":"World Championships in a 25m pool: event programme","statement":"For both men and women, the 25m World Championships list freestyle 50, 100, 200, 400, 800 and 1500 metres; backstroke, breaststroke and butterfly 50, 100 and 200 metres; individual medley 100, 200 and 400 metres; freestyle relays 4 × 100 and 4 × 200 metres; and a 4 × 100-metre medley relay. Mixed relays are 4 × 50-metre freestyle, 4 × 50-metre medley and 4 × 100-metre medley.","plain":"Short-course competition includes the 100m individual medley and the listed mixed 4 × 50m relays. Do not assume every record-recognised event is on this championship programme.","source":"wa-cr","location":"PDF p. 52","status":"verified","issue":"","relatedRuleIds":[]},{"code":"1.5","category":"Competition programmes","title":"World Junior Championships event programme","statement":"For both men and women: freestyle 50, 100, 200, 400, 800 and 1500 metres; backstroke, breaststroke and butterfly 50, 100 and 200 metres; individual medley 200 and 400 metres; freestyle relays 4 × 100 and 4 × 200 metres; medley relay 4 × 100 metres. Mixed relays are 4 × 100-metre freestyle and 4 × 100-metre medley.","plain":"The junior championship programme includes both mixed 4 × 100m relays. Age eligibility is set out separately in section 13.","source":"wa-cr","location":"PDF p. 53","status":"verified","issue":"","relatedRuleIds":[]},{"code":"1.6","category":"Competition programmes","title":"World Cup programme is published annually","statement":"World Aquatics determines and publishes the Swimming World Cup programme each year.","plain":"Check that year’s published World Cup programme; this clause does not set a permanent list of events.","source":"wa-cr","location":"PDF p. 53","status":"verified","issue":"","relatedRuleIds":[]},{"code":"1.7","category":"Competition programmes","title":"Pool length for qualifying entry times","statement":"Olympic, World Championships and World Junior Championships qualifying entry times must come from 50m pools. For the World Swimming Championships held in 25m pools, qualifying times may come from either 25m or 50m pools.","plain":"A short-course time is not accepted as a qualifying entry time for the three named long-course championships under this provision.","source":"wa-cr","location":"PDF p. 53","status":"verified","issue":"","relatedRuleIds":[]},{"code":"1.8","category":"Competition programmes","title":"Pre-competition inspection and approval","statement":"Before Olympic swimming and the World Aquatics Championships, the World Aquatics Technical Delegate inspects and approves the pools and technical equipment, including their compliance with Part Two section 15.","plain":"The named major events require technical inspection and approval of the competition facilities.","source":"wa-cr","location":"PDF p. 53","status":"verified","issue":"","relatedRuleIds":[]},{"code":"1.9","category":"Competition programmes","title":"Leaving the final call room","statement":"The competition Management Committee sets the preparation and presentation protocol that athletes must follow when leaving the final call room for heats, semi-finals and finals.","plain":"Follow the event’s instructions for moving from the last call room onto the pool deck.","source":"wa-cr","location":"PDF p. 53","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.1","category":"Officials and decisions","title":"Enough officials for a safe and fair competition","statement":"The organiser must provide enough technical officials to protect the competition’s safety, fairness and integrity.","plain":"The meet needs enough officials to run safely and fairly.","source":"wa-cr","location":"PDF p. 53","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.1.1","category":"Officials and decisions","title":"Minimum staffing at major World Aquatics meets","statement":"For the Olympic Games, World Aquatics Championships and World Aquatics Swimming Championships (25m), the Management Committee must meet at least the staffing requirements in 2.1.1.1–2.1.1.13. These prescribe referees, starters, stroke and turn judges, reserves, control-room and video staff, call-room staff, a resolution desk judge and warm-up supervisors.","plain":"These named major meets have minimum numbers for each official role. The following clauses give those numbers.","source":"wa-cr","location":"PDF p. 53","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.1.1.1","category":"Officials and decisions","title":"Minimum referees","statement":"For the Olympic Games, World Aquatics Championships and World Aquatics Swimming Championships (25m), the minimum appointment is 2 referees.","plain":"The minimum is two referees at those named meets.","source":"wa-cr","location":"PDF p. 53","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.1.1.2","category":"Officials and decisions","title":"Minimum starters","statement":"For the Olympic Games, World Aquatics Championships and World Aquatics Swimming Championships (25m), the minimum appointment is 2 starters.","plain":"The minimum is two starters at those named meets.","source":"wa-cr","location":"PDF p. 53","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.1.1.3","category":"Officials and decisions","title":"Minimum stroke judges","statement":"For the Olympic Games, World Aquatics Championships and World Aquatics Swimming Championships (25m), the minimum appointment is 4 judges of stroke.","plain":"The minimum is four stroke judges at those named meets.","source":"wa-cr","location":"PDF p. 53","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.1.1.4","category":"Officials and decisions","title":"Minimum chief turn inspectors","statement":"For the Olympic Games, World Aquatics Championships and World Aquatics Swimming Championships (25m), the minimum appointment is 2 chief inspectors of turns.","plain":"The minimum is two chief turn inspectors at those named meets.","source":"wa-cr","location":"PDF p. 53","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.1.1.5","category":"Officials and decisions","title":"Minimum turn inspectors","statement":"For the Olympic Games, World Aquatics Championships and World Aquatics Swimming Championships (25m), the minimum appointment is 16 turn inspectors with 8 lanes, or 20 with 10 lanes.","plain":"Provide two turn inspectors per lane across the two ends: 16 for eight lanes or 20 for ten.","source":"wa-cr","location":"PDF p. 53","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.1.1.6","category":"Officials and decisions","title":"Reserve turn inspectors","statement":"For the Olympic Games, World Aquatics Championships and World Aquatics Swimming Championships (25m), the minimum appointment is 2 reserve turn inspectors.","plain":"Two additional turn inspectors serve as reserves.","source":"wa-cr","location":"PDF p. 53","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.1.1.7","category":"Officials and decisions","title":"Minimum control-room supervisor","statement":"For the Olympic Games, World Aquatics Championships and World Aquatics Swimming Championships (25m), the minimum appointment is 1 control-room supervisor.","plain":"One supervisor oversees the control room.","source":"wa-cr","location":"PDF p. 53","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.1.1.8","category":"Officials and decisions","title":"Minimum video-review supervisor","statement":"For the Olympic Games, World Aquatics Championships and World Aquatics Swimming Championships (25m), the minimum appointment is 1 video-review supervisor.","plain":"One supervisor oversees video review.","source":"wa-cr","location":"PDF p. 53","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.1.1.9","category":"Officials and decisions","title":"Minimum video-review judges","statement":"For the Olympic Games, World Aquatics Championships and World Aquatics Swimming Championships (25m), the minimum appointment is 4 video-review judges with 8 lanes, or 5 with 10 lanes.","plain":"The video-review team has at least four judges for eight lanes or five for ten.","source":"wa-cr","location":"PDF p. 53","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.1.1.10","category":"Officials and decisions","title":"Minimum call-room supervisor","statement":"For the Olympic Games, World Aquatics Championships and World Aquatics Swimming Championships (25m), the minimum appointment is 1 call-room supervisor.","plain":"One supervisor oversees the call room.","source":"wa-cr","location":"PDF p. 53","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.1.1.11","category":"Officials and decisions","title":"Minimum call-room judges","statement":"For the Olympic Games, World Aquatics Championships and World Aquatics Swimming Championships (25m), the minimum appointment is 4 call-room judges with 8 lanes, or 5 with 10 lanes.","plain":"The call room has at least four judges for eight lanes or five for ten.","source":"wa-cr","location":"PDF p. 53","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.1.1.12","category":"Officials and decisions","title":"Minimum resolution desk judge","statement":"For the Olympic Games, World Aquatics Championships and World Aquatics Swimming Championships (25m), the minimum appointment is 1 resolution desk judge.","plain":"One judge receives queries at the resolution desk.","source":"wa-cr","location":"PDF p. 53","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.1.1.13","category":"Officials and decisions","title":"Minimum warm-up supervisors","statement":"For the Olympic Games, World Aquatics Championships and World Aquatics Swimming Championships (25m), the minimum appointment is 2 warm-up supervisors.","plain":"At least two supervisors oversee warm-up.","source":"wa-cr","location":"PDF p. 53","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.1.2","category":"Officials and decisions","title":"Staffing at other international meets","statement":"Other international competitions must use the same official numbers as 2.1.1 unless World Aquatics, the relevant Continental Organisation or the relevant Member Federation approves fewer. The organiser is responsible for the appointments.","plain":"An international meet needs the same staffing unless the appropriate governing body approves a reduction.","source":"wa-cr","location":"PDF p. 53","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.1.3","category":"Officials and decisions","title":"When electronic officiating is unavailable","statement":"If neither automatic nor semi-automatic officiating equipment is available at an international competition, including because of exceptional circumstances or equipment failure, the manual arrangements in 2.1.3.1 apply and finish judges may be appointed under 2.1.3.2.","plain":"A meet without either electronic system uses the specified manual arrangements; finish judges are an option.","source":"wa-cr","location":"PDF p. 54","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.1.3.1","category":"Officials and decisions","title":"Manual timing team after equipment loss","statement":"At an international meet with neither automatic nor semi-automatic officiating equipment available, Part Two 11.2 governs timing. One chief timekeeper and 2 timekeepers for each lane perform the function otherwise carried out by the automatic equipment.","plain":"Use the manual-timing rules, one chief timekeeper and two timekeepers per lane.","source":"wa-cr","location":"PDF p. 54","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.1.3.2","category":"Officials and decisions","title":"Optional finish judges without electronic systems","statement":"When neither automatic nor semi-automatic officiating equipment is available at an international meet, the organiser may appoint finish judges.","plain":"Finish judges may be added under this equipment-unavailable arrangement; this clause does not make their appointment compulsory.","source":"wa-cr","location":"PDF p. 54","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.2","category":"Officials and decisions","title":"Independent decisions within each official’s remit","statement":"Except where another Part Two provision says otherwise, each technical official decides matters within their own assigned role and responsibility independently of other officials or anyone else.","plain":"Officials make their own decisions within their assigned duties, subject to the specific rules.","source":"wa-cr","location":"PDF p. 54","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"2.3.1","category":"Officials and decisions","title":"Referee authority over officials and meet conduct","statement":"The referee directs all technical officials, approves their assignments and briefs them on any special event features or rules. The referee enforces World Aquatics rules and decisions and determines matters about actual meet or event conduct unless another person has that decision assigned under the applicable World Aquatics rules.","plain":"The referee leads the officials and resolves meet-conduct matters within the referee’s authority.","source":"wa-cr","location":"PDF p. 54","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"2.3.2","category":"Officials and decisions","title":"Referee intervention and appeals","statement":"The referee may intervene at any stage to secure compliance with these regulations or other World Aquatics rules. Appeals from a referee decision follow the process in Part One 12.","plain":"The referee can step in during the meet; an appeal uses the specified separate process.","source":"wa-cr","location":"PDF p. 54","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"2.3.3","category":"Officials and decisions","title":"Referee determination of placing","statement":"If neither automatic nor semi-automatic officiating equipment is being used and the meet uses finish judges, the referee determines placing when needed.","plain":"With finish judges and no electronic officiating system, the referee settles the placing when necessary.","source":"wa-cr","location":"PDF p. 54","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"2.3.4","category":"Officials and decisions","title":"Keeping officials in post","statement":"The referee ensures that all necessary officials remain in their assigned posts throughout the competition. The referee may add officials when needed or replace an official judged absent, unable to act or ineffective.","plain":"The referee keeps the officiating team adequately staffed and can add or replace people when necessary.","source":"wa-cr","location":"PDF p. 54","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"2.3.5","category":"Officials and decisions","title":"Referee’s role in the starting procedure","statement":"This provision points to the separate rules governing the referee during starts. Its February cross-reference is printed as Article 0; the official August commentary identifies that as an error and directs readers to Part Two Article 4.","plain":"Use the starting procedures in Article 4. The printed reference to Article 0 is an acknowledged source error.","source":"wa-cr","location":"PDF p. 54","status":"verified","issue":"Source wording note: the February document prints Article 0. The World Aquatics commentary dated 6 August 2026, p1, explicitly corrects it to Article 4; this is a documented correction, not an inferred replacement.","relatedRuleIds":["start-signal","dive-start"]},{"code":"2.3.6","category":"Officials and decisions","title":"Who confirms an early start","statement":"When both the starter and referee observe and confirm that a swimmer began the start before the signal, the referee disqualifies the swimmer. If automatic officiating equipment is available, the referee reviews the relevant footage to verify the disqualification; the referee and starter need not agree in that review route.","plain":"An early start requires the applicable observation or footage-review process. Joint visual confirmation and automatic-footage review are different routes.","source":"wa-cr","location":"PDF p. 54","status":"verified","issue":"","relatedRuleIds":["start-signal","official-process"]},{"code":"2.3.7","category":"Officials and decisions","title":"Other breaches: report and referee decision","statement":"The referee must disqualify for another breach personally witnessed by the referee, and may disqualify on another technical official’s verbal breach report. After the referee confirms the disqualification, the reporting official completes and signs a card specifying the event, lane and infraction.","plain":"The reporting official supplies the observed facts; the referee confirms the decision, followed by the signed card.","source":"wa-cr","location":"PDF p. 54","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"2.3.8","category":"Officials and decisions","title":"Assigning relay take-off observers","statement":"The referee appoints technical officials to judge whether the next swimmer’s feet still contact the platform when the incoming teammate touches to complete their quarter of the relay distance.","plain":"Assigned officials compare the incoming relay touch with the outgoing swimmer’s platform contact.","source":"wa-cr","location":"PDF p. 54","status":"verified","issue":"","relatedRuleIds":["relay-exchange","official-process"]},{"code":"2.4.1","category":"Officials and decisions","title":"Supervising electronic officiating equipment","statement":"The control-room supervisor oversees operation of the automatic and/or semi-automatic officiating equipment used at the meet.","plain":"The control-room supervisor oversees the electronic officiating systems.","source":"wa-cr","location":"PDF p. 54","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.4.2","category":"Officials and decisions","title":"Checking results and relay exchanges","statement":"The control-room supervisor checks computer result outputs and the relay-exchange printout, and reports any early relay take-off to the referee.","plain":"Check the result and relay timing records, then report early take-offs to the referee.","source":"wa-cr","location":"PDF p. 54","status":"verified","issue":"","relatedRuleIds":["relay-exchange"]},{"code":"2.4.3","category":"Officials and decisions","title":"Optional video-timing check of relay take-offs","statement":"The control-room supervisor may examine video timing to confirm an early relay take-off.","plain":"Video timing can be checked when confirming a suspected early takeover.","source":"wa-cr","location":"PDF p. 54","status":"verified","issue":"","relatedRuleIds":["relay-exchange"]},{"code":"2.4.4","category":"Officials and decisions","title":"Control-room results administration","statement":"The control-room supervisor handles withdrawals following heats or semi-finals, enters results on official forms, lists newly established records and, where applicable, maintains award scoring under Part One 11.","plain":"The control room also handles withdrawals, official result records, new records and applicable award scores.","source":"wa-cr","location":"PDF p. 54","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.5.1","category":"Officials and decisions","title":"Starter control after the referee’s handover","statement":"Once the referee transfers control under Part Two 4.1 or 4.2, the starter controls the swimmers until racing begins and conducts the start using Article 4.","plain":"The starter takes over from the referee for the starting procedure.","source":"wa-cr","location":"PDF p. 54","status":"verified","issue":"","relatedRuleIds":["start-signal","dive-start"]},{"code":"2.5.2","category":"Officials and decisions","title":"Delaying or disobeying at the start","statement":"The starter reports a swimmer’s delay, deliberate disobedience of a starter instruction or other start misconduct to the referee. The referee may disqualify that swimmer.","plain":"Start misconduct is reported to the referee, who may disqualify the swimmer.","source":"wa-cr","location":"PDF p. 55","status":"verified","issue":"","relatedRuleIds":["start-signal","official-process"]},{"code":"2.5.3","category":"Officials and decisions","title":"Fair-start decision and recall","statement":"The starter decides whether a start was fair, subject to the referee’s decision. An unfair start results in recall of the swimmers and a restart.","plain":"The starter judges fairness under the referee’s authority; an unfair start is recalled and restarted.","source":"wa-cr","location":"PDF p. 55","status":"verified","issue":"This fairness/recall provision is separate from Article 4.4.1, which lets a race continue when the signal preceded declaration of an individual early-start disqualification.","relatedRuleIds":["start-signal"]},{"code":"2.5.4","category":"Officials and decisions","title":"Starter position and signal visibility","statement":"For the start, the starter stands at the poolside within approximately 5 metres of the starting end. The position must let timekeepers see and/or hear the signal and let swimmers hear it.","plain":"The starter stands near the start end where swimmers can hear the signal and timekeepers can see or hear it.","source":"wa-cr","location":"PDF p. 55","status":"verified","issue":"","relatedRuleIds":["start-signal"]},{"code":"2.5.5","category":"Officials and decisions","title":"Starter reports observed breaches","statement":"The starter reports any observed false start or other breach to the referee.","plain":"The starter reports what they observe to the referee.","source":"wa-cr","location":"PDF p. 55","status":"verified","issue":"","relatedRuleIds":["start-signal","official-process"]},{"code":"2.6.1","category":"Officials and decisions","title":"Call-room assembly, absence and equipment concerns","statement":"Call-room judges assemble swimmers before each race. They report possible swimwear or advertising breaches, and any swimmer absent when called, to the call-room supervisor. The supervisor decides whether the swimwear or advertising rules were breached and reports a confirmed breach to the referee.","plain":"Call-room staff assemble swimmers and raise absence or kit concerns. The supervisor assesses kit-rule concerns before reporting a breach.","source":"wa-cr","location":"PDF p. 55","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.7.1","category":"Officials and decisions","title":"Chief inspector supervises turn inspectors","statement":"The chief inspector of turns ensures the turn inspectors carry out their duties during the competition.","plain":"The chief inspector oversees the turn-inspection team.","source":"wa-cr","location":"PDF p. 55","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"2.8.1","category":"Officials and decisions","title":"Turn inspectors for every lane at both ends","statement":"One inspector is assigned to each lane at each end to check the relevant requirements following the start, at every turn and at the finish.","plain":"Turn inspectors watch their lane’s starts, turns and finishes from the two ends.","source":"wa-cr","location":"PDF p. 55","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"2.8.2","category":"Officials and decisions","title":"Turn-inspector observation after a start","statement":"At the starting end, the inspector’s remit runs from the starting signal through completion of the first arm stroke. In breaststroke it extends through completion of the second arm stroke instead.","plain":"The start check includes the first arm stroke, or the second in breaststroke.","source":"wa-cr","location":"PDF p. 55","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"2.8.3","category":"Officials and decisions","title":"Turn-inspector observation around a turn","statement":"The turn-inspection period starts when the last arm stroke before contact begins and ends when the first outgoing arm stroke is complete. In breaststroke the period ends after completion of the second outgoing arm stroke.","plain":"Watch the incoming final stroke, contact and outgoing first stroke; breaststroke coverage continues through the second outgoing stroke.","source":"wa-cr","location":"PDF p. 55","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"2.8.4","category":"Officials and decisions","title":"Turn-inspector observation at a finish","statement":"An inspector’s finish remit begins at the start of the last arm stroke before the swimmer touches the wall.","plain":"The finish check begins with the final arm stroke, before contact.","source":"wa-cr","location":"PDF p. 55","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"2.8.5","category":"Officials and decisions","title":"Installing and removing a backstroke ledge","statement":"Where a backstroke ledge is used, the starting-end inspector installs and removes the ledge in their lane. The ledge is set to zero after installation.","plain":"The lane’s inspector fits the ledge at the zero setting and removes it.","source":"wa-cr","location":"PDF p. 55","status":"verified","issue":"","relatedRuleIds":["back-start"]},{"code":"2.8.6","category":"Officials and decisions","title":"Lap counting and lap cards in distance freestyle","statement":"In individual 400 m, 800 m and 1500 m freestyle, inspectors at both ends record the laps completed in their lanes. At the turning end, odd-numbered lap cards show the laps remaining. The local organising committee selects deck-level or in-water display according to venue availability. Electronic displays, including underwater ones, may serve the same purpose.","plain":"For these distance races, officials count laps and show the remaining odd-numbered laps at the far end. The display may be physical or electronic.","source":"wa-cr","location":"PDF p. 55","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.8.7","category":"Officials and decisions","title":"Distance-freestyle warning signal","statement":"In individual 400 m, 800 m and 1500 m freestyle, the starting-end inspector signals when their swimmer has 2 laps plus 5 metres remaining. After the turn the signal is repeated until the swimmer reaches the lane-rope 5-metre mark. A whistle or bell may be used.","plain":"Give the warning at two laps plus five metres to go, and repeat it after the turn until the swimmer reaches the five-metre mark.","source":"wa-cr","location":"PDF p. 55","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.8.8","category":"Officials and decisions","title":"Inspectors judge relay take-offs","statement":"At the starting end, inspectors judge whether the outgoing swimmer still contacts the platform at the preceding swimmer’s wall touch. Available automatic equipment designed to assess relay take-offs must also be used.","plain":"Compare the incoming touch with outgoing platform contact, using available take-off equipment as well.","source":"wa-cr","location":"PDF p. 55","status":"verified","issue":"","relatedRuleIds":["relay-exchange"]},{"code":"2.8.9","category":"Officials and decisions","title":"Turn inspectors report observed breaches","statement":"Inspectors report to the referee any breach observed within their remit, including a breach of the applicable stroke rules.","plain":"An inspector reports observed infractions in their assigned area to the referee.","source":"wa-cr","location":"PDF p. 55","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"2.9.1","category":"Officials and decisions","title":"Stroke judges on both pool sides","statement":"Stroke judges are positioned along both sides of the pool.","plain":"There are stroke judges on each side of the course.","source":"wa-cr","location":"PDF p. 55","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"2.9.2","category":"Officials and decisions","title":"Stroke judges check action and assist at walls","statement":"Each stroke judge checks compliance with the event’s swimming-style rules and observes turns and finishes to assist the turn inspectors.","plain":"Watch the designated stroke and help check the turns and finishes.","source":"wa-cr","location":"PDF p. 55","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"2.9.3","category":"Officials and decisions","title":"Stroke judges report observed breaches","statement":"Stroke judges report to the referee any breach they observe within their remit, including a breach of the stroke rules.","plain":"The stroke judge reports observed infractions to the referee.","source":"wa-cr","location":"PDF p. 55","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"2.9.4","category":"Officials and decisions","title":"Checking the backstroke flags before racing","statement":"Before each backstroke or medley event begins, stroke judges ensure the backstroke turn indicators are installed 5 metres from both end walls.","plain":"Check that the backstroke flags are five metres from each wall before backstroke or medley starts.","source":"wa-cr","location":"PDF p. 56","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.10.1","category":"Officials and decisions","title":"Chief timekeeper assignments and reserves","statement":"When the chief-timekeeper role is required under 2.1.3, that official assigns the timekeepers’ seats and lanes. Without automatic or semi-automatic officiating equipment, each lane has 2 timekeepers plus at least 1 additional reserve timekeeper for the meet, available when a watch or timekeeper cannot provide a time.","plain":"Assign seats and lanes; the manual setup needs two timekeepers per lane and at least one reserve.","source":"wa-cr","location":"PDF p. 56","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.10.2","category":"Officials and decisions","title":"Chief timekeeper records the winner","statement":"When required under 2.1.3, the chief timekeeper must record a time for the winner of every race.","plain":"The chief timekeeper records a time for each race winner.","source":"wa-cr","location":"PDF p. 56","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.10.3","category":"Officials and decisions","title":"Collecting timing cards and inspecting watches","statement":"When this role is required under 2.1.3, the chief timekeeper collects each lane’s recorded-time card and checks the timekeepers’ watches if needed.","plain":"Collect the timing cards and inspect watches when necessary.","source":"wa-cr","location":"PDF p. 56","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.10.4","category":"Officials and decisions","title":"Recording each lane’s official time","statement":"When this role is required under 2.1.3, the chief timekeeper enters the official time on every lane’s card.","plain":"The chief timekeeper records the official result on each lane card.","source":"wa-cr","location":"PDF p. 56","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.11.1","category":"Officials and decisions","title":"Timekeeper’s assigned swimmer","statement":"When timekeepers are required under 2.1.3, each records the swimmer’s time in their assigned lane using the manual-timing rules in Part Two 11.2.","plain":"Time your assigned lane under the manual-timing procedure.","source":"wa-cr","location":"PDF p. 56","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.11.2","category":"Officials and decisions","title":"Starting, stopping and intermediate times","statement":"Timekeepers start their watches on the starting signal and stop them when their lane’s swimmer completes the race distance. In races longer than 100 m, they also record intermediate times if the chief timekeeper instructs them to do so.","plain":"Start on the signal and stop at completion of the distance. Record splits in races over 100 metres when instructed.","source":"wa-cr","location":"PDF p. 56","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.11.3","category":"Officials and decisions","title":"Submitting and resetting watches","statement":"Immediately after the race, lane timekeepers write down their watch times and give the card to the chief timekeeper. They present watches for inspection if requested. They reset watches on the referee’s short whistles announcing the next race.","plain":"Write and hand over the times promptly; show the watches if asked. Reset at the next race’s short whistles.","source":"wa-cr","location":"PDF p. 56","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.11.4","category":"Officials and decisions","title":"Timekeepers alongside electronic systems","statement":"Unless video timing is in use, the full timekeeper complement specified in 2.10 may still be needed even when automatic or semi-automatic officiating equipment is operating.","plain":"Electronic equipment does not necessarily remove the need for a full timekeeper team; video timing changes this provision.","source":"wa-cr","location":"PDF p. 56","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.12.1","category":"Officials and decisions","title":"Finish judges’ view","statement":"Where finish judges are used under 2.1.3, they stand in line with the finish and must continuously have a clear view of both the course and finish line.","plain":"Finish judges need an unobstructed view from the finish line.","source":"wa-cr","location":"PDF p. 56","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.12.2","category":"Officials and decisions","title":"Finish judges report placing","statement":"After each race, finish judges determine the swimmers’ placing within their assigned tasks and report it to the referee.","plain":"Report the finishing order covered by your assignment to the referee.","source":"wa-cr","location":"PDF p. 56","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.12.3","category":"Officials and decisions","title":"Separating finish judging from timekeeping","statement":"A finish judge cannot also act as a timekeeper for the same race, subject to the stated exception for a timekeeper operating semi-automatic officiating equipment under Part Two 15.16.5.","plain":"Do not combine finish judging and timekeeping in the same race except for the specific semi-automatic-equipment exception.","source":"wa-cr","location":"PDF p. 56","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.13.1","category":"Officials and decisions","title":"Chief recorder checks and witnesses results","statement":"Outside the Olympic Games and World Aquatics Events, the chief recorder checks results from computer outputs or from the race times and placing supplied by the referee. The chief recorder witnesses the referee signing those results.","plain":"At the meets covered by this role, check the results and witness the referee’s signature.","source":"wa-cr","location":"PDF p. 56","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.14.1","category":"Officials and decisions","title":"Recorder handles withdrawals and records","statement":"Outside the Olympic Games and World Aquatics Events, the recorder handles withdrawals after heats or semi-finals, enters results on official forms, lists new records and maintains award scoring under Part One 11 where applicable.","plain":"At these meets, the recorder handles withdrawals, result paperwork, records and relevant award scores.","source":"wa-cr","location":"PDF p. 56","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.15.1","category":"Officials and decisions","title":"Video-review supervisor keeps judges in post","statement":"The video-review supervisor ensures the video judges occupy their assigned posts and perform their duties throughout the competition.","plain":"The supervisor keeps the video-review team in place and working.","source":"wa-cr","location":"PDF p. 56","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.15.2","category":"Officials and decisions","title":"Reviewing video judges’ reports","statement":"The video-review supervisor reviews and confirms the rule infractions reported by the video-review judges.","plain":"The supervisor checks reported video-review infractions before they proceed.","source":"wa-cr","location":"PDF p. 56","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.15.3","category":"Officials and decisions","title":"Video review requested by the referee","statement":"At the referee’s request, the video-review supervisor reviews and confirms the rule infractions referred for that review.","plain":"The referee can refer reported infractions to the video-review supervisor for checking.","source":"wa-cr","location":"PDF p. 56","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"2.15.4","category":"Officials and decisions","title":"Reporting confirmed video infractions","statement":"The video-review supervisor reports every infraction confirmed through video review to the referee.","plain":"Confirmed video-review infractions go to the referee.","source":"wa-cr","location":"PDF p. 56","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"2.16.1","category":"Officials and decisions","title":"Video judges check stroke, turns and finishes","statement":"Video-review judges check compliance with the swimming-style rules designated for the competition and observe turns and finishes.","plain":"Video judges review swimming action and wall work against the relevant stroke rules.","source":"wa-cr","location":"PDF p. 57","status":"verified","issue":"","relatedRuleIds":[]},{"code":"2.16.2","category":"Officials and decisions","title":"Video-review reporting and card route","statement":"A video judge reports an observed infraction to the video-review supervisor. If confirmed, the judge completes a disqualification card and promptly sends it to the supervisor, who passes it to the referee.","plain":"A confirmed video infraction follows a clear chain: video judge, supervisor, then referee.","source":"wa-cr","location":"PDF p. 57","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"2.17.1","category":"Officials and decisions","title":"Resolution desk receives team queries","statement":"Resolution desk judges are available for team leaders’ initial queries, including withdrawals, disqualifications and swim-offs. They pass those queries to the Technical Swimming Committee commission.","plain":"Team leaders can take initial queries to the resolution desk, which forwards them to the appropriate commission.","source":"wa-cr","location":"PDF p. 57","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"2.18.1","category":"Officials and decisions","title":"Supervising competition-pool warm-up","statement":"Warm-up supervisors oversee warm-up sessions in the competition pool, ensuring the warm-up guidelines are followed and the lanes are used according to their designated purposes.","plain":"During warm-up, supervisors check the guidelines and assigned lane use.","source":"wa-cr","location":"PDF p. 57","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.1","category":"Seeding and progression","title":"Lanes used at the major championships","statement":"Olympic heats, semi-finals and finals should use eight lanes. At the World Aquatics Championships, World Aquatics Junior Swimming Championships and World Aquatics Swimming Championships (25m), heats may use ten lanes; semi-finals and finals should use eight.","plain":"Olympic racing normally uses eight lanes. The listed World Aquatics championships can use ten for heats, with eight for the later rounds. These are the stated championship arrangements, not a claim that every pool has eight or ten lanes.","source":"wa-cr","location":"PDF p. 57","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.2","category":"Seeding and progression","title":"Heat seeding applies to swimmers and relay teams","statement":"Heats at the Olympics, World Aquatics events and other competitions conducted under the Competition Regulations allocate both heat and lane by seeding. The following provisions apply to individual swimmers and, through rule 3.2.6, relay teams.","plain":"Under these rules, recorded times determine your heat and lane; relay teams follow the same heat-seeding framework.","source":"wa-cr","location":"PDF p. 57","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.2.1","category":"Seeding and progression","title":"Enter the fastest competition time","statement":"The swimmer, or the swimmer’s federation where responsible, must declare the fastest time achieved in competition for the exact stroke and distance. The declaration must use the required paper or online entry form and meet the entry deadline.","plain":"Enter your fastest competition time for this event, on the correct form and before the deadline.","source":"wa-cr","location":"PDF p. 57","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.2.2","category":"Seeding and progression","title":"Rank entries by their times","statement":"The management committee collects each entrant’s fastest competition time for the specified stroke and distance, then orders the entries from quickest to slowest.","plain":"The entry list is sorted by event time, fastest first.","source":"wa-cr","location":"PDF p. 57","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.2.3","category":"Seeding and progression","title":"Missing, late or incorrectly submitted entry time","statement":"If the fastest competition time is not supplied in the required form by the deadline, the management committee places that swimmer behind all entrants with properly supplied times.","plain":"A missing or incorrectly submitted time puts you at the end of the seeded entry list.","source":"wa-cr","location":"PDF p. 57","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.2.3.1","category":"Seeding and progression","title":"Identical entry times","statement":"When entrants have the same fastest entry time, a random draw determines their order in the ranking.","plain":"Equal entry times are ordered by a draw.","source":"wa-cr","location":"PDF p. 57","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.2.4.1","category":"Seeding and progression","title":"One heat becomes a direct final","statement":"When the number of entrants produces only one heat, that race uses final seeding and is raced as the direct final.","plain":"With only one race of entrants, you swim a direct final rather than a qualifying heat.","source":"wa-cr","location":"PDF p. 57","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.2.4.2","category":"Seeding and progression","title":"Two heats: alternate the ranked entries","statement":"For two heats, distribute entrants in time order using the repeating heat sequence 2, 1. The fastest enters heat 2, second-fastest heat 1, third-fastest heat 2, fourth-fastest heat 1, and so on.","plain":"The fastest two swimmers are separated: fastest in heat 2, next fastest in heat 1. Continue alternating down the entry list.","source":"wa-cr","location":"PDF p. 57","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.2.4.3","category":"Seeding and progression","title":"Three heats: distribute across the last three","statement":"For three heats, other than the 400m, 800m and 1500m events, distribute entrants in time order using the repeating sequence 3, 2, 1. The three fastest therefore enter heats 3, 2 and 1 respectively, and the fourth returns to heat 3.","plain":"The leading swimmers are spread across three heats: 3, 2, 1, then repeat. Longer-distance exceptions use the separate two-heat arrangement.","source":"wa-cr","location":"PDF p. 57","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.2.4.4","category":"Seeding and progression","title":"Four or more heats: ordinary-distance arrangement","statement":"For events other than 400m, 800m and 1500m, four or more heats use the final three heats for the fastest entrants, distributed by the three-heat pattern in 3.2.4.3. The next group fills the immediately preceding heat; progressively slower groups fill the earlier heats under 3.2.4.4.1–3.2.4.4.3.","plain":"The fastest group is spread over the last three heats. Earlier heats contain progressively slower groups. The 400m, 800m and 1500m have a different arrangement.","source":"wa-cr","location":"PDF p. 57","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.2.4.4.1","category":"Seeding and progression","title":"Seed the final three heats","statement":"In the ordinary-distance arrangement for four or more heats, the quickest entrants assigned to the last three heats alternate in descending heat order: last heat, next-to-last, third-from-last, then repeat. This applies the pattern in 3.2.4.3.","plain":"Spread the fastest swimmers across the final three heats, working backwards through those heats and repeating.","source":"wa-cr","location":"PDF p. 57","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.2.4.4.2","category":"Seeding and progression","title":"Fill the heat before the last three","statement":"After allocating the quickest entrants across the last three heats, assign the next-fastest group to the heat immediately before those three.","plain":"The next group of swimmers fills the fourth heat from the end.","source":"wa-cr","location":"PDF p. 57","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.2.4.4.3","category":"Seeding and progression","title":"Fill the remaining earlier heats","statement":"If heats still precede the final four, assign the next-fastest remaining group to the immediately preceding heat and repeat this process backwards through the schedule.","plain":"Work back towards heat 1, using the next-slowest group each time.","source":"wa-cr","location":"PDF p. 57","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.2.4.4.4","category":"Seeding and progression","title":"400m, 800m and 1500m: seed the last two heats","statement":"For the 400m, 800m and 1500m, spread the quickest entrants across the final two heats using the alternating pattern in 3.2.4.2: quickest in the last heat, next quickest in the preceding heat, then repeat. If at least three heats are needed, earlier heats receive the remaining groups under 3.2.4.4.5–3.2.4.4.6.","plain":"For these longer races, spread the top swimmers over the last two heats, not three.","source":"wa-cr","location":"PDF p. 57","status":"verified","issue":"The February PDF cites 3.1.3.2, which is an incorrect reference. World Aquatics commentary dated 6 August 2026, PDF p. 1, explicitly corrects it to 3.2.4.2. This restatement uses that published correction. Although the code is nested beneath a paragraph excluding these distances, this clause expressly governs 400m, 800m and 1500m.","relatedRuleIds":[]},{"code":"3.2.4.4.5","category":"Seeding and progression","title":"Longer races: fill the heat before the last two","statement":"In a 400m, 800m or 1500m event requiring three or more heats, the next-fastest group after the swimmers allocated to the final two heats goes into the heat immediately before them.","plain":"Once the last two longer-distance heats are filled, put the next group in the third heat from the end.","source":"wa-cr","location":"PDF p. 58","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.2.4.4.6","category":"Seeding and progression","title":"Longer races: fill earlier heats","statement":"For 400m, 800m and 1500m events with further earlier heats, place the next-fastest remaining group in the heat before the final three, then continue backwards through any additional heats.","plain":"Continue filling earlier heats with progressively slower groups.","source":"wa-cr","location":"PDF p. 58","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.2.4.5","category":"Seeding and progression","title":"Minimum swimmers when seeding heats","statement":"If an event has at least two heats, each heat must initially be seeded with three or more swimmers. Later withdrawals may leave fewer than three in a heat.","plain":"Every heat starts with at least three seeded swimmers, but withdrawals can leave a smaller field.","source":"wa-cr","location":"PDF p. 58","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.2.5.1","category":"Seeding and progression","title":"Lane numbering is viewed from the regular starting end","statement":"For seeding, face along the pool from its regular starting end. The rightmost lane is numbered 1, except in a ten-lane arrangement where it is 0; numbering increases towards the left. Rule 3.2.5.2 preserves this reference direction even when a 50m race starts at the opposite end.","plain":"Look down the pool from the normal starting end: lane 1 is on your right, or lane 0 in a ten-lane pool.","source":"wa-cr","location":"PDF p. 58","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.2.5.1.1","category":"Seeding and progression","title":"Lane order with an odd number of lanes","statement":"With an odd lane count, put the fastest swimmer in the middle lane and the second-fastest in its neighbour to the left, viewed from the regular starting end. Continue outwards, alternating right then left. In seven lanes numbered 1–7, the fastest-to-slowest order is 4, 5, 3, 6, 2, 7, 1.","plain":"Start in the centre and work outwards, left then right in alternating steps. The seven-lane example is 4, 5, 3, 6, 2, 7, 1.","source":"wa-cr","location":"PDF p. 58","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.2.5.1.2","category":"Seeding and progression","title":"Lane order in a six-lane pool","statement":"For six lanes numbered 1–6, assign swimmers from fastest to slowest to lanes 3, 4, 2, 5, 1, 6. This starts with lanes 3 and 4, then alternates outwards on the right and left.","plain":"Six-lane seeding order: 3, 4, 2, 5, 1, 6.","source":"wa-cr","location":"PDF p. 58","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.2.5.1.3","category":"Seeding and progression","title":"Lane order in an eight-lane pool","statement":"For eight lanes numbered 1–8, assign swimmers from fastest to slowest to lanes 4, 5, 3, 6, 2, 7, 1, 8. This starts with lanes 4 and 5, then alternates outwards on the right and left.","plain":"Eight-lane seeding order: 4, 5, 3, 6, 2, 7, 1, 8.","source":"wa-cr","location":"PDF p. 58","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.2.5.1.4","category":"Seeding and progression","title":"Lane order in a ten-lane pool","statement":"For ten lanes numbered 0–9, assign swimmers from fastest to slowest to lanes 4, 5, 3, 6, 2, 7, 1, 8, 0, 9. This starts with lanes 4 and 5, then alternates outwards on the right and left.","plain":"Ten-lane seeding order: 4, 5, 3, 6, 2, 7, 1, 8, 0, 9.","source":"wa-cr","location":"PDF p. 58","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.2.5.1.5","category":"Seeding and progression","title":"A draw for unresolved equal seedings","statement":"Where equally ranked swimmers remain to be assigned and the cited ranking and lane-allocation provisions do not apply, a random draw allocates the next available lanes.","plain":"If equal seedings still need lane places after the applicable ranking rules, draw the available lanes.","source":"wa-cr","location":"PDF p. 58","status":"verified","issue":"The printed condition refers to 3.2.2 and 3.2.5; the latter is the lane-allocation section containing this clause. This entry reports the residual random-draw instruction without inventing an additional tie-break procedure.","relatedRuleIds":[]},{"code":"3.2.5.2","category":"Seeding and progression","title":"A 50m race may start from either end","statement":"For a 50m event in a 50m pool, the management committee may choose either direction of racing, taking account of matters such as suitable automatic timing and the starter’s position. Swimmers should be told well in advance. Lane numbers remain fixed by the regular starting end even when swimmers race from the other end; normal seeding still applies.","plain":"A one-length 50m race can start at either end. The lane numbers do not reverse when the starting end changes.","source":"wa-cr","location":"PDF p. 58","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.2.6","category":"Seeding and progression","title":"Relay heat and lane seeding","statement":"Relay teams use the entry-time, ranking, heat-allocation and lane-allocation procedures in 3.2.1–3.2.5, treating each team as one entrant.","plain":"Seed relay teams in heats using the same framework as individual swimmers.","source":"wa-cr","location":"PDF p. 58","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.3","category":"Seeding and progression","title":"Seeding the semi-final phase","statement":"At Olympic, World Aquatics and other competitions governed by these regulations, semi-final heat and lane assignments use the procedures that follow. The printed scope also mentions relay teams, but the August commentary withdraws relay semi-final provision 3.3.5 because World Aquatics relay events have no semi-final round.","plain":"Individual semi-finalists are seeded into races and lanes. Do not read the old relay reference as requiring relay semi-finals.","source":"wa-cr","location":"PDF p. 58","status":"verified","issue":"World Aquatics commentary dated 6 August 2026, PDF p. 1, says relay provision 3.3.5 was included in error and is not applied.","relatedRuleIds":[]},{"code":"3.3.1","category":"Seeding and progression","title":"Distribute qualifiers between two semi-finals","statement":"Rank qualifiers by their heat times, or by entry times if the event begins directly with semi-finals. Assign them in the repeating semi-final order 2, 1: fastest to semi-final 2, second-fastest to semi-final 1, and continue alternating.","plain":"The quickest qualifier goes in the second semi-final, the next quickest in the first, then repeat down the list.","source":"wa-cr","location":"PDF p. 58","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.3.2.1","category":"Seeding and progression","title":"Tie for the last semi-final place at 200m or shorter","statement":"For an event of 200m or less, swimmers tied in seeding for the final available semi-final place may be asked to race a swim-off to decide who progresses.","plain":"At 50m, 100m or 200m, a tie for the last semi-final place may be settled by another race.","source":"wa-cr","location":"PDF p. 58","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.3.3","category":"Seeding and progression","title":"Replacing a withdrawn semi-finalist","statement":"If a semi-finalist withdraws, the management committee admits the fastest previously unqualified swimmer when it considers that reasonably possible. If replacement is made, it re-ranks and re-seeds where practical, redistribute swimmers between semi-finals under 3.3.1, and reassign lanes under 3.3.4.","plain":"A withdrawal may let the next-fastest reserve in. Officials can then revise the semi-final line-up and lanes where practical.","source":"wa-cr","location":"PDF p. 58","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3
