 lane-marking diagrams.","13 October 2026 — Version 1.1 review: distinguish same-stroke turns from medley transitions, place formal rule codes beside the plain-English explanation, and separate diagram evidence from display placement.","13 October 2026 — First content release: sourced stroke and phase cards, touch comparisons, authored scenarios and glossary.","13 October 2026 — August commentary identified; butterfly departure and breaststroke post-turn kick marked for English applicability review.","13 October 2026 — Confirmed separate March/May English implementation dates and September Handbook version."]},"sources":[{"id":"wa-cr","title":"Competition Regulations · Part Two: Swimming Rules","organisation":"World Aquatics","url":"https://resources.fina.org/fina/document/2026/02/18/e6815ecc-06d9-4f0b-98e9-4c441cf5e6a3/2026-02-18_World-Aquatics_CR-Final.pdf","version":"February 2026 · updated 18 February","effective":"Document states in force from February 2026; English implementation dates are separately verified.","verified":"2026-10-13","location":"Part Two, PDF pages 53–75; race rules pp60–63 and facilities pp68–72","notes":"Full regulations are the primary stroke-rule source. The August commentary corrects parts of the text. Read the flagged departure cards with that limitation."},{"id":"wa-commentary","title":"Commentary on the Competition Regulations","organisation":"World Aquatics","url":"https://resources.fina.org/fina/document/2026/08/10/869f46eb-cde1-4c11-8a5f-3d78735a21cf/Commentary-on-the-World-Aquatics-Competition-Regulations.pdf","version":"Letter dated 6 August 2026","effective":"No separate effective date stated; exact English application not independently verified.","verified":"2026-10-13","location":"Pages 1–2","notes":"Current authoritative WA clarification, linked from its swimming rules hub. Addresses starts, finish submersion, breaststroke kick timing and butterfly departure. Where wording affects an English answer, the app highlights the unresolved application rather than choosing an unqualified outcome."},{"id":"se-handbook","title":"Swim England Handbook","organisation":"Swim England","url":"https://www.swimming.org/library/documents/7787/download","version":"2026 v3","effective":"Effective 1 September 2026, verified on official handbook index.","verified":"2026-10-13","location":"p87 §414; p90 §§501–502","notes":"501.1 normally applies relevant WA rules; Swim England health and safety guidance takes precedence. 501.2 and 502 identify specialist/disability provisions. 414 covers referee authority and promoter conditions."},{"id":"se-index","title":"Handbook version and amendment history","organisation":"Swim England","url":"https://www.swimming.org/swimengland/swim-england-handbook/","version":"2026 v3 listed as current","effective":"Effective 1 September 2026","verified":"2026-10-13","location":"2026 v3 change-log entry","notes":"Used to verify the current handbook version and its effective date, separately from the webpage’s original publication date."},{"id":"se-adoption","title":"New technical rules: swimming implementation","organisation":"Swim England East Midlands","url":"https://eastmidlandswimming.org/new-technical-rules-swimming-implementation/","version":"Notice dated 6 April 2026","effective":"Level 1: 27 March 2026. All other levels, including unlicensed: 11 May 2026.","verified":"2026-10-13","location":"England implementation announcement","notes":"Official regional publication explicitly records implementation in England. This is the domestic adoption evidence for the revised February regulations, not proof of immediate adoption of every later commentary."},{"id":"wa-hub","title":"Current Competition Regulations index","organisation":"World Aquatics","url":"https://www.worldaquatics.com/rules/competition-regulations","version":"Checked 13 October 2026","effective":"Version index; not a separate effective-date instrument.","verified":"2026-10-13","location":"Competition Regulations Version February 2026","notes":"Starting point used to verify the current full regulations at development time."},{"id":"wa-rules","title":"Swimming rules and commentary index","organisation":"World Aquatics","url":"https://www.worldaquatics.com/swimming/rules","version":"Checked 13 October 2026","effective":"Current source index.","verified":"2026-10-13","location":"Swimming Rules / Commentary link","notes":"The current swimming rules page links the August commentary. This release uses fixed authored content, never live-fetched rules."},{"id":"wa-card","title":"Swimming Rule Quick Reference Infraction Sheet","organisation":"World Aquatics","url":"https://resources.fina.org/fina/document/2026/06/30/b8b17245-fdb2-4461-bd51-d59c7c7fb2c2/Swimming-Reference-Card-25062026.pdf","version":"25 June 2026","effective":"Supporting reference, not a replacement for full regulations.","verified":"2026-10-13","location":"p1","notes":"Used as a supporting check only. It predates the August commentary and does not cover every infraction."},{"id":"wa-documents","title":"Swimming documents index","organisation":"World Aquatics","url":"https://www.worldaquatics.com/swimming/documents","version":"Checked 13 October 2026","effective":"Current document index.","verified":"2026-10-13","location":"Reference cards and officiating documents","notes":"June 2026 reference card and officiating protocols were checked for supporting context. Operational arrangements at WA events are not assumed to apply identically to every English meet."},{"id":"se-start-depth","title":"Minimum depth for racing entries FAQs","organisation":"Swim England","url":"https://www.swimming.org/swimengland/minimum-for-racing-entries-faqs/","version":"Published 8 December 2022; checked 13 October 2026","effective":"FAQ specifies implementation from 1 September 2023.","verified":"2026-10-13","location":"Minimum diving depths FAQs","notes":"Domestic depth guidance for racing entries. Provides the in-water-start exception where a pool does not meet the 1.35 m minimum requirement; not a substitute for venue and swimmer start permissions."},{"id":"se-nw-adoption","title":"Implementation of revised World Aquatics swimming rules","organisation":"Swim England North West","url":"https://swimnorthwest.org/news/update-implementation-of-revised-world-aquatics-competition-regulations-swimming/","version":"2026 implementation notice","effective":"Level 1: 27 March 2026; other levels including unlicensed: 11 May 2026","verified":"2026-10-13","location":"Implementation dates and changes summary","notes":"Confirms the English implementation of the February rules and the 400m lap-counting/warning change. It is not confirmation of English adoption of all later August commentary."},{"id":"wa-calendar","title":"Calendar for Rules — Competition Regulations","organisation":"World Aquatics","url":"https://resources.fina.org/fina/document/2026/04/21/bc5fc92f-6137-4060-aa8c-38e98ec5be11/2026.04.09-Calendar-for-Rules-Competition-Regulations-FINAL.pdf","version":"9 April 2026","effective":"Annual swimming rule-revision timetable; individual changes require approval","verified":"2026-10-13","location":"PDF p. 1 · Swimming schedule","notes":"15 November publishes final proposals; 1 December is the Bureau decision date; 1 January is enactment of approved changes. This schedule is not itself an approved rule-change package."},{"id":"wa-2025","title":"Competition Regulations — June 2025","organisation":"World Aquatics","url":"https://resources.fina.org/fina/document/2025/06/30/b1ac2d3c-1f72-4b45-83da-bbd252949211/Competition-Regulations_June-2025_Clean-updated-30.06.2025-.pdf","version":"June 2025 clean edition · updated 30 June 2025","effective":"Historical edition in force from 25 June 2025; used only to compare selected 2026 changes","verified":"2026-10-13","location":"PDF p72: lap recording and warning signals; p75: freestyle and backstroke; p76: butterfly","notes":"Historical primary-source comparison for selected changes: 400m freestyle lap counting/warnings and freestyle/butterfly finish submersion. The backstroke finish allowance already existed. This is not the governing current edition or an exhaustive comparison of every 2025–2026 change."}],"rules":[{"id":"start-signal","stroke":"general","phases":["start"],"title":"Wait for the signal, not just the whistle","summary":"The rule tests whether you initiate the start before the starting signal.","requirements":["Be stationary for the start; do not initiate the start before the signal."],"permitted":[],"exceptions":["For a start without automatic officiating footage, initiation must be observed and confirmed by both starter and referee under 2.3.6. The clause separately provides for review of relevant automatic officiating footage without requiring their concurrence.","If a disqualification is declared before the signal, the remaining swimmers are stood down and the procedure repeats. If the signal has already gone, the race continues and the disqualification is declared at the end."],"observation":"The starter and referee assess initiation in relation to the signal, following the applicable observation/review process.","breach":"Initiating the start before the signal is the breach described in 4.4; it is not limited to the moment the feet leave the block.","misconception":"A report that someone moved, without describing the movement, does not by itself establish that a start was initiated.","reminder":"Settle, listen and react to the signal.","refs":[{"source":"wa-cr","clause":"Part Two 4.1.4, 4.2.5, 4.4–4.4.2","location":"p60"},{"source":"wa-cr","clause":"Part Two 2.3.6","location":"p54"},{"source":"wa-commentary","clause":"Commentary on 2.3.6","location":"p1"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 4.1.4, 4.2.5, 4.4–4.4.2","text":"A start may be signalled only once the swimmers are still. Beginning the start before that signal is grounds for disqualification. If the signal has already sounded, the race proceeds and the disqualification is announced afterwards. If it has not, the other swimmers are stood down and the prescribed starting procedure resumes from the appropriate long whistle.","source":"wa-cr","location":"p60"},{"code":"Part Two 2.3.6","text":"For a visually judged early start, both the starter and referee must observe and confirm initiation before the signal. When relevant automatic officiating footage is available, the referee reviews it to verify the disqualification; agreement between those two officials is not required in that review route.","source":"wa-cr","location":"p54"}]},{"id":"dive-start","stroke":"general","phases":["start"],"title":"Know which start your race uses","summary":"Freestyle, breaststroke, butterfly and individual medley use a dive start under the standard rules; backstroke and medley relay start in the water.","requirements":["For the standard platform start, take your position on the long whistle. On “take your marks”, have at least one foot touching the front of the platform.","For backstroke and medley relay, enter on the first long whistle and return promptly to the start position on the second; establish the required grip and foot positions for the water start."],"permitted":["The position of the hands is not prescribed for that platform starting position."],"exceptions":["This card is conditional on a diving start being permitted. Swim England safety guidance and meet conditions take precedence; do not assume a dive is permitted at every venue.","For backstroke and the first medley-relay swimmer, use the separate water-start requirements."],"observation":"The assigned officials check the required starting position and the starter waits until all swimmers are stationary.","breach":"For a standard platform start, neither foot touching the front fails the prescribed position.","misconception":"Every race does not start with a dive.","reminder":"Club dive-start coaching: For our dive start, put your hands over the front edge of the block. Your thumbs and palms should not rest on the top of the block. The aim is to push back against the block with your hands at the start. Practise this position with your coach. This is club technique advice; the rule does not prescribe a hand position. Follow the officials’ signals and your event’s permitted starting arrangements.","refs":[{"source":"wa-cr","clause":"Part Two 4.1.1–4.1.4, 4.2.1–4.2.5","location":"p60"},{"source":"se-handbook","clause":"501.1","location":"p90"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 4.1–4.1.4","text":"Freestyle, breaststroke, butterfly and individual medley have a diving start. A short whistle sequence calls swimmers to readiness; the long whistle sends them onto their platforms, where they remain. After the referee hands control to the starter, the starting-position command requires immediate positioning with a foot touching the platform front. Hand placement is unrestricted. The starter signals once everyone is still.","source":"wa-cr","location":"p60"},{"code":"Part Two 4.2–4.2.5","text":"Backstroke and medley relay begin in the water. After the preliminary short whistles, the first long whistle directs entry and the second directs swimmers promptly to their starting positions. The referee then hands control to the starter. Once the required backstroke positions are established, the starter gives the positioning command and signals when everyone is still.","source":"wa-cr","location":"p60"},{"code":"501.1","text":"For competitions within this English scope, relevant World Aquatics technical rules apply subject to Swim England provisions. Swim England health and safety guidance overrides conflicting technical provisions; a standard diving start is therefore conditional on the applicable safety arrangements.","source":"se-handbook","location":"p90"}]},{"id":"official-process","stroke":"general","phases":["start","underwater","swimming","approach","touch","departure","finish"],"title":"Observation, report, decision","summary":"An official reports the observed breach within their duties; the referee makes the competition decision.","requirements":["Inspectors of turns and judges of stroke report breaches they observe within their jurisdiction."],"permitted":[],"exceptions":["The referee must disqualify for a personally observed breach under 2.3.7 and may disqualify on an official’s verbal report. After confirmation, the reporting official completes and signs the card.","Initiating a start has the separate procedure in 2.3.6. Specialist provisions and promoter conditions may change the applicable question."],"observation":"Inspectors observe starts, turns and finishes; judges of stroke check swimming style and assist with turns and finishes.","breach":"A scenario can identify facts inconsistent with a cited rule; it cannot replace the actual referee’s decision.","misconception":"An observing judge and the referee do not have interchangeable roles.","reminder":"If a decision is unclear, ask your coach to follow the event’s appropriate enquiry route.","refs":[{"source":"wa-cr","clause":"Part Two 2.3.7","location":"p54"},{"source":"wa-cr","clause":"Part Two 2.8.1–2.8.4, 2.8.9, 2.9.2–2.9.3","location":"p55"},{"source":"wa-cr","clause":"Part Two 2.3.6","location":"p54"},{"source":"se-handbook","clause":"414.1–414.2","location":"p87"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 2.3.7","text":"The referee must disqualify a swimmer for a breach the referee personally observes. A verbal breach report from another technical official allows the referee to disqualify. Following confirmation, that reporting official records and signs the infraction, event and lane on the disqualification card.","source":"wa-cr","location":"p54"},{"code":"Part Two 2.8.1–2.8.4, 2.8.9, 2.9.2–2.9.3","text":"Turn inspectors cover starts, turns and finishes. Their start observation runs from the signal through the first arm stroke, or second in breaststroke; turn observation runs from the final arm stroke before contact through that corresponding outgoing stroke. Finish observation begins with the last arm stroke. Stroke judges check stroke compliance and assist at turns and finishes. These officials report observed breaches within their assigned remit.","source":"wa-cr","location":"p55"}]},{"id":"free-style","stroke":"free","phases":["swimming"],"title":"Freestyle does not mean front crawl only","summary":"In a freestyle race, you may choose any swimming style.","requirements":[],"permitted":["Any style is permitted in an ordinary freestyle race."],"exceptions":["In individual medley and medley relay, freestyle cannot be backstroke, breaststroke or butterfly; the medley body-position provision also applies.","Wall contact, surface requirements and general race requirements still apply."],"observation":"The official checks the requirements that apply to freestyle, not a coach’s preferred front-crawl technique.","breach":"Choosing a different style alone does not breach 5.1 in an ordinary freestyle race.","misconception":"Front crawl is the usual racing choice, not the only style allowed by 5.1.","reminder":"Choose and practise your race technique with your coach.","refs":[{"source":"wa-cr","clause":"Part Two 5.1","location":"p60"},{"source":"wa-cr","clause":"Part Two 5.2–5.3","location":"p60"},{"source":"wa-cr","clause":"Part Two 9.3","location":"p62"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 5.1","text":"An ordinary freestyle event places no restriction on the choice of swimming style. The freestyle segment of either kind of medley excludes backstroke, breaststroke and butterfly.","source":"wa-cr","location":"p60"},{"code":"Part Two 5.2–5.4; 9.3","text":"That freedom of style does not remove wall-contact or surface obligations. Medley freestyle also requires the breast-facing body position except during turns, with no kick or stroke before returning to that position.","source":"wa-cr","location":"p60–62"}]},{"id":"free-underwater","stroke":"free","phases":["underwater","departure"],"title":"Head up by 15 metres","summary":"After the start and every turn, your head must break the surface no later than 15 metres: at 15.00 m is within the limit; first surfacing at 15.01 m is too late.","requirements":["Make the head break the water surface at or before the 15-metre mark after the start and each turn. A hand surfacing earlier does not satisfy the head requirement.","Keep some part of the body breaking the surface outside the permitted start/turn underwater phase and the turn itself. The separate finish exception applies only when reaching for the finish after the required head passage of the final 5-metre mark."],"permitted":["Complete submersion is permitted during the turn and for no more than 15 metres after a start or turn, with the head surfacing no later than that limit."],"exceptions":["The separate finish provision is about reaching for the finish wall after part of the head has passed the 5-metre mark."],"observation":"The official observes the head’s emergence against the 15-metre mark, and the surface requirement afterwards.","breach":"First head emergence beyond 15 metres, including at 15.01 m, breaches the 15-metre requirement even if another body part surfaced earlier.","misconception":"A hand breaking the surface does not replace the head-emergence requirement.","reminder":"Practise a breakout with a comfortable margin before 15 metres.","refs":[{"source":"wa-cr","clause":"Part Two 5.3–5.4","location":"p60"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 5.3","text":"The head must have emerged through the surface no later than 15 metres from the starting wall or the wall just left after a turn. Full submersion is allowed during a turn and during this limited start/turn phase. Outside an applicable exception, the swimmer must continuously have some body part breaking the surface.","source":"wa-cr","location":"p60"},{"code":"Part Two 5.4","text":"A separate finish exception permits full submersion immediately before the reach to finish, once some of the head has crossed the marker five metres from that finish wall. It does not extend the 15-metre breakout limit.","source":"wa-cr","location":"p60"}]},{"id":"free-wall","stroke":"free","phases":["approach","touch","departure","finish"],"title":"Any body part can make the contact","summary":"At every completed length and at the finish, some part of your body must touch the wall.","requirements":["Make physical wall contact at each completed length and the finish."],"permitted":["Feet contacting the wall in a tumble turn can satisfy the contact rule without an earlier hand touch."],"exceptions":["The rest of the turn must still comply with the race and surface requirements. Medley freestyle has an additional body-position rule."],"observation":"The official observes actual contact with the end wall.","breach":"Turning short of the wall without touching it breaches the contact requirement.","misconception":"Freestyle does not require a two-hand touch.","reminder":"Make the wall contact clear and practise your turn distance.","refs":[{"source":"wa-cr","clause":"Part Two 5.2","location":"p60"},{"source":"wa-cr","clause":"Part Two 5.3","location":"p60"},{"source":"wa-cr","clause":"Part Two 9.3, 10.2.3","location":"p62"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 5.2","text":"Every length must end with actual contact between the wall and at least one body part, including the race-ending length. There is no freestyle requirement that the contact be made by a hand.","source":"wa-cr","location":"p60"},{"code":"Part Two 10.2.3–10.2.4","text":"A turn requires contact with the end wall. A swimmer may not gain a step or stride from the pool floor; freestyle permits standing on the floor, but not walking along it.","source":"wa-cr","location":"p62"}]},{"id":"free-finish","stroke":"free","phases":["approach","finish"],"title":"Submersion while reaching for the finish","summary":"Freestyle has a specific finish-submersion exception, not a blanket licence to swim underwater inside the final five metres.","requirements":["Touch the finish wall with some part of the body.","If completely submerged for the finish, some part of the head must already have passed the final 5-metre mark and the submersion must meet the finish-reaching condition. Being merely inside the final five metres is insufficient."],"permitted":["After some part of the head has passed the 5-metre mark, complete submersion is permitted immediately prior to reaching for the finish wall."],"exceptions":["The finish-reaching condition matters. This exception does not apply at an ordinary turn."],"observation":"The official considers the head’s position, the reaching action and the wall contact.","breach":"Complete submersion outside the stated start, turn or finish exceptions breaches the surface requirement.","misconception":"Being somewhere within five metres of a wall is not enough by itself.","reminder":"Finish to the wall; do not treat the flags as an instruction to dive under.","refs":[{"source":"wa-cr","clause":"Part Two 5.4","location":"p60"},{"source":"wa-cr","clause":"Part Two 5.2–5.3","location":"p60"},{"source":"wa-commentary","clause":"Commentary on 5.4","location":"p1"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 5.2–5.4","text":"To finish freestyle, a body part must contact the end wall. Full submersion is permitted immediately before reaching to finish if some of the head has already crossed the marker five metres from that wall. Otherwise the ordinary surface obligation continues unless another stated exception applies.","source":"wa-cr","location":"p60"}]},{"id":"back-start","stroke":"back","phases":["start"],"title":"Start in the water, facing the wall","summary":"Both hands hold the starting grips before the backstroke start.","requirements":["Face the starting end with both hands holding the starting grips.","Do not stand in or on the gutter or bend the toes over its lip. With a ledge, at least one toe of each foot must contact the end wall or face of the touchpad; do not curl toes over the top of the pad."],"permitted":[],"exceptions":["The first swimmer of a medley relay also uses the water start."],"observation":"The official checks hand and foot positions; the starter signals when swimmers are stationary.","breach":"With a ledge, losing wall/pad-face contact with every toe of either foot before the start fails the specified position.","misconception":"A backstroke ledge does not remove the toe-contact requirement.","reminder":"Set your feet and grips before settling for the signal.","refs":[{"source":"wa-cr","clause":"Part Two 6.1","location":"p61"},{"source":"wa-cr","clause":"Part Two 4.2","location":"p60"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 6.1","text":"Before the signal, the swimmer waits in the water facing the starting end and grips the start handles with both hands. Feet may not stand in or on the gutter, and toes may not hook over its lip. With a backstroke ledge, each foot must have at least one toe contacting the wall or the touchpad front. Toes may not hook over the pad top.","source":"wa-cr","location":"p61"},{"code":"Part Two 4.2.1–4.2.5","text":"For the water start, enter on the first long whistle and return promptly to the start position on the second. The starter gives the starting-position command after swimmers are in the required positions, then signals once they are still.","source":"wa-cr","location":"p60"}]},{"id":"back-body","stroke":"back","phases":["swimming","approach"],"title":"Stay on your back","summary":"Normal backstroke body roll can approach vertical, but cannot reach 90 degrees from horizontal.","requirements":["Push off and swim on the back except when executing the permitted turn."],"permitted":["Body roll is allowed up to, but not including, 90 degrees from horizontal. The head’s position does not determine whether the body is on the back."],"exceptions":["The roll-over turn exception applies to executing a backstroke turn; a backstroke section finish in medley is a different question."],"observation":"The official watches the body position and whether an apparent roll-over is part of the permitted turn.","breach":"Rolling onto the breast during ordinary backstroke swimming breaches the position rule.","misconception":"Turning your head is not the same thing as turning your body onto the breast.","reminder":"Practise body rotation while retaining your backstroke position.","refs":[{"source":"wa-cr","clause":"Part Two 6.2","location":"p61"},{"source":"wa-cr","clause":"Part Two 6.4–6.5","location":"p61"},{"source":"wa-cr","clause":"Part Two 9.4","location":"p62"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 6.2","text":"The start push-off, swimming and departures from backstroke turns must be on the back. Ordinary body roll must stay short of a quarter-turn from horizontal: reaching 90 degrees is outside the permitted back position. Head direction does not determine body position. The specific turn permission in 6.4 is the exception.","source":"wa-cr","location":"p61"}]},{"id":"back-underwater","stroke":"back","phases":["underwater","departure"],"title":"The backstroke 15-metre limit","summary":"After the start and every turn, your head must break the surface no later than 15 metres: at 15.00 m is within the limit; first surfacing at 15.01 m is too late.","requirements":["Make the head break the water surface at or before the 15-metre mark after the start and each turn. A hand surfacing earlier does not satisfy the head requirement.","Keep some part of the body breaking the surface outside the permitted start/turn underwater phase and the turn itself. The separate finish exception applies only when reaching for the finish after the required head passage of the final 5-metre mark."],"permitted":["Complete submersion is permitted during the turn and for no more than 15 metres after a start or turn, with the head surfacing no later than that limit."],"exceptions":["The separate finish allowance requires reaching for the finish after the head has passed the 5-metre mark."],"observation":"The official observes head emergence and the surface requirement.","breach":"First head emergence beyond 15 metres, including at 15.01 m, breaches the 15-metre requirement even if another body part surfaced earlier.","misconception":"The distance is not extended by a fast underwater phase.","reminder":"Practise your breakout with a clear margin.","refs":[{"source":"wa-cr","clause":"Part Two 6.3, 6.5","location":"p61"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 6.3","text":"The head must emerge through the surface by, and not beyond, 15 metres after the start and every turn. The swimmer may be wholly underwater during a turn and that limited start/turn phase. Outside a permitted exception, some part of the body must keep breaking the surface.","source":"wa-cr","location":"p61"},{"code":"Part Two 6.5","text":"At the finish, full submersion is permitted during the reach to the wall after the head has crossed the marker five metres from it. The finish touch must still be made on the back.","source":"wa-cr","location":"p61"}]},{"id":"back-turn","stroke":"back","phases":["approach","touch","departure"],"title":"Backstroke → backstroke: the same-stroke turn","summary":"When another backstroke length follows, the shoulders may roll beyond vertical onto the breast during the turn. An immediate, continuous single-arm or simultaneous double-arm pull may initiate it.","requirements":["For this backstroke-to-backstroke turn, touch the wall with some part of the body and be back on your back when you leave it (6.4).","If you use the permitted roll onto the breast and an arm pull to initiate the turn, that pull must be immediate and continuous: one arm or both arms together."],"permitted":["The permitted roll onto the breast is part of executing the turn."],"exceptions":["A change from backstroke to breaststroke in individual medley ends the backstroke section: touch while on your back under 9.4 and 6.5. Do not apply the same-stroke roll-over permission to that section finish."],"observation":"The official watches the roll and immediate continuous pull used to initiate the turn, wall contact, and position on leaving the wall.","breach":"Leaving the wall on the breast for the next backstroke length breaches 6.4.","misconception":"You do not get an ordinary backstroke turn exception at the end of the backstroke section in medley.","reminder":"Practise the whole turn as a connected movement.","refs":[{"source":"wa-cr","clause":"Part Two 6.4","location":"p61"},{"source":"wa-cr","clause":"Part Two 6.5","location":"p61"},{"source":"wa-cr","clause":"Part Two 9.4","location":"p62"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 6.4","text":"A turn between backstroke lengths requires body contact with the wall and departure in the back position. During the turn, the shoulders may pass vertical towards the breast. The permitted initiating pull after that roll is either one arm or both arms together, performed immediately and continuously.","source":"wa-cr","location":"p61"},{"code":"Part Two 6.5; 9.4","text":"The wall ending the backstroke section of a medley is governed by the backstroke finish requirement: wall contact must occur while on the back. The permission for rolling before contact in a continuing backstroke turn does not replace that requirement.","source":"wa-cr","location":"p61–62"}]},{"id":"back-finish","stroke":"back","phases":["approach","finish"],"title":"Touch while still on your back","summary":"The backstroke finish requires wall contact while on the back.","requirements":["Touch the finish wall while still on the back.","For a completely submerged finish, the head must already have passed the final 5-metre mark and you must be reaching for the finish."],"permitted":["When reaching for the finish, complete submersion is allowed after the head has passed the 5-metre mark."],"exceptions":["The body-position requirement still applies during a submerged finish. In individual medley, 9.4 makes this same finish requirement apply to the wall between backstroke and breaststroke."],"observation":"The official observes body position at the instant of contact.","breach":"Rolling onto the breast before finish contact breaches the backstroke finish requirement.","misconception":"A submerged finish is not automatically a breach, but submersion does not permit a front-facing finish.","reminder":"Reach for the wall and keep the finish position.","refs":[{"source":"wa-cr","clause":"Part Two 6.5","location":"p61"},{"source":"wa-cr","clause":"Part Two 9.4","location":"p62"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 6.5","text":"The decisive finish position is the body position at wall contact: it must be on the back. Being wholly underwater is permitted while reaching to finish after the head has crossed the final five-metre marker.","source":"wa-cr","location":"p61"},{"code":"Part Two 9.4","text":"A medley change of stroke must complete the outgoing stroke under its own finish rules. Consequently the backstroke-to-breaststroke contact must satisfy the same backstroke finish-position test.","source":"wa-cr","location":"p62"}]},{"id":"breast-pullout","stroke":"breast","phases":["start","underwater","departure"],"title":"One pullout, one optional butterfly kick","summary":"After the start and each turn, one arm stroke may travel fully back to the legs while you are submerged.","requirements":["Make the head break the surface before the hands start turning inward from the widest point of the second arm stroke. At that inward movement is too late.","Use no more than one butterfly kick in the pullout, and complete it before the first breaststroke kick."],"permitted":["One butterfly kick is allowed at any time before the first breaststroke kick after the start or turn. It is optional."],"exceptions":["The breaststroke surfacing test is based on the stroke sequence; do not substitute the freestyle/backstroke/butterfly 15-metre rule.","Body-position requirements still apply. See the separately flagged post-turn kick guidance."],"observation":"The official observes the number and order of kicks, the arm pulls and the head’s emergence.","breach":"A second butterfly kick, a butterfly kick after the first breaststroke kick, or head emergence only as or after the second pull turns inward breaches 7.1.","misconception":"The optional butterfly kick does not have to come after the long arm pull; the rule allows it at any time before the first breaststroke kick.","reminder":"Rehearse the sequence and make the head-emergence timing clear.","refs":[{"source":"wa-cr","clause":"Part Two 7.1","location":"p61"},{"source":"wa-cr","clause":"Part Two 7.2–7.3","location":"p61"}],"status":"verified","issue":"","diagramIds":["breast-sequence"],"formal":[{"code":"Part Two 7.1","text":"Following a start or turn, one arm pull may extend all the way to the legs while the swimmer is underwater. No more than one butterfly kick is allowed, and it must precede the first breaststroke kick. Head emergence must occur before the hands begin moving inward from the widest point of the second arm stroke; there is no 15-metre breakout test in this clause.","source":"wa-cr","location":"p61"},{"code":"Part Two 7.2–7.3","text":"The swimmer must be on the breast by the beginning of the first arm stroke after a start or turn. Rolling onto the back is forbidden except while turning after wall contact. The separate August guidance addresses kicking during the return to the breast after a turn; its English application is flagged.","source":"wa-cr","location":"p61"}]},{"id":"breast-action","stroke":"breast","phases":["start","swimming","approach"],"title":"One pull, then one kick","summary":"While swimming breaststroke, move both arms together, then both legs together: one arm stroke followed by one leg kick.","requirements":["During breaststroke, be on the breast from the beginning of the first arm stroke after the start or turn (7.2). While approaching a breaststroke turn, do not roll onto the back before touching the wall (7.3).","Use one arm action followed by one leg action in a normal cycle. Both arms and both legs must act together within their respective actions, without alternating movements.","Move the hands forward together from the breast and bring them back on or under the water. Keep elbows underwater except the last stroke before a turn, during the turn and the final stroke at the finish.","Some part of the head must surface during each complete stroke cycle. Feet turn outward during the propulsive kick; legs do not alternate."],"permitted":["Hands may move forward on, under or over the water. Feet may break the surface unless followed by a downward butterfly kick."],"exceptions":["Only the first arm stroke after a start or turn may extend beyond the hip line. The permitted single butterfly kick belongs to the pullout allowance.","The last arm stroke before a turn or finish need not be followed by a leg kick.","At a backstroke-to-breaststroke medley transition, first finish backstroke by touching on the back (9.4 and 6.5). That incoming touch is a different phase from the breaststroke action described here. The separate post-turn kick clarification remains flagged."],"observation":"The official watches stroke order, simultaneous limbs, body position, outward feet and head emergence.","breach":"Alternating leg action, an unpermitted downward butterfly kick or hands drawn past the hips in an ordinary stroke cycle breaches the corresponding movement rule.","misconception":"You do not have to keep the hands underwater as they move forward.","reminder":"Keep your sequence clear and return to full swimming after the pullout.","refs":[{"source":"wa-cr","clause":"Part Two 7.2–7.6","location":"p61"},{"source":"wa-cr","clause":"Part Two 7.1, 7.7","location":"p61"},{"source":"wa-cr","clause":"Part Two 9.4","location":"p62"},{"source":"wa-cr","clause":"Part Two 6.5","location":"p61"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 7.2–7.3","text":"The first arm stroke after a start or turn must begin with the swimmer on the breast. A roll onto the back is allowed only during the turn after contact. The normal cycle is an arm action followed by a leg action, with both arms acting together rather than alternately.","source":"wa-cr","location":"p61"},{"code":"Part Two 7.4","text":"Both hands travel forward together from the chest; that forward action may be above, on or beneath the surface. The backward hand action stays on or below it and cannot pass the hips except on the first pull after a start or turn. Elbows remain underwater except during a turn and the final stroke into a turn or finish.","source":"wa-cr","location":"p61"},{"code":"Part Two 7.5–7.6","text":"Every complete cycle includes head emergence. Both legs act together, without alternating, and the feet turn outward to provide propulsion. Downward butterfly kicks are prohibited apart from the single pullout allowance in 7.1. Feet may emerge provided no downward butterfly kick follows.","source":"wa-cr","location":"p61"},{"code":"Part Two 7.7","text":"The last arm action into a turn or finish may omit the following kick. Before touching, head submersion after the final pull is allowed only if the head emerged during that final complete or incomplete cycle.","source":"wa-cr","location":"p61"}]},{"id":"breast-touch","stroke":"breast","phases":["approach","touch","finish"],"title":"Two hands. Same moment. Not stacked.","summary":"At each turn and finish, both separated hands must touch simultaneously. Contact may be above, at or below the water.","requirements":["Both hands contact the wall at the same time and are not stacked one on top of the other."],"permitted":["No visible gap between the hands is required. Incidental finger contact is allowed.","The clause does not impose a same-height condition: the decisive requirements are both hands, separated, and simultaneous contact."],"exceptions":["Keep the required breaststroke body position until the touch. After touching, the turn may be made in any manner subject to the departure requirements.","A last arm stroke without a following kick is allowed. Head submersion has its own last-cycle condition; see the breaststroke finish card."],"observation":"The official observes each hand’s contact, whether contact is simultaneous and whether the hands are stacked.","breach":"One hand arriving before the other, or hands stacked, breaches the contact requirement.","misconception":"“Separated” does not mean a visible gap, and “simultaneous” does not mean identical height.","reminder":"Plan the approach so both hands meet the wall together.","refs":[{"source":"wa-cr","clause":"Part Two 7.7","location":"p61"},{"source":"wa-cr","clause":"Part Two 7.3","location":"p61"}],"status":"verified","issue":"","diagramIds":["two-hands"],"formal":[{"code":"Part Two 7.7","text":"At turns and finishes, two non-stacked hands must make wall contact at the same instant. Contact height relative to the surface is unrestricted. The hands need not show a visible gap, and incidental finger contact is allowed. The final arm pull may omit the kick; head submersion before contact is conditional on head emergence in the final complete or incomplete cycle.","source":"wa-cr","location":"p61"},{"code":"Part Two 7.3","text":"The turn permission to roll onto the back begins only after the wall touch. It does not allow a breaststroker to approach the wall on the back.","source":"wa-cr","location":"p61"}]},{"id":"breast-finish","stroke":"breast","phases":["approach","finish"],"title":"The last stroke can finish without a kick","summary":"The final arm stroke before a turn or finish does not have to be followed by a leg kick.","requirements":["Touch with both hands at the same time without stacking them.","If the head goes underwater after the final pull before the touch, it must have surfaced during that last complete or incomplete cycle."],"permitted":["The head may submerge after the last arm pull before contact if it broke the surface at some point in the last complete or incomplete cycle preceding that contact."],"exceptions":["The simultaneous, separated two-hand touch still applies.","Do not replace this last-cycle requirement with the final-5-metre exception used in freestyle, backstroke or butterfly."],"observation":"The official observes head emergence within the final cycle and the final touch.","breach":"A final cycle with no head emergence fails the stated condition for this pre-touch head submersion allowance.","misconception":"A missing final kick is not automatically a breaststroke offence.","reminder":"Keep the final reach controlled and both hands clear.","refs":[{"source":"wa-cr","clause":"Part Two 7.7","location":"p61"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 7.7","text":"The last arm action before a turn or finish may stand alone without a following kick. After that pull, the head may go underwater before contact only if it emerged during the final cycle, whether that cycle was complete or incomplete. Two non-stacked hands must still contact the wall simultaneously; no visible gap is required and incidental finger contact is allowed.","source":"wa-cr","location":"p61"}]},{"id":"breast-departure-review","stroke":"breast","phases":["departure"],"title":"Post-turn kick: English application flagged","summary":"Latest World Aquatics guidance: after the turn, do not kick until you have returned past vertical onto the breast.","requirements":["Latest World Aquatics instruction: complete the return past vertical onto the breast before the first kick after the turn. Its English application date remains unverified here."],"permitted":[],"exceptions":[],"observation":"English conclusion withheld pending applicability confirmation; consult the current World Aquatics guidance above.","breach":"English conclusion withheld pending applicability confirmation; consult the current World Aquatics guidance above.","misconception":"English conclusion withheld pending applicability confirmation; consult the current World Aquatics guidance above.","reminder":"English conclusion withheld pending applicability confirmation; consult the current World Aquatics guidance above.","refs":[{"source":"wa-cr","clause":"Part Two 7.2–7.3","location":"p61"},{"source":"wa-commentary","clause":"Commentary on 7.3","location":"p2"}],"status":"withheld","issue":"The August commentary adds this explicit kicking condition to the printed February wording. We have not independently verified its English application date. This is shown as the latest WA guidance, not an unqualified English disqualification conclusion. No scored scenario depends on this point.","diagramIds":[],"formal":[{"code":"Part Two 7.2–7.3","text":"The February text requires the breast position when the first arm stroke begins after a turn. Its permission to roll during the turn starts only after wall contact.","source":"wa-cr","location":"p61"},{"code":"Commentary on Part Two 7.3","text":"The August World Aquatics clarification also places a condition on the first post-turn kick: rotation back past vertical towards the breast must be complete before any kicking begins. This is the latest World Aquatics instruction; its specific English application date remains unverified here.","source":"wa-commentary","location":"p2"}]},{"id":"fly-underwater","stroke":"fly","phases":["start","underwater","departure"],"title":"One underwater arm pull; head up by 15 metres","summary":"After the start and every turn, your head must break the surface no later than 15 metres: at 15.00 m is within the limit; first surfacing at 15.01 m is too late.","requirements":["Make the head break the water surface at or before the 15-metre mark after the start and each turn. A hand surfacing earlier does not satisfy the head requirement.","Use no more than one underwater arm pull after a start or turn, and use it to bring you to the surface. Surfacing before 15 metres does not permit a second underwater arm pull.","Keep some part of the body breaking the surface outside the permitted start/turn underwater phase and the turn itself. The separate finish exception applies only when reaching for the finish after the required head passage of the final 5-metre mark."],"permitted":["One or more leg kicks are permitted in the underwater start/turn phase; the head must still emerge no later than 15 metres."],"exceptions":["An extra underwater arm pull is not made legal by surfacing before 15 metres.","Turn and finish submersion exceptions have their own conditions. The post-turn departure body position is separately flagged."],"observation":"The official checks both the one-pull limit and head emergence by 15 metres.","breach":"First head emergence beyond 15 metres, including at 15.01 m, breaches the 15-metre requirement even if another body part surfaced earlier. A second underwater arm pull after the start or turn is a separate breach even if the head surfaces before 15 metres.","misconception":"The 15-metre limit is not the only condition of the underwater phase.","reminder":"Link your one underwater pull to the breakout.","refs":[{"source":"wa-cr","clause":"Part Two 8.6","location":"p62"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 8.6","text":"After a start or turn, butterfly permits underwater leg kicks and at most one underwater arm pull, which must lead to surfacing. The head must emerge no later than 15 metres. Full submersion is also allowed during the turn. Otherwise a body part must keep breaking the surface, subject to the separate finish-reaching exception after the head crosses the final five-metre marker.","source":"wa-cr","location":"p62"}]},{"id":"fly-action","stroke":"fly","phases":["start","swimming","approach"],"title":"Move both arms together over the water","summary":"Both arms recover forward simultaneously over the water and move backward simultaneously under it.","requirements":["Move both arms forward together over the water and backward together under it during ordinary swimming; the underwater start/turn pull has a separate allowance.","Be on the breast from the beginning of the first arm stroke after the start. Do not roll onto the back during ordinary swimming.","Up-and-down leg movements must be simultaneous; legs or feet must not alternate relative to each other."],"permitted":["The legs or feet need not be at the same level."],"exceptions":["The underwater start/turn phase has the separate one-pull allowance.","A breaststroke kicking movement is not permitted under these mainstream rules. Masters requires separate guidance."],"observation":"The official observes arm recovery, underwater arm action, leg timing and body position.","breach":"An underwater forward arm recovery during ordinary swimming, alternating kicks or a breaststroke kick breaches the applicable movement requirement.","misconception":"Feet at different levels are not automatically an alternating kick.","reminder":"Recover both arms together and keep the leg movement simultaneous.","refs":[{"source":"wa-cr","clause":"Part Two 8.3–8.4","location":"p62"},{"source":"wa-cr","clause":"Part Two 8.1–8.2, 8.6","location":"p62"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 8.1–8.2","text":"After the start, the breast position is required from the beginning of the first arm stroke. Swimming on the back is prohibited; the permission to rotate during a turn begins only after contact. The August correction to post-turn departure is shown separately with the English applicability flag.","source":"wa-cr","location":"p62"},{"code":"Part Two 8.3–8.4","text":"Both arms travel forward together above the surface and backward together beneath it, apart from the underwater pull permitted in 8.6. The legs rise and fall together; unequal leg or foot height is allowed, but alternating movement is not. A breaststroke-style kick is prohibited in this mainstream scope.","source":"wa-cr","location":"p62"}]},{"id":"fly-touch","stroke":"fly","phases":["approach","touch","finish"],"title":"Butterfly also needs two separated hands","summary":"Each butterfly turn and finish requires simultaneous contact with both hands, without stacking.","requirements":["Touch simultaneously with both separated hands."],"permitted":["Contact may be at, above or below the surface. Incidental finger contact is allowed and no visible gap is required.","The clause does not require both hands to be at the same height."],"exceptions":["Maintain the required body position before contact. Turning after the touch is allowed, but the latest departure clarification is flagged separately."],"observation":"The official watches both hands at the contact instant and the body position before the turn touch.","breach":"One-handed, non-simultaneous or stacked contact breaches 8.5.","misconception":"A neat-looking one-hand touch still fails the two-hand rule.","reminder":"Find the wall with both hands together.","refs":[{"source":"wa-cr","clause":"Part Two 8.5","location":"p62"},{"source":"wa-cr","clause":"Part Two 8.2","location":"p62"}],"status":"verified","issue":"","diagramIds":["two-hands"],"formal":[{"code":"Part Two 8.5","text":"At every turn and finish, the two hands must contact the wall simultaneously without one stacked on the other. Any contact height relative to the surface is allowed. A visible space between hands is unnecessary, and incidental touching of the fingers is permitted.","source":"wa-cr","location":"p62"},{"code":"Part Two 8.2","text":"A turn may involve rotation onto the back only after contact. The August correction governing the subsequent departure is displayed separately with an English applicability flag.","source":"wa-cr","location":"p62"}]},{"id":"fly-finish","stroke":"fly","phases":["approach","finish"],"title":"Finish submersion has conditions","summary":"The butterfly rule permits complete submersion once the head has passed the 5-metre mark prior to reaching for the finish wall.","requirements":["Make a simultaneous, non-stacked two-hand finish.","For a completely submerged finish, the head must already have passed the final 5-metre mark and you must be reaching for the finish."],"permitted":["Complete submersion is permitted in that finish-reaching circumstance."],"exceptions":["This does not allow an unrestricted underwater swim through the last five metres, and it does not remove the contact requirement.","The August commentary restates the reaching condition. The published February finish allowance already contains it."],"observation":"The official observes the head’s position, reaching for the finish and the two-hand contact.","breach":"Submersion without a qualifying exception breaches the surface rule; a one-hand finish still breaches the touch rule.","misconception":"Being submerged at the touch is not by itself enough to decide the outcome.","reminder":"Keep the final touch clear even when the finish is low in the water.","refs":[{"source":"wa-cr","clause":"Part Two 8.6","location":"p62"},{"source":"wa-cr","clause":"Part Two 8.5","location":"p62"},{"source":"wa-commentary","clause":"Commentary on 8.6 finish sentence (labelled 8.6.7 in letter)","location":"p2"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 8.5–8.6","text":"Complete submersion is allowed during the reach to finish after the head has crossed the final five-metre marker. The finish still requires simultaneous wall contact by two non-stacked hands; hand contact can be above, on or below the surface, with incidental finger contact allowed.","source":"wa-cr","location":"p62"}]},{"id":"fly-departure-review","stroke":"fly","phases":["departure"],"title":"Butterfly departure: English application flagged","summary":"Latest World Aquatics commentary says the body must be on the breast after leaving the wall.","requirements":["Latest World Aquatics instruction: be on the breast after leaving the wall. Do not rely on the older first-arm-stroke wording as permission to leave on the back. Its English application date remains unverified here."],"permitted":[],"exceptions":[],"observation":"English conclusion withheld pending applicability confirmation; consult the current World Aquatics guidance above.","breach":"English conclusion withheld pending applicability confirmation; consult the current World Aquatics guidance above.","misconception":"English conclusion withheld pending applicability confirmation; consult the current World Aquatics guidance above.","reminder":"English conclusion withheld pending applicability confirmation; consult the current World Aquatics guidance above.","refs":[{"source":"wa-cr","clause":"Part Two 8.1–8.2","location":"p62"},{"source":"wa-commentary","clause":"Commentary on 8.1–8.2","location":"p2"}],"status":"withheld","issue":"This corrects the February wording that refers to the first arm stroke after the turn. The English application of that correction has not been independently verified. Do not use the older wording as a promise that leaving on the back is legal. No scored scenario depends on this point.","diagramIds":[],"formal":[{"code":"Part Two 8.1–8.2","text":"The printed February wording ties the breast position after a turn to the first arm stroke. It allows rotation during a turn only after touching the wall. The subsequent August commentary corrects the departure-position wording, so the printed text must be read with that correction.","source":"wa-cr","location":"p62"},{"code":"Commentary on Part Two 8.1–8.2","text":"The August clarification retains the first-arm-stroke test for the start, but replaces that test for turns with a requirement to be on the breast after leaving the wall. It therefore does not support waiting until the first pull to rotate from the back. Its specific English application date remains unverified here.","source":"wa-commentary","location":"p2"}]},{"id":"im-order","stroke":"im","phases":["start","swimming"],"title":"Four strokes, one swimmer","summary":"Individual medley order is butterfly, backstroke, breaststroke, then freestyle. Each is one quarter of the race.","requirements":["Swim the strokes in that order and finish each section under its own stroke rules."],"permitted":[],"exceptions":["The standard start is a dive, subject to applicable venue safety and event provisions.","Medley relay uses a different stroke order."],"observation":"The official observes the stroke order and correct completion of each section.","breach":"Changing the required order or failing the outgoing stroke’s finish breaches the relevant medley requirement.","misconception":"Individual medley and medley relay do not start with the same stroke.","reminder":"Remember: fly, back, breast, free.","refs":[{"source":"wa-cr","clause":"Part Two 9.1, 9.4","location":"p62"},{"source":"wa-cr","clause":"Part Two 4.1","location":"p60"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 9.1, 9.4","text":"The swimmer completes equal quarters in this sequence: butterfly, backstroke, breaststroke, freestyle. Every quarter ends using the finish requirements of the stroke just swum.","source":"wa-cr","location":"p62"},{"code":"Part Two 4.1","text":"Individual medley uses a diving start under the standard technical rule, subject to the applicable English safety and event arrangements.","source":"wa-cr","location":"p60"}]},{"id":"im-phase","stroke":"im","phases":["underwater","swimming","approach","departure"],"title":"Use the rule for the section you are swimming","summary":"The stroke-specific movement and underwater requirements still apply within a medley section.","requirements":["Use butterfly’s underwater and movement conditions in butterfly, backstroke’s in backstroke, and breaststroke’s in breaststroke.","During freestyle, use the freestyle requirements together with medley’s additional body-position restriction."],"permitted":[],"exceptions":["Breaststroke uses its stroke-sequence head-emergence requirement, not a generic 15-metre allowance.","At a change of stroke, finish the outgoing stroke before moving to the next. Review flags on breaststroke and butterfly departures also apply within medley."],"observation":"The official identifies the current stroke section, then applies that stroke’s requirements and the medley provisions.","breach":"Using the wrong stroke’s allowance does not satisfy the applicable rule.","misconception":"Medley does not replace four stroke rules with one common underwater rule.","reminder":"Choose the matching stroke card for the section you are practising.","refs":[{"source":"wa-cr","clause":"Part Two 5.1–5.3","location":"p60"},{"source":"wa-cr","clause":"Part Two 6.2–6.5, 7.1–7.7","location":"p61"},{"source":"wa-cr","clause":"Part Two 8.1–8.6, 9.1–9.4","location":"p62"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 5.1–5.4; 6.2–6.5; 7.1–7.7; 8.1–8.6; 9.1–9.4","text":"Each medley quarter uses its named stroke: butterfly has simultaneous arm and leg action and a single underwater arm-pull allowance; backstroke retains its back position except in permitted turns; breaststroke uses the ordered arm-and-kick cycle and its sequence-based pullout. Butterfly and backstroke require head emergence no later than 15 metres; breaststroke instead requires emergence before the inward part of its second pull. The freestyle quarter excludes the other three strokes, requires breast-facing swimming except in turns, and retains freestyle contact and surface rules, including head emergence by 15 metres. Every quarter must end with its own stroke-specific finish.","source":"wa-cr","location":"p60–62"}]},{"id":"im-transition","stroke":"im","phases":["approach","touch","departure","finish"],"title":"Finish the old stroke before starting the new","summary":"Backstroke → breaststroke has two different body-position checks: touch to finish backstroke while still on the back; then turn and begin breaststroke under its departure rules.","requirements":["Backstroke → breaststroke: 9.4 applies the outgoing stroke’s finish rule, so 6.5 requires the wall touch while on the back. The same-stroke backstroke turn permission in 6.4 does not replace that finish.","After that touch, begin breaststroke under 7.2–7.3: be on the breast from the beginning of the first arm stroke. The August commentary also says to return past vertical onto the breast before kicking; its English application remains flagged below.","Butterfly → backstroke: first make butterfly’s simultaneous, separated two-hand touch under 8.5.","Breaststroke → freestyle: first make breaststroke’s simultaneous, separated two-hand touch under 7.7."],"permitted":["After the correct outgoing-stroke touch, make the turn and take up the next stroke’s required position. These rules define the required moments; they do not prescribe a single named turn technique."],"exceptions":["The backstroke same-stroke turn (6.4), the backstroke section finish (6.5 and 9.4), and the following breaststroke departure (7.2–7.3) describe different phases.","The latest World Aquatics post-turn kick guidance is shown on the flagged breaststroke departure card. Its English application has not been independently confirmed, and no scored question depends on that clarification.","For the freestyle section departure, return to the breast before any kick or stroke (9.3)."],"observation":"The official observes the finish requirement of the outgoing stroke at the transition wall, then the next stroke.","breach":"Rolling onto the breast before the backstroke section’s wall contact breaches the backstroke finish requirement.","misconception":"There is no conflict between touching on the back to finish backstroke and taking up breaststroke’s required position afterwards. The wall touch separates those two contexts.","reminder":"Name the stroke you are finishing before thinking about the stroke you start next.","refs":[{"source":"wa-cr","clause":"Part Two 9.4","location":"p62"},{"source":"wa-cr","clause":"Part Two 6.5","location":"p61"},{"source":"wa-cr","clause":"Part Two 7.2–7.3","location":"p61"},{"source":"wa-commentary","clause":"Commentary on 7.3","location":"p2"},{"source":"wa-cr","clause":"Part Two 6.4, 7.7","location":"p61"},{"source":"wa-cr","clause":"Part Two 8.5, 9.3","location":"p62"}],"status":"verified","issue":"","diagramIds":["medley-transition"],"formal":[{"code":"Part Two 9.4; 6.5","text":"To change from backstroke to breaststroke, first make the backstroke finishing contact while the body remains on the back. Only after that contact does the turn into breaststroke follow. A normal continuing-backstroke roll-over turn cannot replace this section finish.","source":"wa-cr","location":"p61–62"},{"code":"Part Two 7.2–7.3","text":"For the breaststroke departure, the first arm stroke must begin on the breast. This is a different moment from the incoming backstroke wall touch.","source":"wa-cr","location":"p61"},{"code":"Commentary on Part Two 7.3","text":"Latest World Aquatics guidance additionally requires return past vertical towards the breast before any post-turn kick. English application of that August clarification is still flagged, and no scored scenario depends on it.","source":"wa-commentary","location":"p2"},{"code":"Part Two 7.7; 8.5; 9.3–9.4","text":"The butterfly-to-backstroke transition begins with butterfly’s simultaneous non-stacked two-hand finish. The breaststroke-to-freestyle transition begins with breaststroke’s equivalent finish. In the following freestyle departure, no kick or stroke may begin before the swimmer returns past vertical towards the breast.","source":"wa-cr","location":"p61–62"}]},{"id":"im-free","stroke":"im","phases":["underwater","swimming","departure","finish"],"title":"Medley freestyle has an extra position rule","summary":"In the freestyle section of individual medley or medley relay, swim on the breast, except when executing a turn.","requirements":["Return past vertical onto the breast before any kick or stroke. Do not use backstroke, breaststroke or butterfly as the freestyle style."],"permitted":["Leaving the wall on the back is permitted if you return to the breast before any kicking or stroking. Butterfly kicks may begin once you are past vertical onto the breast."],"exceptions":["Freestyle’s wall contact and surface requirements continue to apply."],"observation":"The official observes the rotation and whether any kick or stroke occurs before the swimmer returns to the breast.","breach":"Kicking while still on the back after leaving the wall in medley freestyle breaches 9.3.","misconception":"Freestyle in medley is not simply any style in any body position.","reminder":"Rotate first, then kick.","refs":[{"source":"wa-cr","clause":"Part Two 9.3","location":"p62"},{"source":"wa-cr","clause":"Part Two 5.1–5.3","location":"p60"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 5.1; 9.3","text":"Medley freestyle excludes backstroke, breaststroke and butterfly as its swimming style. The body remains on the breast apart from turns. Departure on the back is permitted, but rotation back past vertical towards the breast must happen before any kick or stroke. Butterfly kicks are allowed once that rotation is complete.","source":"wa-cr","location":"p60–62"},{"code":"Part Two 5.2–5.4","text":"The freestyle quarter still requires contact at each completed length, head emergence no later than 15 metres after the start of the leg and its turns, and continuous surface contact outside the specified turn, underwater-start/turn and finish-reaching exceptions.","source":"wa-cr","location":"p60"}]},{"id":"relay-order","stroke":"relay","phases":["start","swimming"],"title":"Back, breast, fly, free","summary":"A medley relay has four swimmers, each swimming one quarter, in backstroke, breaststroke, butterfly, freestyle order.","requirements":["The first swimmer starts in the water. Each swimmer competes only once in that relay race.","The team’s order is specified before the race under the event’s deadline."],"permitted":[],"exceptions":["The freestyle swimmer has the medley freestyle body-position restriction.","Domestic event eligibility, team composition or specialist conditions need their own check; this card does not decide eligibility."],"observation":"The official checks the stroke order, swimmers and each completed section.","breach":"Repeating a swimmer in the same relay race or changing the required stroke order breaches the corresponding provision.","misconception":"Relay order is different from individual medley order.","reminder":"Know your leg and the incoming swimmer’s finish.","refs":[{"source":"wa-cr","clause":"Part Two 9.2–9.4","location":"p62"},{"source":"wa-cr","clause":"Part Two 10.4.1–10.4.3","location":"p63"},{"source":"wa-cr","clause":"Part Two 4.2","location":"p60"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 9.2–9.4","text":"A medley relay allocates equal quarters to backstroke, breaststroke, butterfly and freestyle, in that order. Every swimmer ends their quarter with that stroke’s required finish, and the final quarter follows the medley-specific freestyle position rule.","source":"wa-cr","location":"p62"},{"code":"Part Two 10.4.1–10.4.3","text":"A standard relay team has four swimmers; a mixed relay has two men and two women. The team leader submits the swimming order by the specified deadline. After the deadline, substitutions require an evidenced medical emergency and prior permission from the appropriate official. Eligible team membership may change between heats and finals. Nobody may swim two legs of the same race.","source":"wa-cr","location":"p63"},{"code":"Part Two 4.2","text":"The medley relay begins with its backstroke swimmer in the water.","source":"wa-cr","location":"p60"}]},{"id":"relay-phase","stroke":"relay","phases":["underwater","swimming","approach","departure","finish"],"title":"Each relay leg keeps its stroke rules","summary":"Swimming in a relay does not remove the movement, underwater or finish requirements of your stroke.","requirements":["Finish each leg according to that stroke’s finish rule. Use the stroke-specific action and underwater requirements."],"permitted":[],"exceptions":["The last freestyle leg must comply with medley freestyle’s body-position provision.","The separate departure review flags apply to breaststroke and butterfly turns within relay legs."],"observation":"The official observes both the incoming stroke’s finish and the outgoing swimmer’s takeover; they are separate requirements.","breach":"A valid takeover does not repair an incorrect incoming stroke finish.","misconception":"Only the last swimmer needs a legal finish is a misconception: every section needs its own correct finish.","reminder":"Swim your leg all the way to its correct touch.","refs":[{"source":"wa-cr","clause":"Part Two 9.2–9.4","location":"p62"},{"source":"wa-cr","clause":"Part Two 5.1–5.4","location":"p60"},{"source":"wa-cr","clause":"Part Two 6.1–6.5, 7.1–7.7","location":"p61"},{"source":"wa-cr","clause":"Part Two 8.1–8.6","location":"p62"},{"source":"wa-cr","clause":"Part Two 10.4.5","location":"p63"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 9.2–9.4; 5.1–5.4; 6.1–6.5; 7.1–7.7; 8.1–8.6","text":"A relay swimmer has the action, underwater and finishing obligations of their stroke. Head emergence is due by 15 metres in freestyle, backstroke and butterfly; breaststroke uses the second-pull timing test instead. Each leg must finish correctly: backstroke contact on the back, breaststroke and butterfly simultaneous non-stacked two-hand contact, and freestyle contact by any body part. The final medley freestyle leg also requires breast-facing swimming except during turns, with rotation completed before any outgoing kick or stroke.","source":"wa-cr","location":"p60–62"},{"code":"Part Two 10.4.5","text":"The next swimmer may not lose foot contact with the starting platform before the incoming swimmer touches. This takeover test is additional to, and does not cancel, the incoming swimmer’s stroke-specific finish requirements.","source":"wa-cr","location":"p63"}]},{"id":"relay-exchange","stroke":"relay","phases":["start","approach","touch","departure"],"title":"Keep platform contact until the touch","summary":"The outgoing swimmer’s feet must retain contact with the starting platform until the incoming swimmer touches the wall.","requirements":["Begin the exchange from the starting platform, not with a running start from the pool deck.","Do not lose platform contact before the incoming wall touch."],"permitted":["Preparatory arm movement is not itself the foot-contact test; the feet must still retain the required platform contact."],"exceptions":["This is an exchange between relay swimmers. The first swimmer follows the race’s starting signal.","No general timing tolerance or recovery by returning to the wall is asserted here. Officials assess the applicable equipment and procedure."],"observation":"The official observes incoming touch against outgoing foot contact; automatic officiating equipment is also used when available.","breach":"Feet leaving the platform before the incoming swimmer touches breaches the takeover requirement.","misconception":"Movement before the touch is not the same thing as losing foot contact before it.","reminder":"Practise the timing with your coach and keep the contact requirement clear.","refs":[{"source":"wa-cr","clause":"Part Two 10.4.4–10.4.5","location":"p63"},{"source":"wa-cr","clause":"Part Two 2.8.8","location":"p55"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 10.4.4–10.4.5","text":"A takeover begins on the starting platform; running in from the deck is forbidden. The outgoing swimmer may prepare to leave, but loss of foot contact with the platform must not precede the incoming swimmer’s wall contact completing their leg.","source":"wa-cr","location":"p63"},{"code":"Part Two 2.8.8","text":"Turn inspectors judge outgoing platform contact against the incoming touch. Suitable automatic take-off officiating equipment is also used when it is available.","source":"wa-cr","location":"p55"}]},{"id":"relay-exit","stroke":"relay","phases":["finish"],"title":"After your leg, clear the pool safely","summary":"Once your distance is complete, leave the pool as soon as possible without obstructing swimmers still racing.","requirements":["After your leg, leave the pool as soon as possible without obstructing anyone still racing.","Do not enter or re-enter the water during the race unless you are the team member specified as next to compete."],"permitted":[],"exceptions":["The restriction continues until all swimmers in the race have completed the distance."],"observation":"The official observes unnecessary entry and obstruction of swimmers still completing their legs.","breach":"A finished team member jumping back in while the race continues breaches the relay entry restriction.","misconception":"Finishing your own leg does not mean the race has finished.","reminder":"Finish, clear the pool and support your team from the side.","refs":[{"source":"wa-cr","clause":"Part Two 10.4.6–10.4.7, 10.5","location":"p63"}],"status":"verified","issue":"","diagramIds":[],"formal":[{"code":"Part Two 10.4.6–10.4.7; 10.5","text":"Until everyone in the race has completed their distance, a relay team member may enter or re-enter only when they are the designated next swimmer. A swimmer who has finished their leg must get out promptly without impeding anyone still racing. If the referee determines that a relay requirement has been breached, the relevant team is disqualified; a swimmer who committed the breach is also disqualified.","source":"wa-cr","location":"p63"}]}],"scenarios":[{"id":"s01","stroke":"breast","phase":"touch","title":"One hand is higher","facts":"At a breaststroke turn, both hands directly touch the wall at exactly the same moment. They are not stacked. One is higher than the other. The swimmer has otherwise maintained the required body position.","outcome":"legal","explanation":"The contact clause specifies simultaneous, separated two-hand contact and allows contact above, at or below the water. It does not add an equal-height condition. Different height alone is not the breach.","ruleIds":["breast-touch"]},{"id":"s02","stroke":"breast","phase":"finish","title":"Fingertips meet","facts":"At a breaststroke finish, both hands directly contact the wall simultaneously. The fingertips incidentally touch each other, but the hands are not stacked. All other stroke and finish conditions are satisfied.","outcome":"legal","explanation":"Incidental finger contact is expressly permitted. A visible space between the hands is not required.","ruleIds":["breast-touch"]},{"id":"s03","stroke":"fly","phase":"touch","title":"A stacked touch","facts":"At a butterfly turn, one palm is placed on top of the other hand. Only the lower hand directly touches the wall.","outcome":"breach","explanation":"The hands must be separated, meaning not stacked. This also fails to give both hands direct wall contact.","ruleIds":["fly-touch"]},{"id":"s04","stroke":"fly","phase":"finish","title":"A fraction apart","facts":"Both hands reach the butterfly finish wall, but the right hand contacts first and the left contacts a moment later.","outcome":"breach","explanation":"The touch has to be simultaneous. Two hands touching at different times does not satisfy it.","ruleIds":["fly-touch"]},{"id":"s05","stroke":"free","phase":"touch","title":"Feet first at the wall","facts":"In an ordinary freestyle race, the swimmer tumbles and both feet contact the wall. There is no hand touch. The rest of the turn and departure meet the applicable rules.","outcome":"legal","explanation":"Freestyle requires contact by some part of the body, so this feet contact satisfies that rule.","ruleIds":["free-wall"]},{"id":"s06","stroke":"free","phase":"swimming","title":"A different style","facts":"In an ordinary freestyle race, a swimmer chooses breaststroke, meets all freestyle surface and contact requirements, and causes no obstruction. This is not a medley section.","outcome":"legal","explanation":"Freestyle permits any style in an ordinary freestyle event. The medley restriction does not apply to this stated event.","ruleIds":["free-style"]},{"id":"s07","stroke":"free","phase":"underwater","title":"A hand is up; the head is late","facts":"After a freestyle start, a hand breaks the surface at 14 metres. The head first breaks the surface at 15.01 metres.","outcome":"breach","explanation":"The head must break the surface no later than 15 metres. At 15.00 metres is within the limit; 15.01 metres is beyond it. Earlier hand emergence does not satisfy the head requirement.","ruleIds":["free-underwater"]},{"id":"s08","stroke":"back","phase":"departure","title":"Leaves facing down","facts":"After a same-stroke backstroke turn, the swimmer leaves the wall with the body on the breast, then rotates onto the back.","outcome":"breach","explanation":"The body must already be on the back upon leaving the wall.","ruleIds":["back-turn"]},{"id":"s09","stroke":"back","phase":"touch","title":"A connected backstroke turn","facts":"During a same-stroke backstroke turn, the swimmer rolls past vertical, uses an immediate continuous single-arm pull to initiate the turn, contacts the wall with the feet and leaves on the back. All other conditions are met.","outcome":"legal","explanation":"These facts fit the backstroke turn permission, including wall contact and returning to the back before leaving.","ruleIds":["back-turn"]},{"id":"s10","stroke":"im","phase":"touch","title":"The same roll at a different wall","facts":"At the end of the backstroke section in individual medley, the swimmer rolls onto the breast before touching the wall to start breaststroke.","outcome":"breach","explanation":"This wall finishes the backstroke section. The swimmer must touch while on the back; the ordinary backstroke turn exception does not replace that finish.","ruleIds":["im-transition","back-finish"]},{"id":"s11","stroke":"back","phase":"finish","title":"Underwater, on the back","facts":"A swimmer’s head has passed the final 5-metre mark. While reaching for the backstroke finish, they become completely submerged and touch the wall on the back. All other conditions are met.","outcome":"legal","explanation":"The finish rule permits this submersion when reaching for the wall after the head has passed 5 metres. Contact must still be on the back.","ruleIds":["back-finish"]},{"id":"s12","stroke":"breast","phase":"underwater","title":"One optional butterfly kick","facts":"Following a breaststroke start, a swimmer uses one butterfly kick before the first breaststroke kick, one permitted pull to the legs and surfaces the head before the second pull turns inward. Body position and all other requirements are satisfied.","outcome":"legal","explanation":"The single butterfly kick is permitted before the first breaststroke kick; the pullout and head-emergence conditions are satisfied.","ruleIds":["breast-pullout"]},{"id":"s13","stroke":"breast","phase":"underwater","title":"Two butterfly kicks","facts":"During the breaststroke pullout after a start, the swimmer performs two downward butterfly kicks before the first breaststroke kick.","outcome":"breach","explanation":"The allowance is for one butterfly kick, not two.","ruleIds":["breast-pullout"]},{"id":"s14","stroke":"bre
