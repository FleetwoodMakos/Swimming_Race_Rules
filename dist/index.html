ain":"Measure the course with the touch panels in their racing positions, rather than assuming the bare pool length is the racing length.","source":"wa-cr","location":"p68","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.1.2.1","category":"Pool \u0026 equipment","title":"25 m racing distance with touch panels","statement":"Where automatic timing touch panels are fitted at either or both ends of a 25 m pool, the pool construction must preserve the required 25.000 m racing distance between the effective end surfaces.","plain":"Touch panels take up space. The short-course racing distance must still be 25 m after they are installed.","source":"wa-cr","location":"p68","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.2.1.1","category":"Pool \u0026 equipment","title":"50 m length tolerance","statement":"With touch panels fitted, the permitted 50.000 m course tolerance is zero shortfall and an excess no greater than 0.010 m.","plain":"A measured long course may be up to 1 cm longer than 50 m, but cannot be shorter.","source":"wa-cr","location":"p68","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.2.1.2","category":"Pool \u0026 equipment","title":"50 m wall spacing for panels at both ends","statement":"For a 50 m pool using automatic touch panels at both ends, the structural walls must be separated by 50.020–50.030 m.","plain":"Allow for a panel at each end when setting the wall-to-wall pool length.","source":"wa-cr","location":"p68","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.2.1.3","category":"Pool \u0026 equipment","title":"50 m length throughout the measurement zone","statement":"The permitted course length must be maintained across the vertical zone from 0.300 m above the water to 0.800 m below it.","plain":"Checking only the waterline is insufficient; the required length applies above and below it.","source":"wa-cr","location":"p68","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.2.1.4","category":"Pool \u0026 equipment","title":"Certification of 50 m dimensions","statement":"The measurements must be certified by a surveyor or another qualified official appointed or accepted by the national member federation responsible for the pool location.","plain":"The long-course dimensions require qualified, federation-approved certification.","source":"wa-cr","location":"p68","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.2.2.1","category":"Pool \u0026 equipment","title":"25 m length tolerance","statement":"With touch panels fitted, the permitted 25.000 m course tolerance is zero shortfall and an excess no greater than 0.010 m.","plain":"The measured short course may be up to 1 cm longer than 25 m, but cannot be shorter.","source":"wa-cr","location":"p68","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.2.2.2","category":"Pool \u0026 equipment","title":"25 m wall spacing for two panels","statement":"For a 25 m pool with automatic touch panels at both ends, the structural walls must be 25.020–25.030 m apart.","plain":"The pool shell needs space for both panels while preserving the 25 m racing distance.","source":"wa-cr","location":"p68","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.2.2.3","category":"Pool \u0026 equipment","title":"25 m wall spacing for one panel","statement":"For a 25 m pool with an automatic touch panel at only one end, the structural walls must be 25.010–25.020 m apart.","plain":"A one-panel setup has a different permitted wall-to-wall length from a two-panel setup.","source":"wa-cr","location":"p68","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.2.2.4","category":"Pool \u0026 equipment","title":"25 m length throughout the measurement zone","statement":"The permitted course length must hold from 0.300 m above the water surface down to 0.800 m below it.","plain":"The short-course length must be correct through the whole specified vertical band.","source":"wa-cr","location":"p68","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.2.2.5","category":"Pool \u0026 equipment","title":"Recommended certification of 25 m dimensions","statement":"The measurements should be certified by a surveyor or another qualified official appointed or accepted by the national member federation responsible for the pool location.","plain":"This clause recommends qualified, federation-approved certification; its wording is “should”, rather than a mandatory instruction.","source":"wa-cr","location":"p68","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.3.1","category":"Pool \u0026 equipment","title":"Pool width at the Olympics and World Championships","statement":"At the Olympic Games and World Aquatics Championships, a permanent pool must be at least 25.000 m wide and a temporary pool at least 26.000 m wide.","plain":"These minimum widths apply to the named elite events, not automatically to every club meet.","source":"wa-cr","location":"p68","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.3.2","category":"Pool \u0026 equipment","title":"Pool width at other competitions","statement":"This provision sets no minimum overall pool width for competitions other than the Olympic Games and World Aquatics Championships.","plain":"No general minimum total width is specified here; separate lane-width requirements still exist.","source":"wa-cr","location":"p68","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.4.1","category":"Pool \u0026 equipment","title":"Depth at the Olympics and World Championships","statement":"The minimum depth at the Olympic Games and World Aquatics Championships is 2.5 m.","plain":"The named long-course elite events need a pool at least 2.5 m deep.","source":"wa-cr","location":"p68","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.4.2","category":"Pool \u0026 equipment","title":"Depth at the 25 m World Championships","statement":"For the World Aquatics Swimming Championships (25m), the pool must be at least 2.0 m deep; a depth of 2.5 m is recommended.","plain":"For this event, 2.0 m is mandatory and 2.5 m is the recommendation.","source":"wa-cr","location":"p68","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.4.3","category":"Pool \u0026 equipment","title":"Depth at other World Aquatics events","statement":"At other World Aquatics Events the minimum pool depth is 1.0 m. When starting blocks are used, a depth of at least 1.35 m is required through the zone from 1.0 m to at least 6.0 m from the end wall.","plain":"The block-start depth zone has a stricter minimum than the remaining pool. This clause expressly concerns World Aquatics Events.","source":"wa-cr","location":"p68","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.5.1","category":"Pool \u0026 equipment","title":"End-wall geometry and grip","statement":"End walls must be solid, upright, parallel, and perpendicular to both the course and water surface. The non-slip finish must reach at least 0.8 m below the water so turns are safe. A deviation of up to 0.3 degrees from vertical is allowed in either direction.","plain":"Swimmers need a stable, safe wall to touch and push against, with the specified alignment and underwater grip surface.","source":"wa-cr","location":"p68","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.5.2","category":"Pool \u0026 equipment","title":"Optional resting ledges","statement":"Resting ledges may be installed on pool walls at a depth of at least 1.2 m below the surface. They may be 0.10–0.15 m wide. Internal or external designs are allowed, with internal ledges preferred.","plain":"A submerged resting shelf is optional and must sit well below the racing surface; it is different from a backstroke starting ledge.","source":"wa-cr","location":"p69","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.5.3","category":"Pool \u0026 equipment","title":"Gutters and touch-panel clearance","statement":"Gutters are permitted on any pool wall and must have suitable protective covers. An end-wall gutter must allow touch panels to extend to the required height of 0.3 m above the water.","plain":"Drainage gutters must be safely covered and must not prevent the correct touch-panel installation.","source":"wa-cr","location":"p69","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.6.1","category":"Pool \u0026 equipment","title":"Olympic lane layout","statement":"The Olympic pool must provide eight 2.5 m lanes plus a 2.5 m rope-separated space outside each outer lane. A ninth and tenth lane may be used exceptionally with approval from the Technical Swimming Committee chair.","plain":"The standard Olympic racing layout uses eight lanes and outer buffer spaces; using extra lanes needs the specified approval.","source":"wa-cr","location":"p69","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.6.2","category":"Pool \u0026 equipment","title":"Ten lanes at World Championships","statement":"The World Aquatics Championships and the World Aquatics Swimming Championships (25m) require ten lanes.","plain":"The named World Championships use a ten-lane pool; the following clauses distinguish permanent and temporary pools.","source":"wa-cr","location":"p69","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.6.2.1","category":"Pool \u0026 equipment","title":"Permanent World Championship pool lanes","statement":"At the named World Championships, a permanent pool must have eight middle lanes 2.5 m wide and two outer lanes 2.4 m wide. A rope-separated gap of at least 0.1 m is required beyond each outer lane.","plain":"Permanent championship pools use slightly narrower outer lanes with an additional gap at each pool side.","source":"wa-cr","location":"p69","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.6.2.2","category":"Pool \u0026 equipment","title":"Temporary World Championship pool lanes","statement":"At the named World Championships, a temporary pool must provide ten lanes each 2.5 m wide, with a rope-separated gap of at least 0.5 m beyond each outer lane.","plain":"Temporary championship pools require ten full-width lanes and larger outside gaps.","source":"wa-cr","location":"p69","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.6.3","category":"Pool \u0026 equipment","title":"Lane layout at other competitions","statement":"Other competitions have no minimum lane count under this clause. Interior lanes must be at least 2.5 m wide; the first and last lanes must be at least 2.4 m wide, with an outside gap of at least 0.1 m on each side.","plain":"There is no universal lane count here, but the specified lane widths and outside spaces still apply within this WA facility standard.","source":"wa-cr","location":"p69","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.7.1","category":"Pool \u0026 equipment","title":"Lane-rope purpose","statement":"Lane ropes separate the lanes and reduce waves. Their design should lessen both wave transmission across the rope and reflection back towards its origin.","plain":"Ropes should absorb wave energy rather than simply marking the lane boundaries.","source":"wa-cr","location":"p69","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.7.2","category":"Pool \u0026 equipment","title":"Full-length lane ropes","statement":"A lane rope must cover the full racing course. At each end, parts that do not help suppress waves, including reels and springs, must occupy less than 200 mm.","plain":"Wave-reducing rope should run almost to the wall; inactive fittings have a strict length limit.","source":"wa-cr","location":"p69","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.7.3","category":"Pool \u0026 equipment","title":"Lane-rope anchoring","statement":"End-wall anchors should be recessed, and the installed rope should stay in the water. A deck-mounted anchor requires a rigid, non-stretch extension. The anchor and extension must project no more than 10 mm into the pool, and the permitted anchor-related change to rope length is at most 10 mm in either direction at each end.","plain":"Use stable fittings that keep the rope properly positioned. Recessed wall anchors are recommended; the projection and extension limits are mandatory.","source":"wa-cr","location":"p69","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.7.4","category":"Pool \u0026 equipment","title":"Wave elements, buoyancy and disputed diameter","statement":"The end anchors must hold the wave-reducing elements halfway below the water and withstand 20 kN tension. Along the course, between half and two-thirds of each element’s height must be submerged, with the rope specified as negatively buoyant. Float design should avoid changing rope length and should integrate a float between two discs. The printed diameter limits contradict one another, so no valid diameter range is asserted here.","plain":"The submersion, loading and design provisions can be read, but the diameter needs an official correction before a usable limit can be stated.","source":"wa-cr","location":"p69","status":"withheld","issue":"The February text describes 0.10 m as a maximum and 0.15 m as a minimum for the same diameter. Those limits cannot both be met. Do not silently reverse them or treat a guessed range as verified.","relatedRuleIds":[]},{"code":"15.7.5","category":"Pool \u0026 equipment","title":"Rope tensioning, spring and wire","statement":"The tensioning reel should require a tool to lock it and prevent unauthorised adjustment. A shock-absorbing tension spring is compulsory, and the wire must withstand 12 kN tensile loading.","plain":"The lock arrangement is recommended; the spring and wire strength are required.","source":"wa-cr","location":"p69","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.7.6","category":"Pool \u0026 equipment","title":"Recommended lane-rope colour scheme","statement":"The colour arrangement is recommended as detailed in the event-specific subclauses. The permitted colour-variation condition is set out in 15.7.6.4.","plain":"Read the following colour layouts as recommendations; colour variations have their own mandatory condition.","source":"wa-cr","location":"p70","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.7.6.1.1","category":"Pool \u0026 equipment","title":"Olympic outer green ropes","statement":"For the Olympic layout, two green ropes are recommended for lanes 1 and 8.","plain":"The recommended outside Olympic racing-lane ropes are green.","source":"wa-cr","location":"p70","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.7.6.1.2","category":"Pool \u0026 equipment","title":"Olympic blue ropes","statement":"For the Olympic layout, four blue ropes are recommended for lanes 2, 3, 6 and 7.","plain":"Blue identifies the recommended intermediate Olympic lane-rope positions.","source":"wa-cr","location":"p70","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.7.6.1.3","category":"Pool \u0026 equipment","title":"Olympic centre yellow ropes","statement":"For the Olympic layout, three yellow ropes are recommended around lanes 4 and 5.","plain":"The recommended centre Olympic lane ropes are yellow.","source":"wa-cr","location":"p70","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.7.6.2.1","category":"Pool \u0026 equipment","title":"World Championship outer green ropes","statement":"At the World Aquatics Championships and World Aquatics Swimming Championships (25m), two green ropes are recommended for lanes 0 and 9.","plain":"The recommended outer ropes in the ten-lane championship layout are green.","source":"wa-cr","location":"p70","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.7.6.2.2","category":"Pool \u0026 equipment","title":"World Championship blue ropes","statement":"At those World Championships, six blue ropes are recommended for lanes 1, 2, 3, 6, 7 and 8.","plain":"Blue marks the recommended intermediate rope positions in the ten-lane layout.","source":"wa-cr","location":"p70","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.7.6.2.3","category":"Pool \u0026 equipment","title":"World Championship centre yellow ropes","statement":"At those World Championships, three yellow ropes are recommended around lanes 4 and 5.","plain":"The recommended centre ropes are yellow.","source":"wa-cr","location":"p70","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.7.6.3.1","category":"Pool \u0026 equipment","title":"Other competitions: green ropes","statement":"For the illustrated layout at other competitions, two green ropes are recommended for lanes 1 and 8.","plain":"This is the recommended colour layout, not a requirement that every pool have eight racing lanes.","source":"wa-cr","location":"p70","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.7.6.3.2","category":"Pool \u0026 equipment","title":"Other competitions: blue ropes","statement":"For the illustrated layout at other competitions, four blue ropes are recommended for lanes 2, 3, 6 and 7.","plain":"The recommended intermediate ropes are blue.","source":"wa-cr","location":"p70","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.7.6.3.3","category":"Pool \u0026 equipment","title":"Other competitions: yellow ropes","statement":"For the illustrated layout at other competitions, three yellow ropes are recommended around lanes 4 and 5.","plain":"The recommended central ropes are yellow.","source":"wa-cr","location":"p70","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.7.6.4","category":"Pool \u0026 equipment","title":"Permitted alternative rope colours","statement":"Different lane-rope colours may be used, provided three colours distinguish the respective lane groups.","plain":"A pool may use a different palette, but must still distinguish the lane groups using three colours.","source":"wa-cr","location":"p70","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.7.7","category":"Pool \u0026 equipment","title":"Red rope sections at each wall","statement":"The lane-rope floats must be red for the first 5.0 m from each pool end.","plain":"The red end section identifies the final 5 m approaching a wall; it is not the 15 m underwater limit.","source":"wa-cr","location":"p70","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.7.8","category":"Pool \u0026 equipment","title":"One rope between lanes and required tension","statement":"There may be no more than one rope separating adjacent lanes. Each rope must be firmly tensioned within 1.0–1.2 kN.","plain":"Do not double up lane ropes between lanes; keep each rope within its specified tension range.","source":"wa-cr","location":"p70","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.7.9","category":"Pool \u0026 equipment","title":"Distinctive 15 m rope markers","statement":"Each lane rope must have floats of a contrasting colour at points 15 m from both end walls.","plain":"The 15 m rope markers identify the underwater-distance checkpoint measured from each wall.","source":"wa-cr","location":"p70","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.7.10","category":"Pool \u0026 equipment","title":"Midpoint marker in a 50 m pool","statement":"A 50 m pool must have distinctive lane-rope floats marking the 25 m midpoint, ordinarily using a contrasting colour.","plain":"The middle of a long-course length has its own rope marker; this does not create an extra underwater allowance.","source":"wa-cr","location":"p70","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.7.11","category":"Pool \u0026 equipment","title":"Optional soft lane numbers","statement":"Soft lane-number markers may be attached to ropes at both the starting and turning ends.","plain":"Rope-mounted lane numbers are permitted, but this clause does not require them.","source":"wa-cr","location":"p70","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.8.1","category":"Pool \u0026 equipment","title":"Stable, non-slip starting platform","statement":"The starting platform must be rigid without spring action. Its top must sit 0.50–0.75 m above the water and measure at least 0.50 m in each direction, with a slip-resistant finish.","plain":"The block must be stable, grippy, large enough, and within the specified height range.","source":"wa-cr","location":"p70","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.8.2","category":"Pool \u0026 equipment","title":"Block slope, back plate and gripping edges","statement":"The platform slope cannot exceed 10 degrees. An adjustable rear plate is optional. The block must allow a forward-start grip at the front and sides. Where the top is thicker than 0.04 m, recessed grips are recommended: at least 0.10 m across each side and 0.40 m across the front, cut to 0.03 m from the upper surface.","plain":"A rear foot wedge is allowed. The ability to grip the front and sides is required, while the detailed recessed-grip design is a recommendation.","source":"wa-cr","location":"p70","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.8.3","category":"Pool \u0026 equipment","title":"Backstroke and forward-start handgrips","statement":"Forward-start side grips are optional. Backstroke grips, in both horizontal and vertical arrangements, must be 0.30–0.60 m above the water. They must align parallel with the end wall and cannot project beyond its face.","plain":"Backstroke hands grip above the water, with no part of the grip sticking out past the wall into the course.","source":"wa-cr","location":"p70","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.8.4","category":"Pool \u0026 equipment","title":"Water depth in the block-start zone","statement":"A pool with starting blocks requires at least 1.35 m water depth through the zone beginning 1.0 m from the end wall and continuing to at least 6.0 m from that wall.","plain":"The specified depth must cover the whole start-entry zone. This facility dimension does not replace domestic safe-start requirements or an individual swimmer’s assessment.","source":"wa-cr","location":"p70","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.8.5","category":"Pool \u0026 equipment","title":"Displays beneath starting blocks","statement":"An electronic display may sit below a block, but during a backstroke start it must not flash or show moving figures.","plain":"A display must remain visually steady while backstrokers start.","source":"wa-cr","location":"p70","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.8.6","category":"Pool \u0026 equipment","title":"Visible block numbers","statement":"Each block must carry a clearly visible number on every side. Placing lane 0 at the right when viewed from the starting end is recommended; 50 m races may start at the opposite end. Touch panels may carry numbers at their upper or lower edge.","plain":"Read the visible block number. The recommended numbering viewpoint can differ for a 50 m race starting from the far end.","source":"wa-cr","location":"p70","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.9.1","category":"Pool \u0026 equipment","title":"Backstroke flags and 15 m side marks","statement":"A flagged rope must cross the pool at each end, supported 5.0 m from the end wall and positioned 1.8 m above the water. Distinctive 15.0 m marks are required on both pool sides and, where possible, on every lane rope.","plain":"Flags are 5 m from the wall in both 25 m and 50 m pools. They are a turning reference, separate from the 15 m underwater markers.","source":"wa-cr","location":"p71","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.9.2","category":"Pool \u0026 equipment","title":"Flag shape, spacing and signage","statement":"The triangular flags must have a 0.20 m edge attached to the rope and two other edges of 0.40 m each. Adjacent flags must be 0.25 m apart. Printed material or signage on them requires prior World Aquatics approval.","plain":"Flags have a specified triangular shape and spacing; printed flag designs have an approval requirement under this WA specification.","source":"wa-cr","location":"p71","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.10.1","category":"Pool \u0026 equipment","title":"Backstroke ledge specification","statement":"The WA facility standard requires backstroke ledges complying with the dimensions and adjustment limits in 15.10.1.1–15.10.1.3 and its accompanying diagram.","plain":"Use the specified ledge design where this facility standard applies. This does not by itself establish the equipment provision at every English domestic meet.","source":"wa-cr","location":"p71","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.10.1.1","category":"Pool \u0026 equipment","title":"Ledge adjustment above and below the water","statement":"The backstroke ledge must adjust through a range from 4 cm below to 4 cm above the water level. It cannot be used outside that range.","plain":"Set the ledge no more than 4 cm above or below the surface.","source":"wa-cr","location":"p71","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.10.1.2","category":"Pool \u0026 equipment","title":"Minimum ledge length","statement":"The backstroke ledge must be at least 60 cm long.","plain":"The usable ledge assembly must meet the 60 cm minimum length.","source":"wa-cr","location":"p71","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.10.1.3","category":"Pool \u0026 equipment","title":"Ledge height, width and slope","statement":"The ledge must have a height of 8 cm, a width of 2 cm and a slope of 10 degrees.","plain":"The ledge profile has fixed dimensions; see the labelled diagram for the direction of each measurement.","source":"wa-cr","location":"p71","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.11.1","category":"Pool \u0026 equipment","title":"Competition water temperature","statement":"Pool water must be within 25.0–28.0 degrees Celsius.","plain":"This facility standard sets the permitted water-temperature range.","source":"wa-cr","location":"p71","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.11.2.1","category":"Pool \u0026 equipment","title":"Stable water level during competition","statement":"The water surface level must remain steady during competition, without appreciable movement.","plain":"Pool operation must not create a changing level or a significant current.","source":"wa-cr","location":"p71","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.11.2.2","category":"Pool \u0026 equipment","title":"Water circulation on competition and training days","statement":"Inflow and outflow must be regulated at the size-specific rates below on training and competition days, to maintain level and clarity while accounting for applicable health requirements.","plain":"The stated circulation ranges are tied to pool length; they do not displace public-health requirements.","source":"wa-cr","location":"p71","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.11.2.2.1","category":"Pool \u0026 equipment","title":"50 m pool circulation rate","statement":"For a 50 m pool, the regulated inflow and outflow range is 220–250 cubic metres per hour on the training and competition days covered by 15.11.2.2.","plain":"Long-course circulation uses the 220–250 m³/h range under this specification.","source":"wa-cr","location":"p71","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.11.2.2.2","category":"Pool \u0026 equipment","title":"33.333 m pool circulation rate","statement":"For a 33.333 m pool, the regulated inflow and outflow range is 150–180 cubic metres per hour on the days covered by 15.11.2.2.","plain":"This separate circulation range belongs to a 33.333 m pool.","source":"wa-cr","location":"p71","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.11.2.2.3","category":"Pool \u0026 equipment","title":"25 m pool circulation rate","statement":"For a 25 m pool, the regulated inflow and outflow range is 120–150 cubic metres per hour on the days covered by 15.11.2.2.","plain":"Short-course circulation uses the 120–150 m³/h range under this specification.","source":"wa-cr","location":"p71","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.11.2.3","category":"Pool \u0026 equipment","title":"Water circulation in ordinary use","statement":"Outside competition, daily water inflow and outflow must comply with the health regulations of the country concerned.","plain":"Normal pool operation follows the local public-health rules.","source":"wa-cr","location":"p71","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.11.2.4","category":"Pool \u0026 equipment","title":"Limit on current and turbulence","statement":"The specified turnover rates must not produce appreciable turbulence or current. The current criterion is movement of a floating basketball containing 6 litres of water more than 1.25 m in one direction during 60 seconds.","plain":"The weighted basketball test checks whether the circulation is producing too much directional movement.","source":"wa-cr","location":"p71","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.11.2.5","category":"Pool \u0026 equipment","title":"Practical basketball current test","statement":"Place a basketball prepared as in 15.11.2.4 at the centre of a 2.5 m square formed using floating lines across a lane. The test passes if the ball touches none of the four surrounding ropes within 60 seconds.","plain":"Mark out the square, start the ball centrally, and observe it for a full minute.","source":"wa-cr","location":"p72","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.11.2.6","category":"Pool \u0026 equipment","title":"Recommended current-test locations","statement":"The test should be performed eight times: at each end in lanes 1, 3, 6 and 8. The ball should begin 5 m from the relevant end wall or bulkhead.","plain":"The recommended checks sample both ends and several positions across the pool; this clause uses “should”.","source":"wa-cr","location":"p72","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.12.1","category":"Pool \u0026 equipment","title":"Lighting at Olympic and WA events","statement":"For the Olympic Games and World Aquatics Events, illumination measured from the pool deck must be at least 1,500 lux across the entire pool.","plain":"The named events require the higher light level throughout the pool.","source":"wa-cr","location":"p72","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.12.2","category":"Pool \u0026 equipment","title":"Lighting at other competitions","statement":"At other competitions, illumination over the blocks and turning ends must be at least 600 lux, measured from deck level.","plain":"This provision specifies minimum lighting at the start and turn ends for other competitions.","source":"wa-cr","location":"p72","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.13.1","category":"Pool \u0026 equipment","title":"Floor-line colour, width and length","statement":"The centre of each lane must have a dark, contrasting floor line 0.20–0.30 m wide. Its total length must be 46.0 m in a 50 m pool or 21.0 m in a 25 m pool.","plain":"The floor line stops short of both walls, leaving 2 m at each end.","source":"wa-cr","location":"p72","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.13.2","category":"Pool \u0026 equipment","title":"Floor T markers and lane centres","statement":"The central floor line must stop 2.0 m from each end wall, ending in a perpendicular crossbar 1.0 m long and as wide as the line. Lane and marking centre points must be 2.5 m apart.","plain":"The T warns you that the wall is 2 m away. It is different from the overhead 5 m flags and the 15 m marker.","source":"wa-cr","location":"p72","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.13.3","category":"Pool \u0026 equipment","title":"Wall and touch-panel targets","statement":"A vertical target of the same width as the floor line must be centred on each end wall or touch panel. It must continue from the deck edge to the pool floor, with a maximum extent of 3 m. Its perpendicular crossbar must be 0.5 m long and centred 0.3 m below the water.","plain":"The wall target helps identify the lane centre. Its crossbar sits 30 cm below the surface.","source":"wa-cr","location":"p72","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.13.4","category":"Pool \u0026 equipment","title":"15 m floor crossbars and older pools","statement":"In 25 m and 50 m pools built on or after 1 January 2006, each lane must have a perpendicular 0.5 m crossbar at the 15 m point from each end. Where a crossbar is present, measure the 15 m distance to its centre.","plain":"An older pool may lack this floor marking under the stated exception. The swimming rule’s 15 m limit still applies.","source":"wa-cr","location":"p72","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.14.1","category":"Pool \u0026 equipment","title":"Bulkhead used as an end wall","statement":"A bulkhead serving as an end wall must span the course width and provide a solid, smooth, stable, vertical, non-slip face suitable for touch panels, extending at least 0.8 m below and 0.3 m above the water. It must have no hazardous openings into which a swimmer’s hands, feet or digits could enter. Officials must be able to move along it without creating appreciable current or turbulence.","plain":"A movable wall must function safely as a genuine racing wall and remain stable while officials use it.","source":"wa-cr","location":"p72","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.15","category":"Pool \u0026 equipment","title":"Separation from a diving pool at named events","statement":"At the Olympic Games and World Aquatics Championships, when the swimming and diving pools share an area, the separation rules depend on the pools’ construction date.","plain":"The next two clauses apply to those named events when the two pools occupy the same area.","source":"wa-cr","location":"p72","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.15.1","category":"Pool \u0026 equipment","title":"Separation for pools built from 2014","statement":"For the shared-area pools covered by 15.15 and constructed on or after 1 January 2014, the minimum separation is 8 m; a 10 m separation is preferred.","plain":"Eight metres is the requirement, while ten metres is the preference.","source":"wa-cr","location":"p72","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.15.2","category":"Pool \u0026 equipment","title":"Separation for pools built before 2014","statement":"For the shared-area pools covered by 15.15 and constructed before 1 January 2014, the minimum separation is 5.0 m.","plain":"The older-pool provision permits a smaller minimum gap.","source":"wa-cr","location":"p72","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.1","category":"Pool \u0026 equipment","title":"What electronic officiating equipment records","statement":"Automatic and semi-automatic officiating equipment measure each competitor’s elapsed race time and establish relative finishing positions.","plain":"The system supplies both times and the order in which swimmers finish.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.1.1","category":"Pool \u0026 equipment","title":"Starter initiates electronic timing","statement":"In automatic and semi-automatic systems, the Starter manually initiates the timing.","plain":"Both system types start from the Starter’s action.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.1.2","category":"Pool \u0026 equipment","title":"Automatic finish and video backup","statement":"With automatic equipment, a competitor’s contact with the finish touch panel stops that lane’s clock. The usual backup is video timing calibrated to hundredths of a second.","plain":"The swimmer’s finish touch records the primary time; the described backup uses calibrated video.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.1.3","category":"Pool \u0026 equipment","title":"Two semi-automatic timing arrangements","statement":"Semi-automatic equipment may use swimmer-operated finish panels backed up by officials’ buttons, or may use officials’ buttons when panels are absent or not functioning.","plain":"Semi-automatic timing includes the manual-button arrangements specified in the next two subclauses.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.1.3.1","category":"Pool \u0026 equipment","title":"Panel timing with button backup","statement":"One semi-automatic arrangement stops a competitor’s time through finish-panel contact, with Timekeepers’ manual button presses at the wall touch providing the backup.","plain":"A panel is the main stop, while an official’s button provides the backup stop.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.1.3.2","category":"Pool \u0026 equipment","title":"Button timing without usable panels","statement":"If touch panels are unavailable or not working, Timekeepers stop each competitor’s official electronic time by pressing a button when that swimmer touches the finish wall.","plain":"An official judges the touch and presses the stop button.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.2.1","category":"Pool \u0026 equipment","title":"Starter activation","statement":"Automatic and semi-automatic equipment must be activated by the Starter.","plain":"The Starter triggers the timing system.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.2.2","category":"Pool \u0026 equipment","title":"Protected deck cabling","statement":"Automatic and semi-automatic timing installations must not leave wires or cables exposed on the deck.","plain":"Keep timing cables safely protected around the pool.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.2.3","category":"Pool \u0026 equipment","title":"Results by place and lane","statement":"The system must be able to show all recorded lane information in both finishing-position order and lane order.","plain":"Officials must be able to view results by placing or by lane number.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.2.4","category":"Pool \u0026 equipment","title":"Readable digital times","statement":"The equipment must provide a readily readable digital presentation of each competitor’s time.","plain":"The time display must be clear to read.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.2.5","category":"Pool \u0026 equipment","title":"Timing precision","statement":"The equipment must measure accurately to one hundredth of a second.","plain":"The specified accuracy is 0.01 seconds.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.2.6","category":"Pool \u0026 equipment","title":"No interference from timing equipment","statement":"The installation must not obstruct starts, turns or operation of the pool overflow system.","plain":"Timing equipment must leave swimmers and pool drainage able to function properly.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.3.1","category":"Pool \u0026 equipment","title":"Starter microphone","statement":"A microphone must be available to the Starter for spoken instructions.","plain":"Starting commands are delivered through the microphone.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.3.2","category":"Pool \u0026 equipment","title":"Pistol signal transducer","statement":"When a starting pistol is used, it must operate with a transducer.","plain":"A pistol start requires the specified signal-conversion device.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.3.3","category":"Pool \u0026 equipment","title":"Equal starting sound at every block","statement":"The microphone and pistol transducer must feed loudspeakers at every starting block, giving all competitors the instructions and start signal at equal volume and at the same time.","plain":"Every swimmer must receive the starting information equally and simultaneously.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.3.4","category":"Pool \u0026 equipment","title":"False-start detection installation","statement":"The starting system must include installed false-start detection equipment.","plain":"This is an equipment requirement within the WA facility specification; it does not itself describe how every domestic meet is staffed or equipped.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.4.1","category":"Pool \u0026 equipment","title":"Touch-panel dimensions","statement":"Each touch panel must be at least 2.4 m wide and 0.9 m high. Its thickness at the instant contact closes and stops the time must be 0.01 m.","plain":"The panel must meet the minimum face size and the specified compressed contact thickness.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.4.2","category":"Pool \u0026 equipment","title":"Panel position, separate lane circuits and target","statement":"A touch panel must extend 0.3 m above and 0.6 m below the water. Each lane must have an independent electronic connection for individual control and maintenance. The face must be brightly coloured and carry the required end-wall target marking.","plain":"Panels straddle the waterline and work independently by lane. Their visible wall targets must be retained.","source":"wa-cr","location":"p73","status":"verified","issue":"The printed clause points to 15.14 for wall markings, but the lane and wall markings are described in 15.13. This app flags that cross-reference mismatch rather than silently treating 15.14 as a marking specification.","relatedRuleIds":[]},{"code":"15.16.4.3","category":"Pool \u0026 equipment","title":"Fixed central panel placement","statement":"A touch panel must be fixed in the centre of its lane while installed. A portable design is permitted so it can be removed outside competition use.","plain":"A removable panel is allowed, but it must be securely fixed in its correct racing position.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.4.4","category":"Pool \u0026 equipment","title":"Touch-panel sensitivity","statement":"Water turbulence must not activate a panel, but a light hand contact must activate it. The panel’s upper edge must also respond to contact.","plain":"The panel should register a light hand touch, including at its top edge, without triggering from moving water alone. A recorded time does not by itself prove that the touch complied with the stroke rule.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.4.5","category":"Pool \u0026 equipment","title":"Touch-panel markings and border","statement":"Panel targets must match and align over the pool’s existing markings. A black border 0.025 m wide must define the panel edges and perimeter.","plain":"The panel’s target should line up with the pool target and have a visible 2.5 cm black border.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.4.6","category":"Pool \u0026 equipment","title":"Touch-panel safety","statement":"Touch panels must present neither an electrical-shock hazard nor sharp edges.","plain":"The panel must be safe to touch and turn against.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.5.1","category":"Pool \u0026 equipment","title":"Semi-automatic operation","statement":"Semi-automatic systems must follow the timing arrangements described in 15.16.1.","plain":"Use one of the defined panel-and-button or button-only operating arrangements.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.5.2","category":"Pool \u0026 equipment","title":"Button backup at WA events","statement":"World Aquatics may choose a semi-automatic backup for automatic equipment at its events if each lane has one button operated by its own official. Additional Finish Judges are then unnecessary. An Inspector of Turns may operate a button.","plain":"This is an optional WA event backup arrangement with a separate official for every lane button.","source":"wa-cr","location":"p73","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.6.1","category":"Pool \u0026 equipment","title":"Printing and previous results","statement":"Automatic and semi-automatic equipment must have facilities to print information and retrieve earlier race results electronically.","plain":"Officials need access to a printed record and previous results.","source":"wa-cr","location":"p74","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.6.2","category":"Pool \u0026 equipment","title":"Spectator results display","statement":"An electronic spectator display must be available with automatic and semi-automatic equipment.","plain":"Race information must be available on an electronic display for spectators.","source":"wa-cr","location":"p74","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.6.3","category":"Pool \u0026 equipment","title":"Relay take-off equipment and video support","statement":"Relay changeover judging to 0.01 seconds must be available. Organisers should consult the manufacturer about any changeover time differential. Installed overhead video may supplement the automatic system’s take-off judgement.","plain":"Use the equipment’s proper operating guidance. This does not create a freely chosen tolerance or make overhead video mandatory.","source":"wa-cr","location":"p74","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.6.4","category":"Pool \u0026 equipment","title":"Automatic lap count","statement":"An automatic lap counter must be available with the electronic officiating equipment.","plain":"The equipment package includes an automatic count of completed laps.","source":"wa-cr","location":"p74","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.6.5","category":"Pool \u0026 equipment","title":"Split-time display","statement":"The electronic officiating equipment must provide a way to read split times.","plain":"Intermediate times must be available to read.","source":"wa-cr","location":"p74","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.6.6","category":"Pool \u0026 equipment","title":"Computer summaries","statement":"Computer-generated summaries must be available with the electronic officiating equipment.","plain":"The system must support a computer summary of recorded information.","source":"wa-cr","location":"p74","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.6.7","category":"Pool \u0026 equipment","title":"Correction after erroneous contact","statement":"The equipment must provide a way to correct results caused by an erroneous touch.","plain":"An accidental or incorrect trigger must be capable of correction through the system.","source":"wa-cr","location":"p74","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.6.8","category":"Pool \u0026 equipment","title":"Rechargeable battery capability","statement":"The equipment must have the capability for automatic operation using rechargeable batteries.","plain":"A rechargeable-battery operating option must be available.","source":"wa-cr","location":"p74","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.7.1","category":"Pool \u0026 equipment","title":"Elite-event spectator display size","statement":"At the Olympic Games and World Aquatics Championships, the electronic spectator display used with automatic equipment must measure at least 7.5 m wide by 4.5 m high.","plain":"This large display minimum belongs to the named elite events.","source":"wa-cr","location":"p74","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.7.2","category":"Pool \u0026 equipment","title":"Elite-event control room","statement":"At the Olympic Games and World Aquatics Championships, the air-conditioned control room must be at least 6.0 m by 3.0 m and lie 3.0–5.0 m from the finish wall, with a continuously unobstructed finish view. The Referee must have easy access during competition, and the room must be capable of being secured at other times.","plain":"The named events require a suitably sized, secure control room with an uninterrupted finish view and ready referee access.","source":"wa-cr","location":"p74","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.7.3","category":"Pool \u0026 equipment","title":"Elite-event video officiating support","statement":"At the Olympic Games and World Aquatics Championships, video recordings must be supplied for initiating or confirming stroke-infraction calls and helping the Referee assess pool-deck calls.","plain":"Video forms part of the officiating provision at these named events; the rule is not a claim that every English meet has video review.","source":"wa-cr","location":"p74","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.16.8.1","category":"Pool \u0026 equipment","title":"Timing-room sightline and advertising limits","statement":"Timekeepers must have a clear view from the timing room to the poolside finish end. On that side, advertising panels and LED walls must leave at least 2 m clear from the finish wall and must not exceed 46 m in length.","plain":"Advertising must not block the timing team’s view of the finish.","source":"wa-cr","location":"p74","status":"verified","issue":"","relatedRuleIds":[]},{"code":"15.17","category":"Pool \u0026 equipment","title":"Underwater broadcast equipment","statement":"When broadcasters use underwater video equipment, the Management Committee must ensure remote operation. The equipment must not obstruct swimmers’ route or view, alter the pool setup or specification, or hide required pool markings or applicable World Aquatics markings.","plain":"Broadcast cameras must work without changing or obstructing the racing environment.","source":"wa-cr","location":"p74","status":"verified","issue":"","relatedRuleIds":[]},{"code":"16.1","category":"Medical and safety organisation","title":"Swimming-specific safety rules supplement Part One","statement":"The swimming medical and safety provisions apply at the Olympic Games, World Aquatics Events and other swimming competitions under these regulations. They supplement the medical and safety requirements in Part One section 8.","plain":"Both the general medical framework and these swimming-specific provisions apply within the stated competition scope. This table covers Part Two; it does not reproduce the separate Part One chapter.","source":"wa-cr","location":"PDF p. 75","status":"verified","issue":"","relatedRuleIds":[]},{"code":"16.2","category":"Medical and safety organisation","title":"Plan for training before competition","statement":"When preparing and implementing the Medical Plan, the Local Organising Committee should account for the particular requirements of pre-competition swimming training described in 16.2.1 and 16.2.2.","plain":"Medical planning needs to cover training and warm-up periods as well as races.","source":"wa-cr","location":"PDF p. 75","status":"verified","issue":"","relatedRuleIds":[]},{"code":"16.2.1","category":"Medical and safety organisation","title":"Warm-up attendance and collision risk","statement":"The plan should account for the usual morning and afternoon/evening competition sessions and athletes arriving about 2.5–3 hours before racing to train and warm up. Many swimmers may be in the water, moving around the deck, exercising or stretching. Different strokes and isolated race-skills practice, such as starts, increase the risk of collisions and accidents in and around the water.","plain":"Plan staffing and supervision around the busy period before each session; the arrival times describe likely activity, not a mandatory athlete reporting deadline.","source":"wa-cr","location":"PDF p. 75","status":"verified","issue":"","relatedRuleIds":[]},{"code":"16.2.2","category":"Medical and safety organisation","title":"Adjust lifeguard numbers to warm-up demand","statement":"At major competitions, especially high numbers of athletes may use the warm-up area. The organising committee’s medical team must adapt lifeguard numbers so athletes in the different pools are appropriately safeguarded.","plain":"The lifeguard provision must reflect how many swimmers are using each pool.","source":"wa-cr","location":"PDF p. 75","status":"verified","issue":"","relatedRuleIds":[]},{"code":"16.3","category":"Medical and safety organisation","title":"Position of the field-of-play medical station","statement":"The field-of-play medical station should be as near as practicable to the point where athletes leave the competition pool, while keeping the mixed zone on the deck unobstructed.","plain":"Place medical support close to the pool exit without blocking the athletes’ route through the mixed zone.","source":"wa-cr","location":"PDF p. 75","status":"verified","issue":"","relatedRuleIds":[]},{"code":"16.4.1","category":"Medical and safety organisation","title":"Daily rescue practice for swimming conditions","statement":"The organising committee’s medical team should arrange daily practice of water-retrieval skills by lifeguards during the competition. Practice should consider swimming-specific obstacles, including lane ropes that can impede access and affect the extraction point.","plain":"The recommendation is to rehearse rescue in the actual swimming-pool arrangement, including the lane ropes.","source":"wa-cr","location":"PDF p. 75","status":"verified","issue":"","relatedRuleIds":[]},{"code":"16.4.2","category":"Medical and safety organisation","title":"Recommended lifeguard positions at the competition pool","statement":"The organising committee’s medical team should position three lifeguards at the competition pool: two beside the field-of-play medical station and one on the opposite side.","plain":"This provision recommends a three-person deployment pattern; it does not override the duty to adjust staffing for the number of swimmers and pools in use.","source":"wa-cr","location":"PDF p. 75","status":"verified","issue":"","relatedRuleIds":[]},{"code":"17.1","category":"Pool-layout appendices","title":"Appendix 1: 50m × 25m pool, eight racing lanes","statement":"The plan shows eight 2.5m racing lanes and a further 2.5m outer water space on each side. The drawing labels the wall-to-wall length as 50.020–50.030m for the illustrated arrangement with touch panels at both ends; the racing course remains 50m. The floor line between end Ts spans 46m, with a 25m centre mark. Backstroke flags are drawn 5m from the end walls. Floor lines terminate 2m from each wall; the 15m markers are measured from each end. The panel detail shows a 0.90m height, extending 0.30m above and 0.60m below the surface. Standard touch panels in the inset are 2.40m wide, separated by 0.10m; the edge inset indicates 0.05m clearance. The illustrated eight-lane colour arrangement uses two green ropes at lanes 1 and 8, four blue ropes at lanes 2, 3, 6 and 7, and three yellow ropes around lanes 4 and 5.","plain":"This is the eight-lane long-course arrangement. The outside water spaces are not additional racing lanes in the normal eight-lane setup; section 15.6.1 controls exceptional use.","source":"wa-cr","location":"PDF p. 77","status":"verified","issue":"The official drawing labels a false-start rope at 15m, but no separate operative false-start-rope installation provision was identified in section 15. The diagram label is reported here without inventing an additional rule or changing the start procedures in section 4. Length tolerances and touch-panel conditions must be read together with 15.1–15.2; “Depth*” in the figure is not a universal depth requirement.","relatedRuleIds":[]},{"code":"17.2","category":"Pool-layout appendices","title":"Appendix 2: 50m × 25m pool, ten racing lanes","statement":"The permanent-pool arrangement shows eight central lanes 2.5m wide, outer lanes 2.4m wide, and 0.1m outer gaps. The drawing labels the wall-to-wall length as 50.020–50.030m for the illustrated arrangement with touch panels at both ends; the racing course remains 50m. The floor line between end Ts spans 46m, with a 25m centre mark. Backstroke flags are drawn 5m from the end walls. Floor lines terminate 2m from each wall; the 15m markers are measured from each end. The panel detail shows a 0.90m height, extending 0.30m above and 0.60m below the surface. Interior panel widths are 2.40m with 0.10m gaps; the outer detail labels a 2.27m panel and 0.08m clearance. The illustrated ten-lane colour arrangement uses two green ropes at lanes 0 and 9, six blue ropes at lanes 1, 2, 3, 6, 7 and 8, and three yellow ropes around lanes 4 and 5.","plain":"The permanent ten-lane arrangement fits in 25m of width by using the specified narrower outer lanes. The outer panel detail has a separate source discrepancy noted below.","source":"wa-cr","location":"PDF p. 78","status":"verified","issue":"The official drawing labels a false-start rope at 15m, but no separate operative false-start-rope installation provision was identified in section 15. The diagram label is reported here without inventing an additional rule or changing the start procedures in section 4. Length tolerances and touch-panel conditions must be read together with 15.1–15.2; “Depth*” in the figure is not a universal depth requirement. The inset shows a 2.27m outer touch panel, while 15.16.4.1 specifies a 2.4m minimum. That discrepancy is retained; this illustration must not be treated as independent confirmation that a narrower panel complies.","relatedRuleIds":[]},{"code":"17.3","category":"Pool-layout appendices","title":"Appendix 3: 50m × 26m pool, ten racing lanes","statement":"The temporary-pool arrangement shows ten lanes 2.5m wide with 0.5m outer water gaps on both sides. The drawing labels the wall-to-wall length as 50.020–50.030m for the illustrated arrangement with touch panels at both ends; the racing course remains 50m. The floor line between end Ts spans 46m, with a 25m centre mark. Backstroke flags are drawn 5m from the end walls. Floor lines terminate 2m from each wall; the 15m markers are measured from each end. The panel detail shows a 0.90m height, extending 0.30m above and 0.60m below the surface. Panels are drawn 2.40m wide with 0.10m separation and an indicated 0.05m edge clearance. The illustrated ten-lane colour arrangement uses two green ropes at lanes 0 and 9, six blue ropes at lanes 1, 2, 3, 6, 7 and 8, and three yellow ropes around lanes 4 and 5.","plain":"The extra metre of overall width provides two half-metre outer water spaces around ten full-width lanes.","source":"wa-cr","location":"PDF p. 79","status":"verified","issue":"The official drawing labels a false-start rope at 15m, but no separate operative false-start-rope installation provision was identified in section 15. The diagram label is reported here without inventing an additional rule or changing the start procedures in section 4. Length tolerances and touch-panel conditions must be read together with 15.1–15.2; “Depth*” in the figure is not a universal depth requirement.","relatedRuleIds":[]},{"code":"17.4","category":"Pool-layout appendices","title":"Appendix 4: 50m × 25m pool with the bulkhead at the side","statement":"The layout shows the movable bulkhead in its lateral position for the long-course arrangement. Ten racing lanes occupy the 25m width, with central lanes 2.5m, outer lanes 2.4m and 0.1m outer gaps. The drawing labels the wall-to-wall length as 50.020–50.030m for the illustrated arrangement with touch panels at both ends; the racing course remains 50m. The floor line between end Ts spans 46m, with a 25m centre mark. Backstroke flags are drawn 5m from the end walls. Floor lines terminate 2m from each wall; the 15m markers are measured from each end. The panel detail shows a 0.90m height, extending 0.30m above and 0.60m below the surface. Alternative short-course floor targets are also drawn. The panel inset labels 2.40m interior panels and a 2.27m outer panel. The illustrated ten-lane colour arrangement uses two green ropes at lanes 0 and 9, six blue ropes at lanes 1, 2, 3, 6, 7 and 8, and three yellow ropes around lanes 4 and 5.","plain":"Moving the bulkhead changes the usable course. Use the certified distance between the active race surfaces and the matching floor targets; a nominal pool size alone does not certify a setup.","source":"wa-cr","location":"PDF p. 80","status":"verified","issue":"The official drawing labels a false-start rope at 15m, but no separate operative false-start-rope installation provision was identified in section 15. The diagram label is reported here without inventing an additional rule or changing the start procedures in section 4. Length tolerances and touch-panel conditions must be read together with 15.1–15.2; “Depth*” in the figure is not a universal depth requirement. The inset shows a 2.27m outer touch panel, while 15.16.4.1 specifies a 2.4m minimum. That discrepancy is retained; this illustration must not be treated as independent confirmation that a narrower panel complies.","relatedRuleIds":[]},{"code":"17.5","category":"Pool-layout appendices","title":"Appendix 5: central bulkhead creating short courses","statement":"The 50m × 25m pool is illustrated with a central bulkhead and two short-course arrangements, each labelled 25.020–25.030m wall-to-wall for the shown touch-panel setup. Each short course has backstroke flags 5m from its active end walls and a 21m floor line ending 2m from each wall; the distance between its opposing 15m marks is 5m. The inset compares floor targets when the bulkhead is lateral and central. The marking key gives line/target width 0.25m ± 0.05m; end-wall target crossbar length 0.50m; end-wall target centre 0.30m below the surface; end-of-line floor T crossbar length 1.00m; racing lane width 2.50m; floor-line end 2.00m from the wall; the 15.00m cross-line 13.00m from that floor-line end; and a 25.00m centre reference for the long-course setup. Starred wall-related measurements require the pool tolerance to be taken into account.","plain":"Repositioned bulkheads create different active walls, so flags, length certification and targets must correspond to the course actually being raced. Both arrangements are shown; the drawing is not a blanket approval of any bulkhead position.","source":"wa-cr","location":"PDF p. 81","status":"verified","issue":"The official drawing labels a false-start rope at 15m, but no separate operative false-start-rope installation provision was identified in section 15. The diagram label is reported here without inventing an additional rule or changing the start procedures in section 4. Length tolerances and touch-panel conditions must be read together with 15.1–15.2; “Depth*” in the figure is not a universal depth requirement.","relatedRuleIds":[]},{"code":"17.6","category":"Pool-layout appendices","title":"Appendix 6: 25m × 21m pool, eight racing lanes","statement":"This short-course plan has eight lanes 2.5m wide and 0.5m outer gaps on both sides. The drawing labels the wall-to-wall length as 25.020–25.030m for the illustrated arrangement with touch panels at both ends; the racing course remains 25m. The floor line between end Ts spans 21m. Opposing 15m marks lie 10m and 15m from one end. Backstroke flags are drawn 5m from the end walls. Floor lines terminate 2m from each wall; the 15m markers are measured from each end. The panel detail shows a 0.90m height, extending 0.30m above and 0.60m below the surface. The panel inset shows 2.40m widths, 0.10m gaps and 0.05m edge clearance. The illustrated eight-lane colour arrangement uses two green ropes at lanes 1 and 8, four blue ropes at lanes 2, 3, 6 and 7, and three yellow ropes around lanes 4 and 5.","plain":"Eight 2.5m lanes use 20m of the width; the two half-metre side spaces bring the total to 21m.","source":"wa-cr","location":"PDF p. 82","status":"verified","issue":"The official drawing labels a false-start rope at 15m, but no separate operative false-start-rope installation provision was identified in section 15. The diagram label is reported here without inventing an additional rule or changing the start procedures in section 4. Length tolerances and touch-panel conditions must be read together with 15.1–15.2; “Depth*” in the figure is not a universal depth requirement.","relatedRuleIds":[]},{"code":"17.7","category":"Pool-layout appendices","title":"Appendix 7: 25m × 25m pool, eight racing lanes","statement":"This short-course plan shows eight active 2.5m racing lanes with a 2.5m outer water space on each side; the outer floor lines are shown faded. The drawing labels the wall-to-wall length as 25.020–25.030m for the illustrated arrangement with touch panels at both ends; the racing course remains 25m. The floor line between end Ts spans 21m. Opposing 15m marks lie 10m and 15m from one end. Backstroke flags are drawn 5m from the end walls. Floor lines terminate 2m from each wall; the 15m markers are measured from each end. The panel detail shows a 0.90m height, extending 0.30m above and 0.60m below the surface. The standard panel inset shows 2.40m widths and 0.10m gaps. The illustrated eight-lane colour arrangement uses two green ropes at lanes 1 and 8, four blue ropes at lanes 2, 3, 6 and 7, and three yellow ropes around lanes 4 and 5.","plain":"This is an eight-lane race configuration in a wider 25m basin. The extra outside water spaces should not be mistaken for active racing lanes in this illustrated setup.","source":"wa-cr","location":"PDF p. 83","status":"verified","issue":"The official drawing labels a false-start rope at 15m, but no separate operative false-start-rope installation provision was identified in section 15. The diagram label is reported here without inventing an additional rule or changing the start procedures in section 4. Length tolerances and touch-panel conditions must be read together with 15.1–15.2; “Depth*” in the figure is not a universal depth requirement.","relatedRuleIds":[]},{"code":"17.8","category":"Pool-layout appendices","title":"Appendix 8: 25m × 25m pool, ten racing lanes","statement":"The short-course permanent-pool layout has eight central 2.5m lanes, two outer 2.4m lanes and 0.1m outer gaps. The drawing labels the wall-to-wall length as 25.020–25.030m for the illustrated arrangement with touch panels at both ends; the racing course remains 25m. The floor line between end Ts spans 21m. Opposing 15m marks lie 10m and 15m from one end. Backstroke flags are drawn 5m from the end walls. Floor lines terminate 2m from each wall; the 15m markers are measured from each end. The panel detail shows a 0.90m height, extending 0.30m above and 0.60m below the surface. The panel detail labels 2.40m interior panels with 0.10m gaps and a 2.27m outer panel with 0.08m clearance. The illustrated ten-lane colour arrangement uses two green ropes at lanes 0 and 9, six blue ropes at lanes 1, 2, 3, 6, 7 and 8, and three yellow ropes around lanes 4 and 5.","plain":"This is the ten-lane short-course configuration in a 25m-wide basin. The narrower outer touch-panel illustration has the discrepancy described below.","source":"wa-cr","location":"PDF p. 84","status":"verified","issue":"The official drawing labels a false-start rope at 15m, but no separate operative false-start-rope installation provision was identified in section 15. The diagram label is reported here without inventing an additional rule or changing the start procedures in section 4. Length tolerances and touch-panel conditions must be read together with 15.1–15.2; “Depth*” in the figure is not a universal depth requirement. The inset shows a 2.27m outer touch panel, while 15.16.4.1 specifies a 2.4m minimum. That discrepancy is retained; this illustration must not be treated as independent confirmation that a narrower panel complies.","relatedRuleIds":[]},{"code":"17.9","category":"Pool-layout appendices","title":"Appendix 9: 25m × 26m pool, ten racing lanes","statement":"The short-course temporary-pool layout has ten 2.5m lanes and 0.5m outer water gaps on each side. The drawing labels the wall-to-wall length as 25.020–25.030m for the illustrated arrangement with touch panels at both ends; the racing course remains 25m. The floor line between end Ts spans 21m. Opposing 15m marks lie 10m and 15m from one end. Backstroke flags are drawn 5m from the end walls. Floor lines terminate 2m from each wall; the 15m markers are measured from each end. The panel detail shows a 0.90m height, extending 0.30m above and 0.60m below the surface. Panels are illustrated at 2.40m wide, with 0.10m gaps and 0.05m edge clearance. The illustrated ten-lane colour arrangement uses two green ropes at lanes 0 and 9, six blue ropes at lanes 1, 2, 3, 6, 7 and 8, and three yellow ropes around lanes 4 and 5.","plain":"Ten full-width lanes plus half a metre outside each outer lane produce the 26m overall width.","source":"wa-cr","location":"PDF p. 85","status":"verified","issue":"The official drawing labels a false-start rope at 15m, but no separate operative false-start-rope installation provision was identified in section 15. The diagram label is reported here without inventing an additional rule or changing the start procedures in section 4. Length tolerances and touch-panel conditions must be read together with 15.1–15.2; “Depth*” in the figure is not a universal depth requirement.","relatedRuleIds":[]},{"code":"17.10","category":"Pool-layout appendices","title":"Appendix 10: 50m course floor and end-wall markings","statement":"The marking key gives line/target width 0.25m ± 0.05m; end-wall target crossbar length 0.50m; end-wall target centre 0.30m below the surface; end-of-line floor T crossbar length 1.00m; racing lane width 2.50m; floor-line end 2.00m from the wall; the 15.00m cross-line 13.00m from that floor-line end; and a 25.00m centre reference for the long-course setup. Starred wall-related measurements require the pool tolerance to be taken into account. Across the full course, the labelled floor distances are 2m from the first wall to its T, 13m to the first 15m marker, 10m to the centre, 10m to the opposing 15m marker, 13m to the far T and 2m to the far wall. The floor line between the two end Ts is 46m long. In the drawing, the 25m centre crossbar also uses the 1.00m dimension; the 15m floor crossbars use the 0.50m dimension.","plain":"The floor T is 2m from the wall, not 5m. The backstroke flags are a different feature. This guide states the dimensions in the appendix; operative marking requirements and any exemption remain in 15.13.","source":"wa-cr","location":"PDF p. 86","status":"verified","issue":"","relatedRuleIds":[]},{"code":"414.1","category":"English application","title":"English referee authority and event conditions","statement":"Within Swim England competition, the referee controls the officials and enforces the applicable Swim England regulations, technical rules and the promoter’s conditions.","plain":"The referee oversees the competition. The event’s conditions matter alongside the technical rules.","source":"se-handbook","location":"PDF p. 87","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"414.2","category":"English application","title":"English referee intervention","statement":"The referee may intervene during the competition to ensure that the applicable regulations are observed.","plain":"The referee can step in to enforce the competition rules.","source":"se-handbook","location":"PDF p. 87","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"501.1","category":"English application","title":"Which technical rules apply in England","statement":"Subject to the stated domestic provisions, swimming under Swim England jurisdiction uses the relevant World Aquatics rules, including its swimming rules and applicable bylaws. Published Swim England health and safety guidance takes precedence where it conflicts with those technical rules.","plain":"Use the applicable World Aquatics swimming rules together with English provisions. A technical diving-start rule does not override Swim England safety requirements.","source":"se-handbook","location":"PDF p. 90","status":"verified","issue":"","relatedRuleIds":["dive-start"]}],"ruleAliases":[{"alias":"8.6.7","code":"8.6","source":"wa-commentary","location":"PDF p. 2","note":"Numbering: the February rulebook places the butterfly finish allowance in 8.6. The August commentary labels the same finish point 8.6.7; either code finds this rule here."}],"updates":[{"id":"breaststroke-turn","title":"Breaststroke turn: rotate before any kick","label":"August clarification · 6 August 2026","summary":"You may leave a breaststroke turn on your back, but must rotate past vertical onto the breast before any kick. The body must be on the breast when the first arm stroke begins.","points":["“Any kick” includes the permitted dolphin/butterfly kick in the pullout. Do not teach a dolphin kick while the swimmer is still on the back after the turn.","The first arm stroke must begin on the breast. The August clarification adds the explicit condition on kicking; the February wording alone misses that condition.","This departure permission follows a legal breaststroke turn touch. A backstroke-to-breaststroke medley change still requires the outgoing backstroke finish touch on the back before the next stroke begins."],"scope":"This states the latest World Aquatics guidance. Its specific English application following the August commentary has not been independently confirmed; the app keeps that issue visible.","relatedCodes":["7.2","7.3","7.1","9.4"],"refs":[{"source":"wa-cr","clause":"Part Two 7.1–7.3","location":"PDF p. 61"},{"source":"wa-commentary","clause":"6 August 2026 commentary on 7.3","location":"PDF p. 2"}]},{"id":"freestyle-finish","title":"Freestyle finish: conditional submersion in the final 5m","label":"February change · August clarification","summary":"Once the head has passed the final 5m mark, complete submersion is permitted when reaching for the finish wall.","points":["This is a finish-reaching allowance, not permission to swim the whole final 5m underwater.","It does not apply to the approach to a turn and does not change the head-surfacing limit after a start or turn.","The finish wall must still be touched. Backstroke already had a final-5m finish allowance; the freestyle provision is a 2026 addition."],"scope":"English adoption of the February package is verified on the dates below. The August commentary reinforces the finish-reaching condition already present in February; a separate English application date for that commentary has not been confirmed.","relatedCodes":["5.2","5.3","5.4","6.5"],"refs":[{"source":"wa-cr","clause":"Part Two 5.2–5.4","location":"PDF p. 60"},{"source":"wa-commentary","clause":"6 August 2026 commentary on 5.4","location":"PDF p. 1"},{"source":"se-nw-adoption","clause":"2026 changes and implementation","location":"Implementation notice"},{"source":"wa-2025","clause":"Part Two 5.3 (freestyle), 6.3 (backstroke)","location":"PDF p. 75"}]},{"id":"butterfly-finish","title":"Butterfly finish: submersion still needs a legal touch","label":"February change · August clarification","summary":"The final-5m finish-reaching submersion allowance also applies to butterfly. Both separated hands must still touch at the same time.","points":["The head must have passed the final 5m mark, and the swimmer must be reaching for the finish. This is not an approach-to-turn exception.","The February rulebook contains the allowance in 8.6. The August commentary calls the finish point 8.6.7; the lookup accepts both references.","“Separated” means the hands are not stacked. A visible gap or equal hand height is not required."],"scope":"English adoption of the February package is verified. August reinforces its finish-reaching condition; a separate English application date for that commentary has not been confirmed. The submersion allowance does not replace the two-hand finish.","relatedCodes":["8.5","8.6"],"refs":[{"source":"wa-cr","clause":"Part Two 8.5–8.6","location":"PDF p. 62"},{"source":"wa-commentary","clause":"6 August 2026 commentary on 8.6.7","location":"PDF p. 2"},{"source":"se-nw-adoption","clause":"2026 finish changes","location":"Implementation notice"},{"source":"wa-2025","clause":"Part Two 8.5","location":"PDF p. 76"}]},{"id":"butterfly-turn","title":"Butterfly turn: on the breast after leaving the wall","label":"August clarification · 6 August 2026","summary":"For butterfly, the body must be on the breast after leaving the turn wall. Do not delay that position until the first arm stroke.","points":["The commentary removes the reference to turns from 8.1; that clause’s first-arm-stroke test remains for the start.","For the turn, clarified 8.2 puts the body-position requirement at departure from the wall.","Do not apply the breaststroke departure permission to butterfly."],"scope":"This states the latest World Aquatics guidance. Its specific English application following the August commentary has not been independently confirmed; the app keeps that issue visible.","relatedCodes":["8.1","8.2"],"refs":[{"source":"wa-cr","clause":"Part Two 8.1–8.2","location":"PDF p. 62"},{"source":"wa-commentary","clause":"6 August 2026 commentary on 8.1–8.2","location":"PDF p. 2"}]},{"id":"four-hundred","title":"400m freestyle: lap cards and warning signal","label":"February change · 2026","summary":"Lap recording, lap cards and the warning bell or whistle now include individual 400m freestyle, as well as 800m and 1500m.","points":["Turn inspectors at both ends record completed lengths. At the turning end, lap cards show odd numbers for the lengths still to swim; permitted electronic displays may be used.","At the starting end, give the warning with two pool lengths plus 5m remaining: 55m in a 25m pool or 105m in a 50m pool.","Repeat the signal after the turn until the swimmer reaches the 5m mark on the lane rope."],"scope":"In England the February package applies at Level 1 meets from 27 March 2026 and at all other levels, including unlicensed meets, from 11 May 2026. This includes club championships held under those rules.","relatedCodes":["2.8.6","2.8.7"],"refs":[{"source":"wa-cr","clause":"Part Two 2.8.6–2.8.7","location":"PDF p. 55"},{"source":"se-nw-adoption","clause":"400m lap counting and warnings; implementation dates","location":"Implementation notice"},{"source":"wa-2025","clause":"Part Two 2.6.6–2.6.7","location":"PDF p. 72"}]},{"id":"injury-tape","title":"Injury tape and nasal strips: read the August guidance","label":"February change · August clarification","summary":"The February injury-tape permission covers one or two fingers or toes, including binding two together. August guidance extends injury-treatment or protection tape to other body parts.","p
