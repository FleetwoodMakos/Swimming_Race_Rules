.3.4","category":"Seeding and progression","title":"Assigning semi-final lanes","statement":"Use the centre-outwards lane order in 3.2.5.1. When heats have been held, rank swimmers by their official heat times rather than their entry times. Without heats, use the entry-based ranking.","plain":"Semi-final lanes use the normal centre-out order, based on heat performance if there were heats.","source":"wa-cr","location":"PDF p. 58","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.3.5","category":"Seeding and progression","title":"Relay semi-final clause withdrawn by commentary","statement":"There is no operative World Aquatics relay semi-final allocation under this clause. The February printing extended 3.3.1–3.3.4 to relay teams, but the August commentary says that insertion was erroneous and is not applied because World Aquatics relay events do not include semi-finals.","plain":"World Aquatics relay events have no semi-final round. This printed relay semi-final clause has been withdrawn by the later commentary.","source":"wa-cr","location":"PDF p. 59","status":"verified","issue":"World Aquatics commentary dated 6 August 2026, PDF p. 1, explicitly disapplies 3.3.5 and says it will be removed at the next annual revision. The row remains in the complete index so readers can understand the printed code.","relatedRuleIds":[]},{"code":"3.4","category":"Seeding and progression","title":"Seeding the final","statement":"At Olympic, World Aquatics and other competitions governed by these regulations, individual and relay final lanes are allocated by seeding under the provisions that follow.","plain":"Final lane assignments follow the applicable seeding and progression rules.","source":"wa-cr","location":"PDF p. 59","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.4.1","category":"Seeding and progression","title":"Eight qualifiers for the final","statement":"The printed qualification rule selects the eight fastest swimmers using semi-final times, or entry times where the event is a direct final. Rules 3.4.2.2–3.4.2.3 provide the specific longer-distance exceptions that can expand a final to nine or ten swimmers.","plain":"Normally eight swimmers qualify for the final. The special longer-distance tie rules can admit extra swimmers when ten lanes are available.","source":"wa-cr","location":"PDF p. 59","status":"verified","issue":"This February provision expressly names semi-final times and direct-final entry times; it does not expressly state the qualifying-time basis for a heats-to-final event with no semi-final round. Rule 3.7.2 confirms that such formats exist. This entry does not silently replace the printed wording with an inferred formula.","relatedRuleIds":[]},{"code":"3.4.2.1","category":"Seeding and progression","title":"Tie for the last final place at 200m or shorter","statement":"For an event of 200m or less, swimmers tied in seeding for the final available final place may race a swim-off to determine who qualifies.","plain":"A tie for the last final place at 50m, 100m or 200m may require a swim-off.","source":"wa-cr","location":"PDF p. 59","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.4.2.2","category":"Seeding and progression","title":"Longer race: two tied for eighth with ten lanes","statement":"For an event longer than 200m, including a relay, if seven entrants already have final places and exactly two share the eighth-place seed, both tied entrants join the final when it is held in a ten-lane pool. Lane 0 is added, making nine finalists; a draw assigns the tied pair to lanes 8 and 0.","plain":"With two tied for eighth in a longer race and ten lanes available, both get a final place. Draw lanes 8 and 0 between them.","source":"wa-cr","location":"PDF p. 59","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.4.2.3","category":"Seeding and progression","title":"Longer race: three tied for eighth with ten lanes","statement":"For an event longer than 200m, including a relay, if seven entrants already have final places and exactly three share the eighth-place seed, all three join the final when it is held in a ten-lane pool. Lanes 0 and 9 are added, making ten finalists; a draw assigns the tied three to lanes 8, 0 and 9.","plain":"With three tied for eighth in a longer race and ten lanes available, all three get a final place. Draw lanes 8, 0 and 9 between them.","source":"wa-cr","location":"PDF p. 59","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.4.2.4","category":"Seeding and progression","title":"Longer race: more than three tied for eighth","statement":"For an event longer than 200m, including a relay, if seven entrants already have final places in a ten-lane pool and more than three share the eighth-place seed, a swim-off may be used to resolve qualification.","plain":"If more than three swimmers or teams tie for the last place in this longer-race situation, officials may arrange a swim-off.","source":"wa-cr","location":"PDF p. 59","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.4.2.5","category":"Seeding and progression","title":"Longer-race ties without a ten-lane pool","statement":"If the longer-distance tie situations described in 3.4.2.2–3.4.2.4 arise but a ten-lane pool is unavailable, a swim-off may be used instead of the additional-lane arrangement.","plain":"Without ten lanes, those longer-distance ties may require a swim-off.","source":"wa-cr","location":"PDF p. 59","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.4.3","category":"Seeding and progression","title":"Replacing a withdrawn finalist","statement":"If a finalist withdraws, the management committee gives the place to the fastest previously unqualified swimmer when it considers this reasonably possible. When a replacement is made, it re-ranks and re-seeds the final and allocates lanes again under 3.4.4.","plain":"A withdrawal may admit the next-fastest reserve. If that happens, the final is re-seeded.","source":"wa-cr","location":"PDF p. 59","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.4.4","category":"Seeding and progression","title":"Assigning final lanes","statement":"Use the centre-outwards lane order specified in 3.2.5.1. If semi-finals took place, rank swimmers by their official semi-final times rather than the times submitted with their entries. If no semi-finals took place, the printed rule directs officials to 3.2.5.1.","plain":"Use the normal centre-out lane order for the final, with semi-final times determining the order where semi-finals were held.","source":"wa-cr","location":"PDF p. 59","status":"verified","issue":"For a format with heats but no semi-finals, this clause points to the lane-order provision 3.2.5.1 without expressly naming the ranking-time basis. The explanation retains that printed limit instead of inventing missing words.","relatedRuleIds":[]},{"code":"3.4.5","category":"Seeding and progression","title":"Relay final seeding: printed reference needs care","statement":"The printed relay-final provision says to apply 3.3.1–3.3.4 with each relay team treated as an entrant. Those cited clauses describe semi-finals, so the cross-reference does not provide a clear, self-contained relay-final allocation procedure. This entry preserves the reference and identifies the inconsistency rather than replacing it with an unverified correction.","plain":"This printed relay-final code points to semi-final instructions. The cross-reference is inconsistent; it should not be used to invent a second relay-final race or a relay semi-final round.","source":"wa-cr","location":"PDF p. 59","status":"verified","issue":"The February PDF cites 3.3.1–3.3.4 for relay finals. The archived 6 August commentary withdraws relay semi-finals at 3.3.5 but does not correct 3.4.5. No corrected target for this reference has been independently established in this review. Consult the event’s published progression arrangements or the responsible officials for this unresolved detail.","relatedRuleIds":[]},{"code":"3.5","category":"Seeding and progression","title":"Reporting to the call rooms","statement":"For Olympic and World Aquatics heats, semi-finals and finals, swimmers must attend the first call room at the time set by the management committee. After the inspection, they move to the final call room.","plain":"At these events, report at the stated call-room time, complete the checks and then proceed to the final call room.","source":"wa-cr","location":"PDF p. 59","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.6","category":"Seeding and progression","title":"Drawn lanes outside this seeding framework","statement":"Competitions outside the Olympics, World Aquatics events and other events governed by the Competition Regulations may allocate lanes by a draw.","plain":"Outside the specified World Aquatics rules framework, a competition may draw lane positions.","source":"wa-cr","location":"PDF p. 59","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.7.1","category":"Seeding and progression","title":"25m World and Junior Championships: 50m and 100m rounds","statement":"At the World Aquatics Swimming Championships (25m) and the World Aquatics Junior Swimming Championships, 50m and 100m events have heats, semi-finals and finals.","plain":"At these two championships, 50m and 100m use three rounds.","source":"wa-cr","location":"PDF p. 59","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.7.2","category":"Seeding and progression","title":"25m World and Junior Championships: 200m and longer rounds","statement":"At the World Aquatics Swimming Championships (25m) and the World Aquatics Junior Swimming Championships, events of at least 200m have heats and finals only, with no semi-final round.","plain":"At these two championships, 200m and longer events go from heats to the final.","source":"wa-cr","location":"PDF p. 59","status":"verified","issue":"","relatedRuleIds":[]},{"code":"3.7.3","category":"Seeding and progression","title":"800m and 1500m may use timed finals at these championships","statement":"At the World Aquatics Swimming Championships (25m) and World Aquatics Junior Swimming Championships, the management committee may choose timed finals for 800m and 1500m freestyle. If it does, only the fastest heat is scheduled in the finals session.","plain":"Officials may run 800m and 1500m freestyle as timed finals, with only the fastest heat in the finals session.","source":"wa-cr","location":"PDF p. 59","status":"verified","issue":"","relatedRuleIds":[]},{"code":"4.1","category":"Starts","title":"Races with a dive start","statement":"A dive is the required standard start for freestyle, breaststroke, butterfly and individual medley.","plain":"These four race types start from the block.","source":"wa-cr","location":"PDF p. 60","status":"verified","issue":"","relatedRuleIds":["dive-start"]},{"code":"4.1.1","category":"Starts","title":"Whistles before a dive start","statement":"After competitors have removed clothing other than their swimwear, several short referee whistles call them to prepare at the starting end. The following long whistle instructs them to mount the platforms and stay there.","plain":"Get ready at the short whistles; step onto your block at the long whistle.","source":"wa-cr","location":"PDF p. 60","status":"verified","issue":"","relatedRuleIds":["dive-start"]},{"code":"4.1.2","category":"Starts","title":"Referee hands control to the starter","statement":"Once competitors and officials are ready, the referee extends an arm to transfer control of the competitors to the starter. The arm remains extended until the race-start signal.","plain":"The referee’s raised arm shows that the starter is now controlling the start.","source":"wa-cr","location":"PDF p. 60","status":"verified","issue":"","relatedRuleIds":["start-signal"]},{"code":"4.1.3","category":"Starts","title":"Starting position on the platform","statement":"The instruction to take starting marks requires an immediate move into the starting stance. A minimum of one foot must touch the platform’s front edge. There is no prescribed placement for the hands.","plain":"At “take your marks”, get into position with at least one foot at the front of the block.","source":"wa-cr","location":"PDF p. 60","status":"verified","issue":"","relatedRuleIds":["dive-start"]},{"code":"4.1.4","category":"Starts","title":"Stillness before the signal","statement":"The starter gives the race-start signal when every competitor is stationary (still).","plain":"Settle and stay still while waiting for the signal.","source":"wa-cr","location":"PDF p. 60","status":"verified","issue":"","relatedRuleIds":["start-signal"]},{"code":"4.2","category":"Starts","title":"Races with an in-water start","statement":"Backstroke and medley relay races require a start from within the pool.","plain":"Backstroke starts in the water, including the first leg of a medley relay.","source":"wa-cr","location":"PDF p. 60","status":"verified","issue":"","relatedRuleIds":["dive-start","back-start"]},{"code":"4.2.1","category":"Starts","title":"First long whistle for an in-water start","statement":"Once competitors have removed clothing other than swimwear, several short referee whistles call them to prepare at the starting end. The following long whistle instructs them to enter the pool immediately.","plain":"For backstroke, enter the water at the first long whistle.","source":"wa-cr","location":"PDF p. 60","status":"verified","issue":"","relatedRuleIds":["back-start"]},{"code":"4.2.2","category":"Starts","title":"Second long whistle for an in-water start","statement":"A second long whistle from the referee instructs competitors to reach their starting positions promptly.","plain":"At the second long whistle, come straight to your starting position.","source":"wa-cr","location":"PDF p. 60","status":"verified","issue":"","relatedRuleIds":["back-start"]},{"code":"4.2.3","category":"Starts","title":"Referee hands control over for an in-water start","statement":"Once competitors and officials are ready, the referee extends an arm to put the competitors under the starter’s control and keeps it extended until the race-start signal.","plain":"The referee’s arm tells you the starter is now in charge.","source":"wa-cr","location":"PDF p. 60","status":"verified","issue":"","relatedRuleIds":["start-signal","back-start"]},{"code":"4.2.4","category":"Starts","title":"Marks command for an in-water start","statement":"The starter instructs competitors to take their marks after everyone has adopted the backstroke starting position required by rule 6.1.","plain":"Set yourself at the wall with the correct hand and foot position, then follow the marks command.","source":"wa-cr","location":"PDF p. 60","status":"verified","issue":"","relatedRuleIds":["back-start"]},{"code":"4.2.5","category":"Starts","title":"Stillness for an in-water start","statement":"The starter gives the race-start signal when every competitor is stationary (still).","plain":"Stay still in your starting position until the signal.","source":"wa-cr","location":"PDF p. 60","status":"verified","issue":"","relatedRuleIds":["start-signal","back-start"]},{"code":"4.3","category":"Starts","title":"Commands at World Aquatics events","statement":"At Olympic Games, World Aquatics Championships and other World Aquatics events, the marks instruction is given in English. Speakers at each starting platform carry the commands and start signal.","plain":"At these international events, listen for the English marks command through the speaker by your block.","source":"wa-cr","location":"PDF p. 60","status":"verified","issue":"","relatedRuleIds":["start-signal"]},{"code":"4.4","category":"Starts","title":"Starting before the signal","statement":"Initiating the start before the race-start signal is grounds for disqualification.","plain":"Wait for the signal before beginning your start; an early start can mean a DQ.","source":"wa-cr","location":"PDF p. 60","status":"verified","issue":"","relatedRuleIds":["start-signal"]},{"code":"4.4.1","category":"Starts","title":"Early start discovered after the signal","statement":"If the race-start signal has already sounded before an early-start disqualification is announced, competitors continue racing. The disqualification is imposed when the race ends.","plain":"Keep racing if the signal has sounded; an early starter can be disqualified afterwards.","source":"wa-cr","location":"PDF p. 60","status":"verified","issue":"","relatedRuleIds":["start-signal"]},{"code":"4.4.2","category":"Starts","title":"Early start declared before the signal","statement":"If an early-start disqualification is announced before the signal, the starter does not start the race. Remaining competitors are told to stand down, then the referee restarts the procedure at the appropriate long whistle: rule 4.1.1 for a dive start or 4.2.2 for an in-water start.","plain":"If officials stop the start before the signal, stand down and follow the repeated starting procedure.","source":"wa-cr","location":"PDF p. 60","status":"verified","issue":"","relatedRuleIds":["start-signal"]},{"code":"5.1","category":"Freestyle","title":"Which strokes freestyle permits","statement":"A freestyle event allows any swimming style. The freestyle section of an individual medley or medley relay excludes backstroke, breaststroke and butterfly.","plain":"Freestyle usually means you may choose any stroke. In medley freestyle, you must use something other than the other three strokes.","source":"wa-cr","location":"PDF p. 60","status":"verified","issue":"","relatedRuleIds":["free-style","im-free"]},{"code":"5.2","category":"Freestyle","title":"Freestyle wall contact","statement":"Completion of every length, including the last, requires contact between the wall and some part of the swimmer’s body.","plain":"Touch the wall at every turn and at the finish. A hand is not the only body part that can count.","source":"wa-cr","location":"PDF p. 60","status":"verified","issue":"","relatedRuleIds":["free-wall"]},{"code":"5.3","category":"Freestyle","title":"Freestyle: head at the surface by 15 metres","statement":"After every start and turn, the head must already have broken the water surface no later than 15 metres from that wall. A first head breakout at 15.01 metres is too late. Full submersion (being completely submerged) is allowed during the turn and within that start/turn distance. Otherwise, some portion of the swimmer’s body must intersect the surface throughout the swim; rule 5.4 provides a separate finish exception.","plain":"Your head must break the surface by 15m, never beyond it. After breakout, keep some part of your body at the surface, subject to the separate turn and finish exceptions.","source":"wa-cr","location":"PDF p. 60","status":"verified","issue":"","relatedRuleIds":["free-underwater"]},{"code":"5.4","category":"Freestyle","title":"Freestyle: submersion on the finish reach","statement":"Complete submersion (being completely submerged) is permitted when reaching for the final wall, but only after some portion of the head has passed the marker 5 metres from that wall. This is a finish-reaching exception, not general permission for an underwater final 5 metres.","plain":"Your head must be past the 5m marker and you must be reaching for the finish before you may be fully underwater.","source":"wa-cr","location":"PDF p. 60","status":"verified","issue":"","relatedRuleIds":["free-finish"]},{"code":"6.1","category":"Backstroke","title":"Backstroke starting grip and foot placement","statement":"Before the signal, the swimmer is in the pool looking towards the starting wall and holding the starting grips with both hands. The gutter cannot be used as a standing surface or hooked with the toes. If a backstroke ledge is used, each foot needs at least one toe touching the wall or the front face of the timing pad. Toes must not hook over the pad’s top.","plain":"Face the wall and hold both grips. With a ledge, keep a toe from each foot against the wall or pad face; do not hook your toes over the top.","source":"wa-cr","location":"PDF p. 61","status":"verified","issue":"","relatedRuleIds":["back-start"]},{"code":"6.2","category":"Backstroke","title":"Backstroke body position","statement":"At the start signal and after each turn, the swimmer pushes away on the back and retains that orientation while swimming, apart from the turn allowed by rule 6.4. Body rotation towards either side must remain less than 90 degrees from horizontal. Head direction does not determine compliance.","plain":"Stay on your back. You can roll towards your side, but not reach or pass vertical during ordinary swimming.","source":"wa-cr","location":"PDF p. 61","status":"verified","issue":"","relatedRuleIds":["back-body","back-turn"]},{"code":"6.3","category":"Backstroke","title":"Backstroke: head at the surface by 15 metres","statement":"After every start and turn, the head must already have broken the water surface no later than 15 metres from that wall. Breaking out for the first time at 15.01 metres breaches the limit. Full submersion (being completely submerged) is allowed during the turn and within that start/turn distance. At other times, some portion of the body must intersect the surface, with the separate finish provision in rule 6.5.","plain":"Your head must break the surface by 15m. Keep part of your body at the surface afterwards unless a turn or the finish exception applies.","source":"wa-cr","location":"PDF p. 61","status":"verified","issue":"","relatedRuleIds":["back-underwater"]},{"code":"6.4","category":"Backstroke","title":"Backstroke turn into another backstroke length","statement":"The turn requires wall contact by some part of the body. The shoulders may rotate beyond vertical towards the breast for the turn. If an arm action starts the turn, it must be an immediate, continuous pull with either one arm (a single-arm pull) or both arms simultaneously (a double-arm pull). The swimmer must be back on the back at wall departure.","plain":"For a backstroke-to-backstroke turn, roll and turn without interrupting the permitted pull, touch the wall, and push off on your back. This is not the backstroke-to-breaststroke medley transition.","source":"wa-cr","location":"PDF p. 61","status":"verified","issue":"","relatedRuleIds":["back-turn"]},{"code":"6.5","category":"Backstroke","title":"Backstroke finish on the back","statement":"The final wall touch must occur with the swimmer still on the back. Complete submersion (being completely submerged) is allowed during the finish reach once the head has passed the marker 5 metres from the finish wall.","plain":"Touch the finish on your back. Being underwater can be legal during the finish reach after your head has passed 5m.","source":"wa-cr","location":"PDF p. 61","status":"verified","issue":"","relatedRuleIds":["back-finish","im-transition"]},{"code":"7.1","category":"Breaststroke","title":"Breaststroke pullout and breakout","statement":"After each start and turn, one underwater arm pull may extend as far as the legs. One optional butterfly kick is allowed before the first breaststroke kick. During the second arm stroke, the head must break the surface before the hands begin to sweep inward from their widest separation.","plain":"You may take one long pullout and one butterfly kick before your first breaststroke kick. Your head must surface before the inward sweep of the second pull.","source":"wa-cr","location":"PDF p. 61","status":"verified","issue":"","relatedRuleIds":["breast-pullout"]},{"code":"7.2","category":"Breaststroke","title":"Breaststroke position when the first pull starts","statement":"After a start or turn, the swimmer must be oriented on the breast from the instant the first arm stroke begins.","plain":"Be on your breast before you begin your first pull.","source":"wa-cr","location":"PDF p. 61","status":"verified","issue":"","relatedRuleIds":["breast-action","breast-departure-review"]},{"code":"7.3","category":"Breaststroke","title":"Breaststroke cycle and orientation after a turn","statement":"Ordinary breaststroke swimming does not allow a roll onto the back. After a legal turn touch, rotation may be in any direction, with breast orientation restored by the start of the first arm stroke following departure. Throughout the race, each stroke cycle uses an arm action followed by a leg kick, and both arms act simultaneously, rather than alternating. The August World Aquatics commentary also requires rotation past vertical towards the breast before any kick after the turn.","plain":"Swim pull, then kick, with both arms working together. Turn freely after touching; the latest World Aquatics guidance says get past your side towards your breast before kicking.","source":"wa-cr","location":"PDF p. 61","status":"withheld","issue":"February rule: body on the breast by the first arm stroke after departure. World Aquatics commentary dated 6 August 2026, p. 2, additionally requires return past vertical towards the breast before a post-turn kick. Application of that August clarification in England has not been independently confirmed. The current World Aquatics interpretation is shown, with this local-applicability issue flagged.","relatedRuleIds":["breast-action","breast-departure-review"]},{"code":"7.4","category":"Breaststroke","title":"Breaststroke arm path and elbows","statement":"The hands travel forward simultaneously from the chest and may pass below, at or above the water. Elbows normally remain submerged; exceptions cover the last stroke into a turn, the turn itself and the last stroke into the finish. The backward hand movement stays at or below the surface and must stop by the hip line, except on the first stroke following a start or turn.","plain":"Send both hands forward together. Keep elbows underwater except at the listed turn and finish moments. Only the first pull after a start or turn may go past your hips.","source":"wa-cr","location":"PDF p. 61","status":"verified","issue":"","relatedRuleIds":["breast-action","breast-pullout"]},{"code":"7.5","category":"Breaststroke","title":"Breaststroke head and leg timing","statement":"Every completed stroke cycle requires some portion of the head to break the water surface. The two legs must move simultaneously; alternating leg actions are prohibited.","plain":"Bring your head through the surface in each full cycle, and move both legs together.","source":"wa-cr","location":"PDF p. 61","status":"verified","issue":"","relatedRuleIds":["breast-action"]},{"code":"7.6","category":"Breaststroke","title":"Breaststroke kick shape","statement":"During the kick’s propulsive phase, the feet are turned outwards. Alternating kicks are prohibited, as are downward butterfly kicks other than the single allowance in rule 7.1. Feet may emerge through the surface provided they are not then used for a downward butterfly kick.","plain":"Turn your feet out for the push. Do not flutter kick or add butterfly kicks; the one allowed pullout kick is the exception.","source":"wa-cr","location":"PDF p. 61","status":"verified","issue":"","relatedRuleIds":["breast-action","breast-pullout"]},{"code":"7.7","category":"Breaststroke","title":"Breaststroke touch and last cycle","statement":"Every turn and finish requires both hands to contact the wall simultaneously. The hands must be separated, meaning that one hand must not be stacked on the other. The touch can be above, at or below the surface. A visible gap is unnecessary and incidental finger contact is acceptable. The final arm stroke into either wall may omit its following kick. The head may go underwater after that last pull if it surfaced during the final full or partial cycle before contact.","plain":"Touch with two hands together in time, but not stacked. You may finish the last pull without a kick and dip your head after it, provided your head surfaced during that final cycle.","source":"wa-cr","location":"PDF p. 61","status":"verified","issue":"","relatedRuleIds":["breast-touch","breast-finish","im-transition"]},{"code":"8.1","category":"Butterfly","title":"Butterfly position when the first pull starts","statement":"For the start of a butterfly swim, breast orientation is required from the moment the first arm action begins. The February provision also mentions turns, but the August World Aquatics commentary removes turns from this clause and directs turn departures to the stricter requirement in rule 8.2.","plain":"After the start, be on your breast when your first pull begins. For a turn, use the separately flagged departure rule 8.2.","source":"wa-cr","location":"PDF p. 62","status":"withheld","issue":"World Aquatics commentary dated 6 August 2026, p. 2, removes the turn reference from 8.1. Its application in England has not been independently confirmed. This row explains the current World Aquatics reading and preserves the distinction from February wording.","relatedRuleIds":["fly-action","fly-departure-review"]},{"code":"8.2","category":"Butterfly","title":"Butterfly orientation when leaving the turn","statement":"Rolling onto the back is prohibited during ordinary butterfly swimming. After touching for a turn, the swimmer may rotate in any direction. Under the August World Aquatics interpretation, the swimmer must have breast orientation on leaving the wall; waiting until the first arm action is not sufficient under that interpretation.","plain":"After your turn touch, turn around and leave the wall on your breast under the latest World Aquatics guidance.","source":"wa-cr","location":"PDF p. 62","status":"withheld","issue":"The February printed clause sets breast orientation at the first arm stroke after departure. World Aquatics commentary dated 6 August 2026, p. 2, instead sets the requirement at departure from the wall. England’s application of this August clarification has not been independently confirmed; the difference is material and remains flagged.","relatedRuleIds":["fly-departure-review"]},{"code":"8.3","category":"Butterfly","title":"Butterfly arm movement","statement":"Butterfly uses simultaneous arm actions: both arms recover forward together above the water, then pull backwards together underwater. The special underwater arm action in rule 8.6 is the exception to this pattern.","plain":"Recover both arms over the water together and pull underwater together.","source":"wa-cr","location":"PDF p. 62","status":"verified","issue":"","relatedRuleIds":["fly-action","fly-underwater"]},{"code":"8.4","category":"Butterfly","title":"Butterfly leg movement","statement":"The upward and downward leg movements must be simultaneous. Unequal leg or foot heights are allowed, but alternating their relative positions is not. A breaststroke-type kick is prohibited.","plain":"Dolphin-kick with both legs together. Your feet can be at slightly different heights, but cannot alternate or make a breaststroke kick.","source":"wa-cr","location":"PDF p. 62","status":"verified","issue":"","relatedRuleIds":["fly-action"]},{"code":"8.5","category":"Butterfly","title":"Butterfly turn and finish touch","statement":"Every turn and finish requires both hands to meet the wall simultaneously. The hands must be separated, meaning that one hand must not be stacked on the other. Contact may be at, above or below the surface. There is no requirement for a visible space between the hands, and incidental finger contact is allowed.","plain":"Touch with both hands at the same time. They must not be stacked; different heights or a little finger contact can be legal.","source":"wa-cr","location":"PDF p. 62","status":"verified","issue":"","relatedRuleIds":["fly-touch","im-transition"]},{"code":"8.6","category":"Butterfly","title":"Butterfly underwater limit and finish exception","statement":"Following a start or turn, completely submerged swimming may include one or more leg kicks and a single arm pull; that pull must bring the swimmer to the surface. The head must already have broken the surface no later than 15 metres from the wall: a first breakout at 15.01 metres is late. Some part of the body otherwise remains at the surface, apart from the turn itself and a finish reach after the head has passed the 5-metre marker.","plain":"One underwater pull must bring you up, and your head must break the surface by 15m. Do not swim a second underwater pull. The last reach to finish has its own 5m exception.","source":"wa-cr","location":"PDF p. 62","status":"verified","issue":"","relatedRuleIds":["fly-underwater","fly-finish"]},{"code":"9.1","category":"Medley","title":"Individual medley stroke order","statement":"Individual medley assigns one quarter of the full distance to each stroke: butterfly first, then backstroke, then breaststroke, then freestyle.","plain":"IM goes fly, back, breast, free, with equal distances.","source":"wa-cr","location":"PDF p. 62","status":"verified","issue":"","relatedRuleIds":["im-order","im-phase"]},{"code":"9.2","category":"Medley","title":"Medley relay stroke order","statement":"A medley relay assigns one quarter of the full distance to each stroke: backstroke first, then breaststroke, then butterfly, then freestyle.","plain":"Medley relay goes back, breast, fly, free, with one equal leg for each swimmer.","source":"wa-cr","location":"PDF p. 62","status":"verified","issue":"","relatedRuleIds":["relay-order","relay-phase"]},{"code":"9.3","category":"Medley","title":"Medley freestyle orientation and turn departure","statement":"During the freestyle quarter of either type of medley, the swimmer maintains breast orientation except during a turn. Departure from a turn on the back is allowed, but rotation beyond vertical towards the breast must occur before any kick or arm stroke. After that rotation, one or more butterfly kicks are permitted.","plain":"In medley freestyle, you may push off on your back, but roll past your side towards your breast before kicking or pulling.","source":"wa-cr","location":"PDF p. 62","status":"verified","issue":"","relatedRuleIds":["im-free"]},{"code":"9.4","category":"Medley","title":"Changing strokes in medley","statement":"Each quarter ends using the finish requirements of the stroke that is being completed.","plain":"Finish the outgoing stroke legally before changing stroke. For back to breast, touch while still on your back; a normal backstroke tumble turn is not a substitute.","source":"wa-cr","location":"PDF p. 62","status":"verified","issue":"","relatedRuleIds":["im-transition","im-phase","relay-phase"]},{"code":"10.1","category":"The race \u0026 relays","title":"Individual competition categories","statement":"Individual events are organised as separate male and female competitions under these regulations.","plain":"These regulations separate the men’s and women’s individual events.","source":"wa-cr","location":"PDF p. 62","status":"verified","issue":"","relatedRuleIds":[]},{"code":"10.2.1","category":"The race \u0026 relays","title":"Complete the required distance","statement":"An individual competitor must cover the event’s full distance; a relay swimmer must cover their own quarter of the total.","plain":"Swim the whole race, or your whole relay leg.","source":"wa-cr","location":"PDF p. 62","status":"verified","issue":"","relatedRuleIds":[]},{"code":"10.2.2","category":"The race \u0026 relays","title":"Use the allocated lane","statement":"The assigned lane is compulsory for the start, the full swim and the finish.","plain":"Stay in your allocated lane from start to finish.","source":"wa-cr","location":"PDF p. 62","status":"verified","issue":"","relatedRuleIds":[]},{"code":"10.2.3","category":"The race \u0026 relays","title":"Turn contact and no step from the bottom","statement":"A turn requires body contact with the wall at the end of the course. The swimmer cannot step or stride from the pool floor. The freestyle standing exception in rule 10.2.4 does not permit walking.","plain":"Touch the end wall to turn; do not step along or push forward by striding off the pool bottom.","source":"wa-cr","location":"PDF p. 62","status":"verified","issue":"","relatedRuleIds":[]},{"code":"10.2.4","category":"The race \u0026 relays","title":"Standing and walking on the pool floor","statement":"Standing or walking on the pool floor is prohibited. Freestyle events and the freestyle quarter of medley permit standing only; walking remains prohibited.","plain":"Only freestyle allows you to stand on the bottom. You still cannot walk.","source":"wa-cr","location":"PDF p. 62","status":"verified","issue":"","relatedRuleIds":[]},{"code":"10.2.5","category":"The race \u0026 relays","title":"No pulling the lane rope","statement":"Using the lane rope to pull oneself along is prohibited.","plain":"Do not pull yourself forward on the lane rope.","source":"wa-cr","location":"PDF p. 62","status":"verified","issue":"","relatedRuleIds":[]},{"code":"10.2.6","category":"The race \u0026 relays","title":"Do not obstruct another swimmer","statement":"A competitor must not obstruct or impede another competitor or otherwise interfere with their swim.","plain":"Give other swimmers a clear race; do not get in their way.","source":"wa-cr","location":"PDF p. 62","status":"verified","issue":"","relatedRuleIds":[]},{"code":"10.2.7","category":"The race \u0026 relays","title":"No entry during somebody else’s race","statement":"A person who is not a competitor in the race must stay out of the pool until every swimmer in that race has covered the required distance.","plain":"Do not jump into someone else’s race, even if the first swimmers have finished.","source":"wa-cr","location":"PDF p. 63","status":"verified","issue":"","relatedRuleIds":[]},{"code":"10.2.8","category":"The race \u0026 relays","title":"Leave after finishing without interference","statement":"After completing the required distance, a swimmer must get out as promptly as possible while avoiding obstruction or interference with anyone still completing the swim.","plain":"Clear the pool promptly and safely without disturbing swimmers who are still racing.","source":"wa-cr","location":"PDF p. 63","status":"verified","issue":"","relatedRuleIds":["relay-exit"]},{"code":"10.2.9","category":"The race \u0026 relays","title":"No pacemaking","statement":"Acting or attempting to act as a pacemaker is prohibited: a swimmer may neither provide nor attempt to provide pacing for another competitor. Using or attempting to use a pacing device or pacing arrangement is also prohibited.","plain":"Do not pace another swimmer or use a pacing device or plan.","source":"wa-cr","location":"PDF p. 63","status":"verified","issue":"","relatedRuleIds":[]},{"code":"10.3","category":"The race \u0026 relays","title":"Disqualification for general race breaches","statement":"The referee decides whether a requirement in 10.2 has been breached. A confirmed breach results in disqualification from the event, except that an unauthorised entry under 10.2.7 disqualifies the entering swimmer from their next scheduled race at the competition.","plain":"Breaking these general race rules can remove you from the result. Jumping into someone else’s race carries the penalty in your next race.","source":"wa-cr","location":"PDF p. 63","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"10.3.1","category":"The race \u0026 relays","title":"Deliberate interference and disciplinary reporting","statement":"If interference under 10.2.6 appears intentional, the referee must inform the management committee. The committee reports it to the host-country federation and the swimmer’s federation as appropriate for possible investigation and discipline. The Aquatics Integrity Unit can also act on World Aquatics event incidents; the relevant authority can act at other competitions.","plain":"Deliberately interfering with a swimmer can lead to action beyond the race disqualification.","source":"wa-cr","location":"PDF p. 63","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"10.4.1","category":"The race \u0026 relays","title":"Relay team size and mixed teams","statement":"A relay team consists of four swimmers. In a mixed relay, that four must comprise two men and two women.","plain":"Relays use four swimmers; a mixed relay uses two men and two women.","source":"wa-cr","location":"PDF p. 63","status":"verified","issue":"","relatedRuleIds":["relay-order"]},{"code":"10.4.2","category":"The race \u0026 relays","title":"Declare the relay order","statement":"The team leader must specify and submit the swimmers’ racing order before the management committee’s stated deadline.","plain":"Give the officials your team order before the deadline.","source":"wa-cr","location":"PDF p. 63","status":"verified","issue":"","relatedRuleIds":["relay-order"]},{"code":"10.4.2.1","category":"The race \u0026 relays","title":"Late relay substitutions","statement":"After the order deadline, changing one relay swimmer for another requires a documented medical emergency and advance approval from the referee, World Aquatics technical delegate or management committee, as applicable.","plain":"A late swimmer change needs evidence of a medical emergency and permission first.","source":"wa-cr","location":"PDF p. 63","status":"verified","issue":"","relatedRuleIds":["relay-order"]},{"code":"10.4.2.2","category":"The race \u0026 relays","title":"Changing the team for a relay final","statement":"The team’s members may differ between heats and finals, provided each chosen swimmer is eligible for that relay event at the competition.","plain":"You may change the eligible swimmers between the relay heat and final.","source":"wa-cr","location":"PDF p. 63","status":"verified","issue":"","relatedRuleIds":["relay-order"]},{"code":"10.4.3","category":"The race \u0026 relays","title":"One relay leg per swimmer","statement":"A competitor cannot appear more than once in the same relay race.","plain":"Each swimmer does one leg only.","source":"wa-cr","location":"PDF p. 63","status":"verified","issue":"","relatedRuleIds":["relay-order"]},{"code":"10.4.4","category":"The race \u0026 relays","title":"Relay exchange departure point","statement":"A relay takeover begins on the starting platform. Starting with a run-up (a running start) from the surrounding pool deck is prohibited.","plain":"Start your takeover from the block; do not run in from poolside.","source":"wa-cr","location":"PDF p. 63","status":"verified","issue":"","relatedRuleIds":["relay-exchange"]},{"code":"10.4.5","category":"The race \u0026 relays","title":"Feet must retain block contact until the touch","statement":"The outgoing relay swimmer’s feet must retain contact with the starting platform until the incoming team member touches the wall at the end of their leg.","plain":"You may move before the touch, but do not lose foot contact with the block until your teammate has touched.","source":"wa-cr","location":"PDF p. 63","status":"verified","issue":"","relatedRuleIds":["relay-exchange"]},{"code":"10.4.6","category":"The race \u0026 relays","title":"Relay team members entering the water","statement":"During a relay, only the team member whose leg is next may enter for their swim. Other team members must not enter or re-enter until every team’s competitors have completed the race distance.","plain":"Unless it is your turn to swim, stay out of the water until everyone has finished.","source":"wa-cr","location":"PDF p. 63","status":"verified","issue":"","relatedRuleIds":["relay-exit"]},{"code":"10.4.7","category":"The race \u0026 relays","title":"Leaving the pool after a relay leg","statement":"A swimmer who has finished a relay leg must get out as promptly as possible without obstructing or interfering with anyone still swimming their leg.","plain":"Leave after your leg without getting in a racing swimmer’s way.","source":"wa-cr","location":"PDF p. 63","status":"verified","issue":"","relatedRuleIds":["relay-exit"]},{"code":"10.5","category":"The race \u0026 relays","title":"Disqualification for a relay breach","statement":"If the referee finds that a swimmer or another person has breached a requirement in 10.4, the relay team is disqualified. If the offender is a swimmer, that swimmer is disqualified too.","plain":"A relay-rule breach can disqualify the whole team.","source":"wa-cr","location":"PDF p. 63","status":"verified","issue":"","relatedRuleIds":["official-process","relay-exchange","relay-exit"]},{"code":"10.6","category":"The race \u0026 relays","title":"Opportunity to swim again after interference","statement":"When a swimmer’s breach of 10.2 or 10.4 damages another swimmer’s or relay team’s chances, the referee may let the affected competitor or team race in the next heat. If the incident was in the last heat or a final, the referee may order that heat or final to be repeated. Both the finding and remedy are at the referee’s discretion.","plain":"If someone else’s breach spoils your race, the referee may give you another swim; it is not automatic.","source":"wa-cr","location":"PDF p. 63","status":"verified","issue":"","relatedRuleIds":["official-process"]},{"code":"11.1","category":"Timing and results","title":"Rules when electronic timing is used","statement":"The requirements in 11.1 apply when automatic officiating equipment is used and, where relevant, when semi-automatic equipment is used.","plain":"Use the electronic-timing provisions for an electronically timed race; the separate rules in 11.2 cover races without either system.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.1.1","category":"Timing and results","title":"Officials supervise the timing system","statement":"The officials appointed for this role must oversee operation of the automatic officiating equipment.","plain":"Electronic timing remains under official supervision.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.1.2","category":"Timing and results","title":"Electronic times determine placings","statement":"The automatic system must record each competitor’s time for the full course and establish the winner and other placings from those times. Matching times produce matching placings.","plain":"Equal recorded times mean a tie; a separate visual impression does not by itself break it.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.1.3","category":"Timing and results","title":"Electronic timing takes priority when functioning","statement":"Automatic times and the placings derived from them are presumed correct and take priority over manual times or Finish Judges’ placings. The Control Room Supervisor must tell the Referee that the automatic equipment suffered no malfunction, breakdown or failure during the race.","plain":"The electronic result is the first reference, with the required check that the equipment worked. If it failed, the following backup procedures apply.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.1.4","category":"Timing and results","title":"Electronic timing accuracy","statement":"Automatic equipment must record race times accurately to 0.01 seconds.","plain":"Timing accuracy is one hundredth of a second.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.1.5","category":"Timing and results","title":"Electronic results displayed to hundredths","statement":"Every output of the race result, including the venue scoreboard and official result reports, must display times to hundredths of a second.","plain":"The public display and the official results must use the same two-decimal precision.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.1.6","category":"Timing and results","title":"Recovering placings after electronic failure","statement":"If automatic equipment does not record a time, a placing, or both for one or more competitors, the Referee must gather the available evidence and determine official placings under 11.1.6.1–11.1.6.2.3.","plain":"A missed electronic result triggers the prescribed backup procedure; it does not mean inventing a time or ignoring the remaining valid electronic results.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.1.6.1","category":"Timing and results","title":"Gather all available timing evidence","statement":"After the relevant automatic recording failure, the Referee must assemble every available time and placing from the automatic system, Timekeepers and any appointed Finish Judges.","plain":"Collect the electronic and official manual evidence before reconstructing the result.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.1.6.2","category":"Timing and results","title":"Determine official placings after a failure","statement":"The Referee must establish the official order using the three cases in 11.1.6.2.1–11.1.6.2.3, according to the automatic information available for each competitor.","plain":"The method depends on whether that swimmer has both an electronic time and placing, a time alone, or neither.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.1.6.2.1","category":"Timing and results","title":"Preserve order between valid automatic results","statement":"Competitors with both an automatic time and an automatic placing must keep their relative order against every other competitor in that race who also has both records.","plain":"Filling a gap in the result must not swap the order of swimmers whose complete automatic results are valid.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.1.6.2.2","category":"Timing and results","title":"Automatic time available but placing missing","statement":"If a competitor has an automatic time but no automatic placing, determine the placing by comparing that time with the automatic times of competitors who have both automatic times and placings in the same race.","plain":"A valid electronic time can be used to put that swimmer into the finishing order even if the placing field is missing.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.1.6.2.3","category":"Timing and results","title":"No automatic time or placing available","statement":"Where no automatic time or placing is available for a competitor, determine the placing by comparing the semi-automatic or Timekeepers’ time with the times of competitors in that race who have both automatic times and placings.","plain":"Use the permitted backup time to fit the swimmer into the remaining valid electronic result.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.1.7","category":"Timing and results","title":"Official times after electronic failure","statement":"When automatic equipment misses a time or placing for one or more swimmers, assign each official time using 11.1.7.1 and 11.1.7.2.","plain":"The decision about the official time is separate from reconstructing the placing.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.1.7.1","category":"Timing and results","title":"Keep an available automatic time","statement":"If the automatic equipment recorded a competitor’s time, that recorded time is the official time.","plain":"A missing placing does not discard a valid automatic time.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.1.7.2","category":"Timing and results","title":"Use backup when the automatic time is missing","statement":"If the automatic equipment did not record a competitor’s time, the official time must come from semi-automatic equipment or the Timekeepers.","plain":"Use the recognised backup source for a missing electronic time.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.2","category":"Timing and results","title":"Rules without electronic officiating equipment","statement":"The provisions in 11.2 apply when neither automatic nor semi-automatic officiating equipment is used.","plain":"These are the rules for a race timed by the appointed Timekeepers without either electronic officiating system.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.2.1","category":"Timing and results","title":"Manual times determine placings","statement":"Timekeepers must record the competitors’ course times, and the Referee must use those times to establish the winner and placings. Competitors with matching times receive the same placing.","plain":"In this timing arrangement, equal official manual times remain tied.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.2.2","category":"Timing and results","title":"Approved Timekeepers and accurate devices","statement":"Each Timekeeper must be appointed or approved by the member federation of the host country. Every watch or other timing device must have accuracy certification satisfactory to that federation.","plain":"Both the person timing and the accuracy of their device need the required federation acceptance.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.2.3","category":"Timing and results","title":"Two Timekeepers for each manual time","statement":"Two Timekeepers must record each competitor’s course time to hundredths of a second. The official time is then determined using the comparison and failure procedures in 11.2.3.1–11.2.3.3.","plain":"Take two independent times and use the specified method, rather than choosing whichever result is preferred.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.2.3.1","category":"Timing and results","title":"Average differing watches without rounding","statement":"If the two watches disagree, the official time is their average. When the average has a third decimal place, discard that final digit; do not apply a rounding adjustment.","plain":"For example, 60.01 and 60.02 seconds average to 60.015, which is recorded as 60.01 seconds, not 60.02.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.2.3.2","category":"Timing and results","title":"One watch fails","statement":"If one of the two timing devices fails, use the time shown by the device that worked as the official time.","plain":"One functioning official watch supplies the time when its partner fails.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.2.3.3","category":"Timing and results","title":"Both watches fail","statement":"If neither watch produces a usable time because both have failed, a reswim may be offered to the competitor.","plain":"A reswim is permitted here, but this clause does not make it automatic.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.2.4","category":"Timing and results","title":"Manual results displayed to hundredths","statement":"All outputs of manually timed race results must present times to hundredths of a second.","plain":"Publish the official manual time with two decimal places.","source":"wa-cr","location":"PDF p. 64","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.3","category":"Timing and results","title":"Individual disqualification in the results","statement":"An individual-race or individual-event disqualification must appear in the official results. No time or placing for that performance may be recorded or announced.","plain":"The result records the disqualification instead of giving the disqualified swim a time and placing.","source":"wa-cr","location":"PDF p. 65","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.4","category":"Timing and results","title":"Relay disqualification and earlier legal splits","statement":"A disqualification during or after a relay must be shown in the official results, without a relay time or placing being recorded or announced. However, legal splits achieved by teammates before the disqualified swimmer participated must remain in the official results.","plain":"A relay disqualification removes the team result, while the specifically permitted earlier legal splits are retained.","source":"wa-cr","location":"PDF p. 65","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.5","category":"Timing and results","title":"Publish the first relay swimmer’s splits","statement":"The automatic system, semi-automatic system or Timekeepers, as applicable, must record the first swimmer’s 50 m and 100 m relay splits and publish those splits in the official results.","plain":"The first leg’s applicable 50 m and 100 m split readings are part of the published results; a split can only exist for a distance that swimmer completes.","source":"wa-cr","location":"PDF p. 65","status":"verified","issue":"","relatedRuleIds":[]},{"code":"11.6","category":"Timing and results","title":"Combine heats by official time","statement":"Rank competitors across the combined heats by their official times. Matching official times share the placing. In a displayed list, tied competitors are ordered by descending lane number, with alphabetical order used if the lane numbers are also equal.","plain":"Swimmers in different heats are compared by time. The listing order for tied names does not remove the tie.","source":"wa-cr","location":"PDF p. 65","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.1","category":"World records","title":"World-record events in a 50 m pool","statement":"World and World Junior Records are recognised in 50 m pools for both sexes in these events: freestyle 50, 100, 200, 400, 800 and 1500 m; backstroke 50, 100 and 200 m; breaststroke 50, 100 and 200 m; butterfly 50, 100 and 200 m; individual medley 200 and 400 m; freestyle relays 4 × 100 and 4 × 200 m; medley relay 4 × 100 m. The mixed relay categories are 4 × 100 m freestyle and 4 × 100 m medley.","plain":"The long-course record programme includes those distances and relay combinations. It does not include a 100 m individual medley or 4 × 50 m relay category under this clause.","source":"wa-cr","location":"PDF p. 65","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.2","category":"World records","title":"World-record events in a 25 m pool","statement":"World and World Junior Records are recognised in 25 m pools for both sexes in these events: freestyle 50, 100, 200, 400, 800 and 1500 m; backstroke 50, 100 and 200 m; breaststroke 50, 100 and 200 m; butterfly 50, 100 and 200 m; individual medley 100, 200 and 400 m; freestyle relays 4 × 50, 4 × 100 and 4 × 200 m; medley relays 4 × 50 and 4 × 100 m. The mixed relay categories are 4 × 50 m freestyle and 4 × 50 m medley.","plain":"The short-course programme adds 100 m individual medley and 4 × 50 m relays. Its listed mixed-relay record events are 4 × 50 m, unlike the 4 × 100 m long-course list.","source":"wa-cr","location":"PDF p. 65","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.3","category":"World records","title":"Record eligibility requires all relevant rules","statement":"A proposed World Record or World Junior Record must comply with every relevant World Aquatics rule, including these competition regulations and the requirements listed under 12.3. The listed criteria are not exhaustive.","plain":"A fast enough time alone is insufficient; all applicable record requirements must be met.","source":"wa-cr","location":"PDF p. 65","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.3.1","category":"World records","title":"Permitted swimwear for a record","statement":"For record eligibility, the swimmer must have worn only swimwear permitted under Part One, Article 6.","plain":"Record eligibility depends on compliance with the official swimwear requirements.","source":"wa-cr","location":"PDF p. 65","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.3.2","category":"World records","title":"World Junior Record age window","statement":"A World Junior Record applicant must be aged 14, 15, 16, 17 or 18 on 31 December of the calendar year in which the performance occurred.","plain":"The junior-record age test uses the end of the performance year, not the swimmer’s age on race day.","source":"wa-cr","location":"PDF p. 65","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.3.3","category":"World records","title":"One sporting nationality for a record relay","statement":"Every member of a relay claiming a World Record or World Junior Record must share the same sporting nationality as determined by Part One, Article 3.","plain":"A record relay must meet the common sporting-nationality requirement; this app does not add a separate nationality test.","source":"wa-cr","location":"PDF p. 65","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.3.4","category":"World records","title":"Individual record from a relay lead-off","statement":"Only the swimmer covering the first quarter of a relay may claim an individual World Record or World Junior Record from that relay. If that swimmer is not disqualified, their performance remains eligible when the team is disqualified for a reason arising or identified after that swimmer has finished.","plain":"An eligible first-leg swim can stand as an individual record even if a later team problem disqualifies the relay, provided the lead-off swimmer is not themselves disqualified.","source":"wa-cr","location":"PDF p. 65","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.3.5","category":"World records","title":"Match or improve the existing record","statement":"The performance must be at least as fast as the existing World Record or World Junior Record.","plain":"Equalling the current record can qualify; a slower swim cannot.","source":"wa-cr","location":"PDF p. 66","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.3.5.1","category":"World records","title":"Equal record time and joint holders","statement":"A swimmer who equals the existing record to hundredths of a second may apply to be recognised as a joint holder of that World Record or World Junior Record.","plain":"Matching the official record time can earn shared record-holder status.","source":"wa-cr","location":"PDF p. 66","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.3.5.2","category":"World records","title":"One winner when several swimmers beat a record","statement":"If several swimmers in a race equal or improve the existing record but there is a single winner, only that winner may apply for record recognition, unless the World Junior Record exception in 12.3.5.3 applies.","plain":"Beating the old record in the same race as a faster eligible winner does not normally give the runner-up that record.","source":"wa-cr","location":"PDF p. 66","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.3.5.3","category":"World records","title":"Junior-record exception for a nonwinner","statement":"A swimmer who equals or improves the World Junior Record without winning may apply for that junior record if no better-placed swimmer who is eligible for it also set a World Junior Record in the race.","plain":"A junior can set the junior record while finishing behind an older swimmer, provided no better-placed eligible junior has also achieved the record.","source":"wa-cr","location":"PDF p. 66","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.3.5.4","category":"World records","title":"Joint winners and record recognition","statement":"If several swimmers win a race jointly and equal or improve the existing World Record or World Junior Record, every joint winner may apply for recognition of the qualifying record performance.","plain":"A tie for first can produce joint record holders.","source":"wa-cr","location":"PDF p. 66","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.3.6","category":"World records","title":"Intermediate-distance record requires the full race","statement":"A split at an intermediate distance in an individual race may qualify for a record, but the swimmer must complete the entire entered race distance. Stopping after the record split or at any shorter distance does not meet this requirement.","plain":"A swimmer seeking a record at an intermediate split must still finish the longer race.","source":"wa-cr","location":"PDF p. 66","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.3.7","category":"World records","title":"Conditions surrounding a record performance","statement":"The record attempt must satisfy the timing, water, event and pool-measurement conditions specified in 12.3.7.1–12.3.7.5.","plain":"The setting and verification of the swim matter as well as the recorded time.","source":"wa-cr","location":"PDF p. 66","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.3.7.1","category":"World records","title":"Electronic timing required for a record","statement":"The record performance must be measured by automatic officiating equipment. Semi-automatic equipment is acceptable only when the automatic system malfunctions.","plain":"A watch-only time is not enough for these world-record provisions; the stated electronic backup exception requires an automatic-system failure.","source":"wa-cr","location":"PDF p. 66","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.3.7.2","category":"World records","title":"Salt content and no sea-water records","statement":"The water must contain less than 3 grams of salt per litre. A performance in sea or ocean water cannot qualify.","plain":"The threshold is strictly below 3 g/L, and the rule separately excludes all sea or ocean water.","source":"wa-cr","location":"PDF p. 66","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.3.7.3","category":"World records","title":"Competition swim or publicly announced time trial","statement":"The performance must occur in ordinary competition or in a publicly held individual race against the clock advertised at least three days beforehand. The advance-advertising condition does not apply to a time trial sanctioned by a member federation during a competition.","plain":"A separate record attempt normally needs public access and three days’ public notice; the named federation-sanctioned competition time-trial exception removes the advertising requirement.","source":"wa-cr","location":"PDF p. 66","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.3.7.4","category":"World records","title":"Certify the actual record lane length","statement":"The length of the particular lane used for the performance must be certified by a surveyor or another qualified official appointed or approved by the member federation of the country where the pool is located.","plain":"Certification must cover the lane in which the record was swum, not merely an assumed pool length.","source":"wa-cr","location":"PDF p. 66","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.3.7.5","category":"World records","title":"Recheck a movable-bulkhead course after the session","statement":"If the course uses a movable bulkhead, the record lane’s length must be confirmed at the end of the session in which the swim took place by a surveyor or other qualified official appointed or approved by the host-country member federation.","plain":"A movable wall requires the specified end-of-session length confirmation.","source":"wa-cr","location":"PDF p. 66","status":"verified","issue":"The source sentence repeats its final confirmation phrase. Its requirement is restated once here without adding a different measurement deadline.","relatedRuleIds":[]},{"code":"12.3.8","category":"World records","title":"Anti-doping sample deadline for record recognition","statement":"For an individual record, a sample must be collected from the swimmer immediately after the performance or, at the latest, within 24 hours after the race ends, and the analysis must be negative. For a relay record, samples must be collected from all four swimmers in the finals relay team within the same immediate-to-24-hour window, and every analysis must be negative.","plain":"The record requirement includes timely sample collection and negative findings. The relay wording specifies all four members of the finals team; no further anti-doping procedures are invented here.","source":"wa-cr","location":"PDF p. 66","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.4","category":"World records","title":"Automatic approval at named WA events","statement":"Qualifying records achieved at the Olympic Games, World Aquatics Championships, World Aquatics Swimming Championships (25m), World Aquatics Junior Swimming Championships or World Aquatics Swimming World Cups are approved automatically only when all record conditions have been met.","plain":"The named events have automatic approval, but the performance still has to meet every applicable record condition.","source":"wa-cr","location":"PDF p. 66","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.5","category":"World records","title":"Application route for records at other competitions","statement":"Records achieved outside the Olympic Games, World Aquatics Championships, World Aquatics Swimming Championships (25m), World Aquatics Junior Swimming Championships and Swimming World Cup must follow the application procedure in 12.5.1–12.5.4.","plain":"A record at another meet needs the formal reporting and application route.","source":"wa-cr","location":"PDF p. 66","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.5.1","category":"World records","title":"Provisional record notice within seven days","statement":"An authorised representative of the meet’s management committee must send the Executive Director a written provisional record notification within seven days after the performance.","plain":"The first written notification has a seven-day deadline.","source":"wa-cr","location":"PDF p. 66","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.5.2","category":"World records","title":"Referee’s record application within fourteen days","statement":"Within fourteen days after the performance, the Referee must file the record application with the Executive Director using the official World Aquatics form and certify compliance with 12.3.","plain":"The formal application is the Referee’s responsibility and has a fourteen-day deadline.","source":"wa-cr","location":"PDF p. 66","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.5.3","category":"World records","title":"Review, declaration and publication of a record","statement":"On receiving the application, the Executive Director must assess compliance with 12.3. If the requirements are met, the record must be declared and published, and the relevant swimmers must receive diplomas.","plain":"Recognition follows the required review; the declaration and certificates follow a compliant application.","source":"wa-cr","location":"PDF p. 67","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.5.4","category":"World records","title":"Federation application when the meet procedure failed","statement":"If the management committee failed to follow all or part of the filing procedure, the swimmer’s member federation may submit an application on the official form. The Executive Director must assess compliance with 12.3 and, if satisfied, declare and publish the record and provide the relevant diplomas.","plain":"The federation has an alternative filing route when the meet’s process was not completed. This clause does not state an extra deadline or waive the record conditions.","source":"wa-cr","location":"PDF p. 67","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.6","category":"World records","title":"Diploma for an individual record","statement":"After approving an individual record, the Executive Director must send the swimmer’s member federation a diploma signed by the World Aquatics President for presentation to the swimmer.","plain":"The individual record certificate reaches the swimmer through their federation.","source":"wa-cr","location":"PDF p. 67","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.7","category":"World records","title":"Five diplomas for a relay record","statement":"After approving a relay record, the Executive Director must send the team’s member federation five diplomas signed by the World Aquatics President: one for the federation to keep and one for each of the four swimmers.","plain":"A recognised relay record receives a federation certificate plus four swimmer certificates.","source":"wa-cr","location":"PDF p. 67","status":"verified","issue":"","relatedRuleIds":[]},{"code":"12.8","category":"World records","title":"Additional record categories and target times","statement":"World Aquatics may create further World Record or World Junior Record categories with different strokes, distances or other variables. It must set a target time for a new category. A swim faster than that target may qualify, provided 12.3 is also met.","plain":"World Aquatics can introduce a new record category. Its initial target must be beaten, rather than merely equalled.","source":"wa-cr","location":"PDF p. 67","status":"verified","issue":"","relatedRuleIds":[]},{"code":"13.1","category":"Age groups and eligibility","title":"Age range for the World Junior Championships","statement":"Eligibility for the World Aquatics Junior Swimming Championships requires an age of 14, 15, 16, 17 or 18 on 31 December of the year in which the competition starts.","plain":"For this championship, calculate age at the end of the competition’s starting year; race-day age is not the test.","source":"wa-cr","location":"PDF p. 67","status":"verified","issue":"","relatedRuleIds":[]},{"code":"13.2","category":"Age groups and eligibility","title":"Age eligibility at the named senior championships","statement":"For the Olympic Games, World Aquatics Championships and World Aquatics Swimming Championships (25m), a swimmer must qualify through either the age route in 13.2.1 or the younger-swimmer standard in 13.2.2.","plain":"There are two alternative routes for these named events; meeting both is not required.","source":"wa-cr","location":"PDF p. 67","status":"verified","issue":"","relatedRuleIds":[]},{"code":"13.2.1","category":"Age groups and eligibility","title":"Standard age route for named senior events","statement":"For the events covered by 13.2, a swimmer qualifies through this age route if they will be at least 14 on 31 December of the year in which the competition starts.","plain":"Turning 14 at any point in that calendar year meets this age condition; other event entry requirements still apply.","source":"wa-cr","location":"PDF p. 67","status":"verified","issue":"","relatedRuleIds":[]},{"code":"13.2.2","category":"Age groups and eligibility","title":"Under-14 route using the B entry standard","statement":"A swimmer who will still be under 14 on 31 December of the competition’s starting year may qualify for an event under 13.2 if they have achieved at least that event’s B entry-time standard.","plain":"A younger swimmer needs the relevant event’s B standard for this exception. It is not an unrestricted age exemption.","source":"wa-cr","location":"PDF p. 67","status":"verified","issue":"","relatedRuleIds":[]},{"code":"13.3","category":"Age groups and eligibility","title":"Domestic and other organisers may set age rules","statement":"Member federations and meet organisers may use these age rules, alternative rules, or a combination for competitions within their authority.","plain":"Do not assume that a local meet uses the World Championship age limits; its own applicable conditions must be checked.","source":"wa-cr","location":"PDF p. 67","status":"verified","issue":"","relatedRuleIds":[]},{"code":"14.1","category":"Swimwear \u0026 technology","title":"Permitted competition swimwear","statement":"A competitor must wear a swimsuit. Goggles and a cap are optional. Each item must meet the swimwear provisions in Part One, Article 6.","plain":"Wear an approved racing suit; goggles and a cap are allowed when they meet the governing swimwear requirements.","source":"wa-cr","location":"p67","status":"verified","issue":"","relatedRuleIds":[]},{"code":"14.2","category":"Swimwear \u0026 technology","title":"No unauthorised performance aids","statement":"During competition, athletes must not use devices or swimwear that could assist speed, buoyancy or endurance, apart from swimwear permitted by the regulations. Examples include webbed gloves, fins and flippers. The August World Aquatics commentary identifies the adhesive-substance example as glue and expressly permits tape and nasal strips under this clause. Injury-taping provisions are addressed separately in 14.4.","plain":"Under the latest World Aquatics clarification, tape and nasal strips are permitted under this clause. This does not remove the ban on other unauthorised performance aids; injury taping is addressed in 14.4.","source":"wa-cr","location":"p67","status":"withheld","issue":"World Aquatics commentary dated 6 August 2026, p. 2, clarifies that the adhesive-substance wording refers to glue and permits tape and nasal strips under this clause. Specific English application of that August clarification has not been independently confirmed. The latest World Aquatics guidance is shown; this is not an unqualified English disqualification conclusion.","relatedRuleIds":[]},{"code":"14.3","category":"Swimwear \u0026 technology","title":"Data collection without feedback","statement":"An automated device may be used solely to collect data. It must neither be able to send, nor be used to send, information, sound or signals to the competitor. It must also neither be able to assist, nor be used to assist, speed, flotation or endurance.","plain":"A recorder may collect information, but it cannot coach or signal to you during the race or provide a performance advantage.","source":"wa-cr","location":"p67","status":"verified","issue":"","relatedRuleIds":[]},{"code":"14.4","category":"Swimwear \u0026 technology","title":"Injury tape: fingers, toes and other body parts","statement":"The February text permits injury-treatment or protection tape on one or two fingers or toes, including binding two together. The August World Aquatics commentary extends the stated permission to tape used to treat or protect injuries on other parts of the body. It does not create a general permission to use any tape for performance assistance.","plain":"The latest World Aquatics guidance allows injury-protection tape beyond fingers and toes. The local application of that August clarification still needs checking for England.","source":"wa-cr","location":"p67","status":"withheld","issue":"World Aquatics commentary dated 6 August 2026, p. 2, explicitly extends injury-treatment/protection taping to other body parts. English application of that August clarification has not been independently confirmed. The narrow February wording and later guidance are both shown.","relatedRuleIds":[]},{"code":"15.1.1.1","category":"Pool \u0026 equipment","title":"50 m racing distance with touch panels","statement":"Where automatic timing touch panels are fitted at either or both ends of a 50 m pool, the pool construction must preserve the required 50.000 m racing distance between the effective end surfaces.","pl
